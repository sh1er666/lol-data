<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H·武道会·数据展示</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { background-color: #1a1d24; color: #eee; font-family: 'Microsoft YaHei', sans-serif; margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 1300px; background: #15181e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6); }
        .title { text-align: center; font-size: 32px; font-weight: 800; letter-spacing: 3px; color: #fff; padding: 10px 0; border-bottom: 1px solid #2f3540; }
        
        /* 顶部控制器布局 */
        .control-bar { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
        
        /* 下拉框样式 */
        .team-select { background: #2a2f38; border: 1px solid #333a45; color: #ccc; padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; outline: none; appearance: none; text-align: center; }
        .team-select:hover { background: #3a3f4a; color: #fff; }
        .team-select option { background: #1a1d24; color: #eee; }

        /* 位置选择器样式 */
        .pos-btn { background: #2a2f38; border: 1px solid #333a45; color: #ccc; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .pos-btn:hover { background: #3a3f4a; color: #fff; }
        .pos-btn.active { background: #7a3df0; color: #fff; border-color: #7a3df0; }

        .main-area { display: flex; justify-content: space-between; gap: 20px; align-items: center; }
        
        /* 左侧英雄池 */
        .left-panel { width: 25%; display: flex; flex-direction: column; gap: 10px; }
        .hero-pool-title { background: #7a3df0; color: #fff; text-align: center; padding: 8px 0; border-radius: 20px; font-weight: bold; font-size: 15px; letter-spacing: 1px; }
        .hero-pool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .hero-item { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
        .hero-games { position: absolute; top: -5px; left: 5px; color: #fff; font-weight: 800; font-size: 14px; }
        .hero-icon { width: 70px; height: 70px; border-radius: 10px; margin-bottom: 5px; background: #2a2f38; border: 2px solid #333a45; }
        .hero-win { color: #ccc; font-size: 12px; font-weight: bold; }
        .hero-kda { color: #888; font-size: 11px; margin-top: 2px; }

        /* 中间单个选手信息（名字和KDA同排） */
        .player-info { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .player-avatar { width: 160px; height: 160px; object-fit: cover; border-radius: 8px; }
        .player-meta { display: flex; align-items: baseline; gap: 15px; margin-top: 5px; }
        .player-name { font-size: 24px; font-weight: 800; }
        .player-total-kda { font-size: 18px; color: #aaa; font-weight: 600; letter-spacing: 1px; }

        /* 右侧雷达图（中心上移，保持饱满） */
        .right-panel { width: 55%; position: relative; height: 760px; display: flex; justify-content: center; align-items: center; }
        #radarChart, .stats-wrapper { width: 520px; height: 520px; position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); }
        .stats-wrapper { pointer-events: none; }
        
        /* 位置布局（贴近雷达点） */
        .stat-item { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; transform: translate(-50%, -50%); line-height: 1.5; width: 150px; white-space: nowrap; }
        .stat-rank { color: #fcd34d; font-size: 13px; font-weight: bold; }
        .stat-val-blue { color: #00bcd4; font-weight: 800; font-size: 14px; }
        .stat-name { color: #eee; font-weight: 600; font-size: 14px; }
        .stat-val-red { color: #ff5252; font-size: 13px; }
        
        /* 极坐标定位（根据中心 45% 推算出的贴近位置） */
        .pos-top { top: 5%; left: 50%; }
        .pos-topright { top: 15%; left: 85%; }
        .pos-right { top: 45%; left: 96%; }
        .pos-bottomright { bottom: 20%; left: 85%; }
        .pos-bottom { bottom: 8%; left: 50%; }
        .pos-bottomleft { bottom: 20%; left: 15%; }
        .pos-left { top: 45%; left: 4%; }
        .pos-topleft { top: 15%; left: 15%; }

        .avg-note { position: absolute; right: 10px; top: 20px; color: #888; font-size: 13px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 6px; z-index: 10; }

        /* 底部柱形图样式（固定在下方） */
        .bottom-stats { position: absolute; bottom: 10px; left: 0; width: 100%; display: flex; justify-content: space-between; gap: 15px; padding: 0 10px; }
        .stat-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .mini-stat { background: rgba(255,255,255,0.03); border: 1px solid #333a45; border-radius: 6px; padding: 6px 10px; position: relative; overflow: hidden; }
        .mini-stat-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
        .mini-stat-name { color: #888; }
        .mini-stat-val { color: #fff; font-weight: bold; }
        .mini-stat-val.blue { color: #00bcd4; }
        .mini-stat-val.red { color: #ff5252; }
        .mini-stat-rank { color: #fcd34d; font-size: 12px; font-weight: bold; }
        .bar-bg { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #333; }
        .bar-fill { height: 100%; width: 0%; background: #00bcd4; }
        .bar-fill.red { background: #ff5252; }
    </style>
</head>
<body>
<div class="container">
    <div class="title">H·武道会·中单数据展示</div>
    
    <!-- 控制区：战队下拉框 + 位置按钮 -->
    <div class="control-bar">
        <select class="team-select" id="teamSelect"></select>
        <div class="position-selector" id="positionSelector">
            <button class="pos-btn" data-pos="TOP">上单</button>
            <button class="pos-btn" data-pos="JUNGLE">打野</button>
            <button class="pos-btn active" data-pos="MIDDLE">中单</button>
            <button class="pos-btn" data-pos="BOTTOM">下路</button>
            <button class="pos-btn" data-pos="UTILITY">辅助</button>
        </div>
    </div>

    <div class="main-area">
        <div class="left-panel">
            <div class="hero-pool-title">英雄池 (<span id="heroCount">0</span>只)</div>
            <div class="hero-pool-grid" id="heroPool"></div>
        </div>
        
        <!-- 中间选手信息 -->
        <div class="player-info">
            <img class="player-avatar" id="playerAvatar" src="https://q1.qlogo.cn/g?b=qq&nk=854265242&s=640" onerror="this.src='https://via.placeholder.com/200'">
            <div class="player-meta">
                <div class="player-name" id="playerName">加载中...</div>
                <div class="player-total-kda" id="totalKda">0/0/0</div>
            </div>
        </div>
        
        <div class="right-panel">
            <div id="radarChart"></div>
            <div class="stats-wrapper">
                <div class="stat-item pos-top"><div class="stat-rank" id="rank-kda">#-</div><div class="stat-val-blue" id="stat-kda">--</div><div class="stat-name">KDA</div><div class="stat-val-red" id="avg-kda">--</div></div>
                <div class="stat-item pos-topright"><div class="stat-rank" id="rank-cs">#-</div><div class="stat-val-blue" id="stat-cs">--</div><div class="stat-name">分均补刀</div><div class="stat-val-red" id="avg-cs">--</div></div>
                <div class="stat-item pos-right"><div class="stat-rank" id="rank-dmg">#-</div><div class="stat-val-blue" id="stat-dmg">--</div><div class="stat-name">分均伤害</div><div class="stat-val-red" id="avg-dmg">--</div></div>
                <div class="stat-item pos-bottomright"><div class="stat-rank" id="rank-part">#-</div><div class="stat-val-blue" id="stat-part">--</div><div class="stat-name">参与击杀</div><div class="stat-val-red" id="avg-part">--</div></div>
                <div class="stat-item pos-bottom"><div class="stat-rank" id="rank-gold">#-</div><div class="stat-val-blue" id="stat-gold">--</div><div class="stat-name">分均经济</div><div class="stat-val-red" id="avg-gold">--</div></div>
                <div class="stat-item pos-bottomleft"><div class="stat-rank" id="rank-share">#-</div><div class="stat-val-blue" id="stat-share">--</div><div class="stat-name">伤害占比</div><div class="stat-val-red" id="avg-share">--</div></div>
                <div class="stat-item pos-left"><div class="stat-rank" id="rank-conv">#-</div><div class="stat-val-blue" id="stat-conv">--</div><div class="stat-name">伤转</div><div class="stat-val-red" id="avg-conv">--</div></div>
                <div class="stat-item pos-topleft"><div class="stat-rank" id="rank-surv">#-</div><div class="stat-val-blue" id="stat-surv">--</div><div class="stat-name">生存</div><div class="stat-val-red" id="avg-surv">--</div></div>
            </div>

            <div class="bottom-stats">
                <div class="stat-col">
                    <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">POM</span><span class="mini-stat-val blue" id="stat-pom">--</span><span class="mini-stat-rank" id="rank-pom">#-</span></div><div class="bar-bg"><div class="bar-fill" id="bar-pom"></div></div></div>
                    <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">单杀</span><span class="mini-stat-val blue" id="stat-solo">--</span><span class="mini-stat-rank" id="rank-solo">#-</span></div><div class="bar-bg"><div class="bar-fill" id="bar-solo"></div></div></div>
                    <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">一血参与率</span><span class="mini-stat-val blue" id="stat-fb">--</span><span class="mini-stat-rank" id="rank-fb">#-</span></div><div class="bar-bg"><div class="bar-fill" id="bar-fb"></div></div></div>
                </div>
                <div class="stat-col">
                    <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">对位等级差</span><span class="mini-stat-val blue" id="stat-lane">--</span><span class="mini-stat-rank" id="rank-lane">#-</span></div><div class="bar-bg"><div class="bar-fill" id="bar-lane"></div></div></div>
                    <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">对位经济差</span><span class="mini-stat-val blue" id="stat-gdiff">--</span><span class="mini-stat-rank" id="rank-gdiff">#-</span></div><div class="bar-bg"><div class="bar-fill" id="bar-gdiff"></div></div></div>
                    <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">对线期经济差</span><span class="mini-stat-val blue" id="stat-early">--</span><span class="mini-stat-rank" id="rank-early">#-</span></div><div class="bar-bg"><div class="bar-fill" id="bar-early"></div></div></div>
                </div>
                <div class="stat-col">
                    <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">参团率</span><span class="mini-stat-val blue" id="stat-partrate">--</span><span class="mini-stat-rank" id="rank-partrate">#-</span></div><div class="bar-bg"><div class="bar-fill" id="bar-partrate"></div></div></div>
                    <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">承伤占比</span><span class="mini-stat-val blue" id="stat-taken">--</span><span class="mini-stat-rank" id="rank-taken">#-</span></div><div class="bar-bg"><div class="bar-fill" id="bar-taken"></div></div></div>
                    <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">分均视野</span><span class="mini-stat-val blue" id="stat-vision">--</span><span class="mini-stat-rank" id="rank-vision">#-</span></div><div class="bar-bg"><div class="bar-fill" id="bar-vision"></div></div></div>
                </div>
            </div>

            <div class="avg-note"><span style="color:#ff5252;">红色</span> 为全队平均值</div>
        </div>
    </div>
</div>

<script>
    let currentData = []; 
    let avgStats = {}; 
    let currentPosition = 'MIDDLE'; 
    let myChart = null;

    async function loadData() {
        try {
            const res = await fetch('./data.json');
            const json = await res.json();
            avgStats = json.find(item => item.avg_kda !== undefined);
            currentData = json.filter(item => item.avg_kda === undefined);

            // 动态生成战队下拉框（自动识别所有队伍，包括EDG/RNG）
            const teamSet = new Set(currentData.map(p => p.player.split(' ')[0]));
            const teamSelect = document.getElementById('teamSelect');
            let optionsHtml = `<option value="ALL">全部战队</option>`;
            teamSet.forEach(team => {
                optionsHtml += `<option value="${team}">${team}</option>`;
            });
            teamSelect.innerHTML = optionsHtml;

            // 下拉框切换事件
            teamSelect.addEventListener('change', () => {
                updateView();
            });

            // 绑定位置按钮事件
            document.querySelectorAll('.pos-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentPosition = e.target.dataset.pos;
                    updateView();
                });
            });

            updateView();
        } catch (error) {
            console.error('加载数据失败:', error);
            document.getElementById('playerName').textContent = '数据加载失败';
        }
    }

    function updateView() {
        const selectedTeam = document.getElementById('teamSelect').value;
        let filteredPlayers = currentData.filter(p => p.position === currentPosition);
        
        if (selectedTeam !== 'ALL') {
            filteredPlayers = filteredPlayers.filter(p => p.player.startsWith(selectedTeam));
        }

        if (filteredPlayers.length === 0) {
            document.getElementById('playerName').textContent = '该位置暂无此战队选手';
            document.getElementById('totalKda').textContent = '0/0/0';
            document.getElementById('heroPool').innerHTML = '';
            document.getElementById('heroCount').textContent = 0;
            return;
        }

        const player = filteredPlayers[0];

        // 渲染中间信息（名字和KDA同排）
        document.getElementById('playerName').textContent = player.player;
        document.getElementById('totalKda').textContent = `${player.kills}/${player.deaths}/${player.assists}`;
        
        // 渲染英雄池
        document.getElementById('heroCount').textContent = 1;
        document.getElementById('heroPool').innerHTML = `
            <div class="hero-item">
                <div class="hero-games">1</div>
                <img class="hero-icon" src="https://ddragon.leagueoflegends.com/cdn/14.1.1/img/champion/${player.champion}.png" onerror="this.style.background='#333'">
                <div class="hero-win">本局</div>
                <div class="hero-kda">${player.kills}/${player.deaths}/${player.assists}</div>
            </div>
        `;

        // 更新上方指标
        updateStat('kda', player.kda, avgStats.avg_kda, player.rank_kda);
        updateStat('cs', player.cspm, avgStats.avg_cspm, player.rank_cspm);
        updateStat('dmg', player.dpm, avgStats.avg_dpm, player.rank_dpm);
        updateStat('part', player.kpart, avgStats.avg_kpart, player.rank_kpart);
        updateStat('gold', player.goldpm, avgStats.avg_goldpm, player.rank_goldpm);
        updateStat('share', player.dmgshare + '%', avgStats.avg_dmgshare + '%', player.rank_dmgshare);
        updateStat('conv', player.dmgtoGold, avgStats.avg_dmgtoGold, player.rank_dmgtoGold);
        updateStat('surv', player.survival, avgStats.avg_survival, player.rank_survival);

        // 更新底部柱形图
        updateBarStat('pom', player.pom, player.rank_pom, 10);
        updateBarStat('solo', player.solo_kills, player.rank_solo_kills, 5);
        updateBarStat('fb', player.fb_participation + '%', player.rank_fb, 60);
        updateBarStat('lane', player.lane_diff, player.rank_lane_diff, 2);
        updateBarStat('gdiff', player.gold_diff, player.rank_gold_diff, 2000);
        updateBarStat('early', player.early_gold, player.rank_early_gold, 800);
        updateBarStat('partrate', player.participation + '%', player.rank_participation, 80);
        updateBarStat('taken', player.damage_taken_share + '%', player.rank_damage_taken, 30);
        updateBarStat('vision', player.vision_per_min, player.rank_vision, 2);

        // 渲染单人雷达图（中心点调成 45% 左右，雷达图饱满）
        renderRadar(player);
    }

    function updateStat(key, val, avgVal, rank) {
        document.getElementById(`stat-${key}`).textContent = parseFloat(val).toFixed(2);
        document.getElementById(`avg-${key}`).textContent = parseFloat(avgVal).toFixed(2);
        document.getElementById(`rank-${key}`).textContent = '#' + rank;
    }

    function updateBarStat(key, val, rank, maxVal) {
        document.getElementById(`stat-${key}`).textContent = val;
        document.getElementById(`rank-${key}`).textContent = '#' + rank;
        let width = 0;
        if (typeof val === 'number' && !isNaN(val)) {
            width = Math.max(0, Math.min(100, (Math.abs(val) / maxVal) * 100));
        }
        document.getElementById(`bar-${key}`).style.width = width + '%';
    }

    function renderRadar(player) {
        const chartDom = document.getElementById('radarChart');
        if (!myChart) myChart = echarts.init(chartDom);
        
        const option = {
            backgroundColor: 'transparent',
            radar: {
                indicator: [
                    { name: '', max: 10 },   // KDA
                    { name: '', max: 15 },   // 分均补刀
                    { name: '', max: 2000 }, // 分均伤害
                    { name: '', max: 30 },   // 参与击杀
                    { name: '', max: 800 },  // 分均经济
                    { name: '', max: 40 },   // 伤害占比
                    { name: '', max: 300 },  // 伤转
                    { name: '', max: 5 }     // 生存
                ],
                center: ['50%', '45%'],   // 核心调整！中心上移
                radius: '65%',             // 核心调整！恢复饱满大小
                splitNumber: 4, shape: 'polygon',
                splitArea: { areaStyle: { color: ['rgba(30,30,30,0.25)', 'rgba(30,30,30,0.08)'] } },
                axisLine: { show: false }, splitLine: { lineStyle: { color: '#fff', opacity: 0.2 } }, name: { show: false }
            },
            series: [{
                type: 'radar',
                data: [
                    { value: [player.kda, player.cspm, player.dpm, player.kpart, player.goldpm, player.dmgshare, player.dmgtoGold, player.survival], itemStyle: { color: '#00bcd4' }, areaStyle: { color: 'rgba(0,188,212,0.4)' }, lineStyle: { color: '#00bcd4', width: 3 }, symbol: 'none' },
                    { value: [avgStats.avg_kda, avgStats.avg_cspm, avgStats.avg_dpm, avgStats.avg_kpart, avgStats.avg_goldpm, avgStats.avg_dmgshare, avgStats.avg_dmgtoGold, avgStats.avg_survival], itemStyle: { color: '#ff5252' }, areaStyle: { color: 'transparent' }, lineStyle: { color: '#ff5252', width: 2, type: 'dashed' }, symbol: 'none' }
                ]
            }]
        };
        myChart.setOption(option);
        window.addEventListener('resize', () => myChart.resize());
    }

    loadData();
</script>
</body>
</html>
