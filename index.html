<script>
    let currentData = []; // 原始数据
    let currentPosition = 'MIDDLE'; // 默认位置
    let myChart = null;
    let avgStats = {}; // 存储全队平均值

    // 1. 加载数据
    async function loadData() {
        try {
            const res = await fetch('./data.json');
            const json = await res.json();
            
            // 将最后一个平均值对象单独提取出来
            avgStats = json.find(item => item.avg_kda !== undefined);
            // 移除平均值对象，只留下玩家数组
            currentData = json.filter(item => item.avg_kda === undefined);

            // 初始化按钮事件
            document.querySelectorAll('.pos-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentPosition = e.target.dataset.pos;
                    updateView();
                });
            });

            // 默认渲染
            updateView();
        } catch (error) {
            console.error('加载数据失败:', error);
            document.getElementById('playerName').textContent = '数据加载失败';
        }
    }

    // 2. 更新视图
    function updateView() {
        // 直接找对应当前位置的人
        const player = currentData.find(p => p.position === currentPosition);

        if (!player) {
            document.getElementById('playerName').textContent = '该位置暂无数据';
            return;
        }

        // 渲染基本信息（直接读取JSON里的字段）
        document.getElementById('playerName').textContent = player.player;
        document.getElementById('totalKda').textContent = `${player.kills}/${player.deaths}/${player.assists}`;
        
        // 渲染英雄池（这里因为是一局，直接显示本局英雄即可，以后可以改逻辑）
        renderHeroPool(player);

        // 更新页面数值 - 直接取你Excel计算好的值
        updateStat('kda', player.kda, avgStats.avg_kda);
        updateStat('cs', player.cspm, avgStats.avg_cspm);
        updateStat('dmg', player.dpm, avgStats.avg_dpm);
        updateStat('part', player.kpart, avgStats.avg_kpart);
        updateStat('gold', player.goldpm, avgStats.avg_goldpm);
        updateStat('share', player.dmgshare + '%', avgStats.avg_dmgshare + '%');
        updateStat('conv', player.dmgtoGold, avgStats.avg_dmgtoGold);
        updateStat('surv', player.survival, avgStats.avg_survival);

        // 渲染雷达图
        renderRadar(player);
    }

    // 辅助函数：更新单个指标
    function updateStat(key, val, avgVal) {
        // 用toFixed(2)控制小数位，避免出现原图中的极长小数
        document.getElementById(`stat-${key}`).textContent = parseFloat(val).toFixed ? parseFloat(val).toFixed(2) : val;
        document.getElementById(`avg-${key}`).textContent = parseFloat(avgVal).toFixed ? parseFloat(avgVal).toFixed(2) : avgVal;
        // 排名如果你也在Excel里算好，可以在JSON里加个 rank_kda 这样的字段，直接读取。目前暂时隐藏
        document.getElementById(`rank-${key}`).textContent = '#-'; 
    }

    // 渲染英雄池
    function renderHeroPool(currentPlayer) {
        const poolEl = document.getElementById('heroPool');
        document.getElementById('heroCount').textContent = 1; 
        // 展示该位置玩家本局使用的英雄
        poolEl.innerHTML = `
            <div class="hero-item">
                <div class="hero-games">1</div>
                <img class="hero-icon" src="https://ddragon.leagueoflegends.com/cdn/14.1.1/img/champion/${currentPlayer.champion}.png" onerror="this.style.background='#333'">
                <div class="hero-win">本局</div>
                <div class="hero-kda">${currentPlayer.kills}/${currentPlayer.deaths}/${currentPlayer.assists}</div>
            </div>
        `;
    }

    // 渲染雷达图 (直接使用JSON里的数据)
    function renderRadar(player) {
        const chartDom = document.getElementById('radarChart');
        if (!myChart) myChart = echarts.init(chartDom);
        
        const option = {
            backgroundColor: 'transparent',
            radar: {
                indicator: [
                    { name: '', max: 10 },   // KDA (根据你的实际数值调整这里的max)
                    { name: '', max: 15 },   // 分均补刀
                    { name: '', max: 2000 }, // 分均伤害
                    { name: '', max: 30 },   // 参与击杀
                    { name: '', max: 800 },  // 分均经济
                    { name: '', max: 40 },   // 伤害占比
                    { name: '', max: 300 },  // 伤转
                    { name: '', max: 5 }     // 生存
                ],
                center: ['50%', '50%'], radius: '68%', splitNumber: 4, shape: 'polygon',
                splitArea: { areaStyle: { color: ['rgba(30,30,30,0.25)', 'rgba(30,30,30,0.08)'] } },
                axisLine: { show: false }, splitLine: { lineStyle: { color: '#fff', opacity: 0.2 } }, name: { show: false }
            },
            series: [{
                type: 'radar',
                data: [
                    { 
                        value: [player.kda, player.cspm, player.dpm, player.kpart, player.goldpm, player.dmgshare, player.dmgtoGold, player.survival], 
                        itemStyle: { color: '#00bcd4' }, areaStyle: { color: 'rgba(0,188,212,0.4)' }, lineStyle: { color: '#00bcd4', width: 3 }, symbol: 'none' 
                    },
                    { 
                        value: [avgStats.avg_kda, avgStats.avg_cspm, avgStats.avg_dpm, avgStats.avg_kpart, avgStats.avg_goldpm, avgStats.avg_dmgshare, avgStats.avg_dmgtoGold, avgStats.avg_survival], 
                        itemStyle: { color: '#ff5252' }, areaStyle: { color: 'transparent' }, lineStyle: { color: '#ff5252', width: 2, type: 'dashed' }, symbol: 'none' 
                    }
                ]
            }]
        };
        myChart.setOption(option);
        window.addEventListener('resize', () => myChart.resize());
    }

    loadData();
</script>
