<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H·武道会 · 雷达图优化</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js">
    </script>
    <style>
        :root {
            --bg-deep: #0b0d12;
            --panel-bg: rgba(21, 24, 30, 0.82);
            --accent-purple: #7a3df0;
            --accent-cyan: #00d4e6;
            --accent-orange: #ff9800;
            --accent-red: #ff6b6b;
            --accent-amber: #fcd34d;
            --accent-lilac: #c084fc;
            --text-primary: #f0f0f0;
            --text-secondary: #999;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --radius-lg: 24px;
            --radius-md: 14px;
            --radius-pill: 40px;
            --shadow-glow-purple: 0 6px 28px rgba(122, 61, 240, 0.4);
            --transition-smooth: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle at 30% 40%, rgba(122, 61, 240, 0.14) 0%, transparent 70%);
            animation: aurora 12s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle at 70% 60%, rgba(0, 188, 212, 0.10) 0%, transparent 70%);
            animation: aurora2 15s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes aurora {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(5%, 5%) scale(1.2);
            }
        }
        @keyframes aurora2 {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(-5%, -5%) scale(1.3);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1400px;
            background: var(--panel-bg);
            backdrop-filter: blur(28px) saturate(1.25);
            border-radius: var(--radius-lg);
            padding: 28px 32px 32px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(122, 61, 240, 0.08) inset;
        }

        .title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            padding: 8px 0 18px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .title::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-cyan), transparent);
            border-radius: 4px;
        }
        .title .sub {
            font-weight: 300;
            font-size: 14px;
            color: #888;
            letter-spacing: 2px;
            display: block;
            margin-top: 2px;
        }

        .control-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .team-select {
            background: rgba(42, 47, 56, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ccc;
            padding: 9px 22px;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            text-align: center;
            backdrop-filter: blur(4px);
            transition: var(--transition-smooth);
            letter-spacing: 0.5px;
        }
        .team-select:hover {
            background: rgba(60, 65, 80, 0.8);
            color: #fff;
            border-color: rgba(122, 61, 240, 0.3);
        }
        .team-select option {
            background: #1a1d24;
            color: #eee;
        }
        .position-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .pos-btn {
            background: rgba(42, 47, 56, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #999;
            padding: 9px 22px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }
        .pos-btn:hover {
            background: rgba(60, 65, 80, 0.8);
            color: #fff;
            transform: translateY(-1px);
        }
        .pos-btn.active {
            background: linear-gradient(135deg, #7a3df0, #6a2fd0);
            color: #fff;
            border-color: #7a3df0;
            box-shadow: var(--shadow-glow-purple);
            transform: translateY(-1px);
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .search-input {
            flex: 1 1 200px;
            background: rgba(42, 47, 56, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #eee;
            padding: 9px 18px;
            border-radius: var(--radius-pill);
            font-size: 14px;
            outline: none;
            transition: var(--transition-smooth);
            letter-spacing: 0.5px;
        }
        .search-input:focus {
            border-color: rgba(122, 61, 240, 0.5);
            box-shadow: 0 0 20px rgba(122, 61, 240, 0.15);
            background: rgba(50, 55, 65, 0.8);
        }
        .search-input::placeholder {
            color: #666;
        }
        .view-switch {
            display: flex;
            gap: 8px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .view-btn,
        .export-btn {
            background: rgba(42, 47, 56, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #999;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }
        .view-btn:hover,
        .export-btn:hover {
            background: rgba(60, 65, 80, 0.8);
            color: #fff;
            transform: translateY(-1px);
        }
        .view-btn.active {
            background: linear-gradient(135deg, #7a3df0, #6a2fd0);
            color: #fff;
            border-color: #7a3df0;
            box-shadow: var(--shadow-glow-purple);
        }
        .export-btn {
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.15), rgba(122, 61, 240, 0.15));
            border-color: rgba(0, 188, 212, 0.25);
            color: #ccc;
        }
        .export-btn:hover {
            background: linear-gradient(135deg, rgba(0, 188, 212, 0.3), rgba(122, 61, 240, 0.3));
            border-color: rgba(0, 188, 212, 0.5);
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 188, 212, 0.2);
        }

        .player-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 14px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: #7a3df0 transparent;
            flex-wrap: nowrap;
            min-height: 62px;
        }
        .player-selector::-webkit-scrollbar {
            height: 4px;
        }
        .player-selector::-webkit-scrollbar-track {
            background: transparent;
        }
        .player-selector::-webkit-scrollbar-thumb {
            background: #7a3df0;
            border-radius: 8px;
        }
        .player-selector .label {
            color: #888;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            margin-right: 4px;
        }
        .player-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px 5px 8px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition-smooth);
            flex-shrink: 0;
            white-space: nowrap;
            user-select: none;
        }
        .player-chip:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }
        .player-chip.active {
            background: rgba(122, 61, 240, 0.25);
            border-color: rgba(122, 61, 240, 0.45);
            box-shadow: 0 0 20px rgba(122, 61, 240, 0.12);
        }
        .player-chip.compare {
            background: rgba(0, 188, 212, 0.22);
            border-color: rgba(0, 188, 212, 0.55);
            box-shadow: 0 0 15px rgba(0, 188, 212, 0.18);
        }
        .player-chip img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.08);
            object-fit: cover;
            background: #1a1d24;
        }
        .player-chip .chip-name {
            color: #eee;
            font-size: 13px;
            font-weight: 500;
        }
        .player-chip .chip-kda {
            color: #888;
            font-size: 11px;
            font-weight: 400;
        }
        .player-chip .chip-kda .k {
            color: var(--accent-cyan);
        }
        .player-chip .chip-kda .d {
            color: var(--accent-red);
        }
        .player-chip .chip-kda .a {
            color: var(--accent-amber);
        }

        .main-area {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            align-items: stretch;
            margin-top: 16px;
        }

        .left-panel {
            width: 26%;
            min-width: 210px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }
        .hero-pool-title {
            background: linear-gradient(135deg, #7a3df0, #5a2db0);
            color: #fff;
            text-align: center;
            padding: 10px 0;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(122, 61, 240, 0.25);
            flex-shrink: 0;
        }
        .hero-pool-title span {
            font-weight: 700;
            background: rgba(255, 255, 255, 0.2);
            padding: 0 8px;
            border-radius: 12px;
        }
        .hero-pool-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            flex: 1 1 auto;
            align-content: start;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: #7a3df0 transparent;
        }
        .hero-pool-grid::-webkit-scrollbar {
            width: 4px;
        }
        .hero-pool-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .hero-pool-grid::-webkit-scrollbar-thumb {
            background: #7a3df0;
            border-radius: 8px;
        }
        .hero-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 6px 4px 8px;
            transition: var(--transition-smooth);
            border: 1px solid transparent;
        }
        .hero-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(122, 61, 240, 0.2);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .hero-games {
            position: absolute;
            top: 2px;
            left: 6px;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 0 6px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
        }
        .hero-icon {
            width: 62px;
            height: 62px;
            border-radius: 12px;
            margin-bottom: 4px;
            background: #1e222a;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition-smooth);
            object-fit: cover;
        }
        .hero-item:hover .hero-icon {
            border-color: rgba(122, 61, 240, 0.4);
            box-shadow: 0 0 20px rgba(122, 61, 240, 0.15);
        }
        .hero-win {
            color: #bbb;
            font-size: 11px;
            font-weight: 500;
        }
        .hero-kda {
            color: #777;
            font-size: 10px;
            margin-top: 1px;
        }

        .left-bottom-stats {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .stat-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .stat-row .mini-stat {
            flex: 1 1 0;
            min-width: 90px;
        }
        .mini-stat {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 6px 12px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(4px);
            transition: var(--transition-smooth);
        }
        .mini-stat:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(122, 61, 240, 0.15);
        }
        .mini-stat-top {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 3px;
            align-items: center;
        }
        .mini-stat-name {
            color: #888;
            font-weight: 500;
            font-size: 11px;
            letter-spacing: 0.3px;
        }
        .mini-stat-val {
            color: #fff;
            font-weight: 700;
            font-size: 13px;
        }
        .mini-stat-val.blue {
            color: #00d4e6;
        }
        .mini-stat-val.red {
            color: #ff6b6b;
        }
        .mini-stat-rank {
            color: var(--accent-amber);
            font-size: 11px;
            font-weight: 700;
            margin-left: 4px;
        }
        .bar-bg {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0 0 10px 10px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7a3df0, #00bcd4);
            transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 0 0 10px 10px;
        }
        .bar-fill.red {
            background: linear-gradient(90deg, #ff5252, #ff6b6b);
        }

        .player-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 8px;
            min-width: 140px;
        }
        .player-avatar-wrap {
            position: relative;
            border-radius: 16px;
            padding: 4px;
            background: linear-gradient(135deg, #7a3df0, #00bcd4);
            box-shadow: 0 0 40px rgba(122, 61, 240, 0.15);
            transition: var(--transition-smooth);
        }
        .player-avatar-wrap:hover {
            box-shadow: 0 0 60px rgba(122, 61, 240, 0.3);
            transform: scale(1.02);
        }
        .player-avatar {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 13px;
            display: block;
            background: #1a1d24;
        }
        .player-meta {
            display: flex;
            align-items: baseline;
            gap: 18px;
            margin-top: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .player-name {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .player-total-kda {
            font-size: 20px;
            font-weight: 600;
            color: #aaa;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 16px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .player-total-kda .k {
            color: var(--accent-cyan);
        }
        .player-total-kda .d {
            color: var(--accent-red);
        }
        .player-total-kda .a {
            color: var(--accent-amber);
        }

        .right-panel {
            width: 55%;
            position: relative;
            height: 740px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 8px;
            overflow: hidden;
        }
        #radarChart {
            width: 540px;
            height: 540px;
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
        }
        .stats-wrapper {
            width: 540px;
            height: 540px;
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 5;
        }
        .stat-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transform: translate(-50%, -50%);
            line-height: 1.35;
            min-width: 72px;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: var(--transition-smooth);
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
        }
        .stat-item:hover {
            background: rgba(0, 0, 0, 0.96);
            border-color: rgba(122, 61, 240, 0.4);
            transform: translate(-50%, -50%) scale(1.06);
            box-shadow: 0 0 24px rgba(122, 61, 240, 0.25);
            z-index: 10;
        }
        .stat-name {
            color: #ddd;
            font-weight: 500;
            font-size: 11px;
            letter-spacing: 0.5px;
            opacity: 0.85;
        }
        .stat-rank {
            color: var(--accent-amber);
            font-size: 11px;
            font-weight: 700;
        }
        .stat-val-blue {
            color: #00d4e6;
            font-weight: 700;
            font-size: 14px;
        }
        .stat-val-red {
            color: #ff6b6b;
            font-size: 10px;
            font-weight: 500;
            opacity: 0.7;
            margin-top: 1px;
        }

        /* 8个顶点的标签位置（针对优化后的雷达图） */
        .pos-top {
            top: 9.5%;
            left: 50%;
        }
        .pos-topright {
            top: 19%;
            left: 78.5%;
        }
        .pos-right {
            top: 47%;
            left: 88.5%;
        }
        .pos-bottomright {
            bottom: 22%;
            left: 78.5%;
            top: auto;
        }
        .pos-bottom {
            bottom: 12.5%;
            left: 50%;
            top: auto;
        }
        .pos-bottomleft {
            bottom: 22%;
            left: 21.5%;
            top: auto;
        }
        .pos-left {
            top: 47%;
            left: 11.5%;
        }
        .pos-topleft {
            top: 19%;
            left: 21.5%;
        }

        .avg-note {
            position: absolute;
            right: 18px;
            top: 18px;
            color: #888;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 10;
            font-weight: 500;
            letter-spacing: 0.3px;
            pointer-events: none;
        }
        .avg-note .red-dot {
            color: #ff6b6b;
            font-weight: 600;
        }
        .avg-note .blue-dot {
            color: #00d4e6;
            font-weight: 600;
        }

        .radar-legend {
            position: absolute;
            left: 14px;
            bottom: 12px;
            z-index: 12;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 10px;
            color: #aaa;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 14px;
            border-radius: 12px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.3px;
            line-height: 1.5;
        }
        .radar-legend .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .radar-legend .legend-line {
            width: 20px;
            height: 2px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .radar-legend .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1.5px solid #fff;
        }

        /* 加载遮罩 */
        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(11, 13, 18, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            z-index: 30;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }
        .loading-overlay.show {
            display: flex;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(122, 61, 240, 0.15);
            border-top-color: #7a3df0;
            border-radius: 50%;

<body>
    <div class="container">

    <script>
        // ============================================================
        //  位置动态指标配置表（优化版：确保伤害占比、分均经济、分均补刀在雷达图中）
        // ============================================================
        const positionConfigs = {
            'TOP': {
                keys: ['kda', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'damage_taken_per_death',
                    'lane_diff'
                ],

                avgs: ['avg_kda', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold',

                ],
                maxs: [10, 1800, 14, 750, 40, 280, 11000, 4]
            },
            'JUNGLE': {
                keys: ['kda', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'participation', 'damage_taken_per_death',
                    'lane_diff'
                ],
                labels: ['KDA', '分均伤害', '分均补刀', '分均经济', '伤害占比', '参团率', '每死承伤', '对位等级差'],
                avgs: ['avg_kda', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_participation',
                    'avg_damage_taken_per_death', 'avg_lane_diff'
                ],
                ranks: ['rank_kda', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_participation',
                    'rank_damage_taken_per_death', 'rank_lane_diff'
                ],
                maxs: [10, 1800, 14, 750, 40, 100, 11000, 4]
            },
            'MIDDLE': {
                keys: ['kda', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'survival', 'lane_diff'],
                labels: ['KDA', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '生存能力', '对位等级差'],
                avgs: ['avg_kda', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold',
                    'avg_survival', 'avg_lane_diff'
                ],
                ranks: ['rank_kda', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_dmgtoGold',
                    'rank_survival', 'rank_lane_diff'
                ],
                maxs: [10, 1800, 14, 750, 40, 280, 5, 4]
            },
            'BOTTOM': {
                keys: ['kda', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'survival', 'lane_diff'],
                labels: ['KDA', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '生存能力', '对位等级差'],
                avgs: ['avg_kda', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold',
                    'avg_survival', 'avg_lane_diff'
                ],
                ranks: ['rank_kda', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_dmgtoGold',
                    'rank_survival', 'rank_lane_diff'
                ],
                maxs: [10, 1800, 14, 750, 40, 280, 5, 4]
            },
            'UTILITY': {
                keys: ['kda', 'goldpm', 'participation', 'dmgshare', 'damage_taken_share', 'vision_per_min',
                    'damage_taken_per_death', 'lane_diff'
                ],
                labels: ['KDA', '分均经济', '参团率', '伤害占比', '承伤占比', '分均视野', '每死承伤', '对位等级差'],
                avgs: ['avg_kda', 'avg_goldpm', 'avg_participation', 'avg_dmgshare', 'avg_damage_taken_share',
                    'avg_vision_per_min', 'avg_damage_taken_per_death', 'avg_lane_diff'
                ],
                ranks: ['rank_kda', 'rank_goldpm', 'rank_participation', 'rank_dmgshare', 'rank_damage_taken_share',
                    'rank_vision_per_min', 'rank_damage_taken_per_death', 'rank_lane_diff'
                ],
                maxs: [10, 750, 100, 40, 40, 5, 11000, 4]
            }
        };

        // ============================================================
        //  状态
        // ============================================================
        let allPlayers = [];
        let avgStats = {};
        let currentPosition = 'MIDDLE';
        let currentTeam = 'ALL';
        let currentPlayerIndex = 0;
        let myChart = null;
        let isDataLoaded = false;
        let currentFilteredPlayers = [];
        let searchTerm = '';
        let currentView = 'radar';
        let comparePlayers = [];
        let radarRenderVersion = 0;

        // DOM 引用
        const teamSelect = document.getElementById('teamSelect');
        const posBtns = document.querySelectorAll('.pos-btn');
        const playerSelector = document.getElementById('playerSelector');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const playerSearch = document.getElementById('playerSearch');
        const viewBtns = document.querySelectorAll('.view-btn');
        const exportBtn = document.getElementById('exportBtn');
        const mainArea = document.getElementById('mainArea');
        const radarLegend = document.getElementById('radarLegend');

        // 工具函数
        function safeVal(v, fallback = 0) { const n = parseFloat(v); return isNaN(n) ? fallback : n; }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function percentile(values, pct) {
            if (!values.length) return 0;
            const sorted = [...values].sort((a, b) => a - b);
            const idx = Math.min(sorted.length - 1, Math.floor(pct * sorted.length));
            return sorted[idx] || 0;
        }

        function proxyImageUrl(originalUrl) {
            return `https://images.weserv.nl/?url=${encodeURIComponent(originalUrl)}`;
        }

        // ============================================================
        //  数据加载
        // ============================================================
        async function loadData() {
            loadingOverlay.classList.add('show');
            loadingOverlay.querySelector('.loading-text').textContent = '数据加载中...';
            try {
                const res = await fetch('./data.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                const avgObj = json.find(item => item.avg_kda !== undefined);
                if (avgObj) avgStats = avgObj;
                else avgStats = {};
                allPlayers = json.filter(item => item.avg_kda === undefined);
                isDataLoaded = true;

                const teamSet = new Set(allPlayers.map(p => p.player.split(' ')[0]));
                let optionsHtml = `<option value="ALL">全部战队</option>`;
                teamSet.forEach(team => { optionsHtml += `<option value="${team}">${team}</option>`; });
                teamSelect.innerHTML = optionsHtml;

                teamSelect.addEventListener('change', () => { currentTeam = teamSelect.value;
                    currentPlayerIndex = 0;
                    comparePlayers = [];
                    updateView(); });
                posBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        posBtns.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        currentPosition = e.target.dataset.pos;
                        currentPlayerIndex = 0;
                        comparePlayers = [];
                        updateView();
                    });
                });
                playerSearch.addEventListener('input', (e) => { searchTerm = e.target.value.toLowerCase().trim();
                    currentPlayerIndex = 0;
                    comparePlayers = [];
                    updateView(); });
                viewBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        viewBtns.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        currentView = e.target.dataset.view;
                        updateView();
                    });
                });
                exportBtn.addEventListener('click', exportImage);

                updateView();
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('playerName').textContent = '⚠️ 数据加载失败';
                document.getElementById('statsWrapper').innerHTML =
                    '<div style="color:#ff6b6b;text-align:center;padding:40px;font-size:14px;">数据加载失败</div>';
            } finally {
                loadingOverlay.classList.remove('show');
            }
        }

        function getFilteredPlayers() {
            let filtered = allPlayers.filter(p => p.position === currentPosition);
            if (currentTeam !== 'ALL') filtered = filtered.filter(p => p.player.startsWith(currentTeam));
            if (searchTerm) filtered = filtered.filter(p => p.player.toLowerCase().includes(searchTerm));
            filtered.sort((a, b) => (b.kda || 0) - (a.kda || 0));
            return filtered;
        }

        function renderPlayerChips(players) {
            const container = playerSelector;
            let html = `<span class="label">👥 选手</span>`;
            if (players.length === 0) {
                html += `<span style="color:#666;font-size:13px;padding:6px 0;">暂无选手</span>`;
                container.innerHTML = html;
                return;
            }
            players.forEach((p, idx) => {
                const active = idx === currentPlayerIndex ? 'active' : '';
                const compare = comparePlayers.includes(idx) ? 'compare' : '';
                const avatar = proxyImageUrl(`https://q.qlogo.cn/headimg_dl?dst_uin=${p.qq}&spec=640`);
                html += `
                    <div class="player-chip ${active} ${compare}" data-index="${idx}" title="点击选择，Ctrl+点击加入对比">
                        <img src="${avatar}" crossorigin="anonymous" onerror="this.src='https://via.placeholder.com/32'" loading="lazy" />
                        <span class="chip-name">${p.player}</span>
                        <span class="chip-kda"><span class="k">${p.kills}</span>/<span class="d">${p.deaths}</span>/<span class="a">${p.assists}</span></span>
                    </div>`;
            });
            container.innerHTML = html;
            container.querySelectorAll('.player-chip').forEach(el => {
                el.addEventListener('click', (e) => {
                    const idx = parseInt(el.dataset.index, 10);
                    if (e.ctrlKey || e.metaKey) {
                        if (comparePlayers.includes(idx)) {
                            comparePlayers = comparePlayers.filter(i => i !== idx);
                        } else {
                            if (comparePlayers.length >= 2) comparePlayers.shift();
                            comparePlayers.push(idx);
                        }
                        updateView();
                    } else {
                        if (!isNaN(idx) && idx !== currentPlayerIndex) {
                            currentPlayerIndex = idx;
                            comparePlayers = [];
                            updateView();
                        }
                    }
                });
            });
        }

        function updateLeftStats(player) {
            const mappings = [
                { stat: 'lane', rank: 'rank-lane', bar: 'bar-lane', key: 'lane_diff', rankKey: 'rank_lane_diff',
                    max: 4, isRed: false },
                { stat: 'gdiff', rank: 'rank-gdiff', bar: 'bar-gdiff', key: 'gold_diff', rankKey: 'rank_gold_diff',
                    max: 3000, isRed: false },
                { stat: 'partrate', rank: 'rank-partrate', bar: 'bar-partrate', key: 'participation',
                    rankKey: 'rank_participation', max: 100, isRed: false },
                { stat: 'taken', rank: 'rank-taken', bar: 'bar-taken', key: 'damage_taken_share',
                    rankKey: 'rank_damage_taken', max: 40, isRed: true },
                { stat: 'vision', rank: 'rank-vision', bar: 'bar-vision', key: 'vision_per_min',
                    rankKey: 'rank_vision', max: 3, isRed: false },
            ];
            mappings.forEach(({ stat, rank, bar, key, rankKey, max, isRed }) => {
                const val = safeVal(player[key]);
                const r = player[rankKey] || '-';
                document.getElementById(`stat-${stat}`).textContent = key === 'gold_diff' ? (val >= 0 ? '+' : '') +
                    val.toFixed(0) : val.toFixed(1);
                document.getElementById(`rank-${stat}`).textContent = `#${r}`;
                const pct = clamp((val / max) * 100, 0, 100);
                const barEl = document.getElementById(bar);
                barEl.style.width = pct + '%';
                barEl.className = isRed ? 'bar-fill red' : 'bar-fill';
            });
        }

        function updateView() {
            if (!isDataLoaded) return;
            const players = getFilteredPlayers();
            currentFilteredPlayers = players;
            if (players.length === 0) {
                document.getElementById('playerName').textContent = '暂无选手';
                document.getElementById('totalKda').innerHTML =
                    '<span class="k">0</span>/<span class="d">0</span>/<span class="a">0</span>';
                document.getElementById('playerAvatar').src = 'https://via.placeholder.com/160';
                document.getElementById('heroPool').innerHTML = '';
                document.getElementById('heroCount').textContent = '0';
                ['lane', 'gdiff', 'partrate', 'taken', 'vision'].forEach(key => {
                    document.getElementById(`stat-${key}`).textContent = '--';
                    document.getElementById(`rank-${key}`).textContent = '#-';
                    document.getElementById(`bar-${key}`).style.width = '0%';
                });
                document.getElementById('statsWrapper').innerHTML = '';
                renderPlayerChips([]);
                if (myChart) myChart.clear();
                return;
            }
            if (currentPlayerIndex >= players.length) currentPlayerIndex = 0;
            const player = players[currentPlayerIndex];
            renderPlayerChips(players);

            const avatarUrl = proxyImageUrl(`https://q.qlogo.cn/headimg_dl?dst_uin=${player.qq}&spec=640`);
            const avatarImg = document.getElementById('playerAvatar');
            avatarImg.src = avatarUrl;
            avatarImg.crossOrigin = "anonymous";
            avatarImg.onerror = function() { this.onerror = null;
                this.src = 'https://via.placeholder.com/160'; };

            document.getElementById('playerName').textContent = player.player;
            document.getElementById('totalKda').innerHTML =
                `<span class="k">${player.kills}</span>/<span class="d">${player.deaths}</span>/<span class="a">${player.assists}</span>`;

            renderHeroPool(player);
            updateLeftStats(player);

            if (currentView === 'radar') {
                renderStatsWrapper(player);
                renderRadar(player);
            }
            // 其他视图暂不实现，保持雷达图焦点
        }

        function renderHeroPool(player) {
            const poolEl = document.getElementById('heroPool');
            const heroes = player.heroes || [{ champion: player.champion || 'Unknown', games: 1, wins: 1 }];
            document.getElementById('heroCount').textContent = heroes.length;
            poolEl.innerHTML = heroes.map(h => {
                const winRate = Math.round((h.wins / h.games) * 100);
                const champName = h.champion || 'Unknown';
                const champIconUrl = proxyImageUrl(
                    `https://ddragon.leagueoflegends.com/cdn/14.1.1/img/champion/${champName}.png`);
                return `
                    <div class="hero-item">
                        <div class="hero-games">${h.games}</div>
                        <img class="hero-icon" src="${champIconUrl}" crossorigin="anonymous" onerror="this.style.background='#2a2f38';this.alt='${champName}'" loading="lazy" alt="${champName}">
                        <div class="hero-win">${winRate}%</div>
                        <div class="hero-kda">${h.games}局</div>
                    </div>`;
            }).join('');
        }

        // ============================================================
        //  雷达图外部标签（同步优化：精确对齐8个顶点）
        // ============================================================
        function renderStatsWrapper(player) {
            const config = positionConfigs[currentPosition];
            const wrapper = document.getElementById('statsWrapper');
            const positions = ['top', 'topright', 'right', 'bottomright', 'bottom', 'bottomleft', 'left', 'topleft'];
            wrapper.innerHTML = config.keys.map((key, index) => {
                let val = safeVal(player[key]);
                let avgVal = safeVal(avgStats[config.avgs[index]]);
                let rank = player[config.ranks[index]] !== undefined ? player[config.ranks[index]] : '-';
                const displayVal = typeof val === 'number' ? val.toFixed(1) : val;
                const displayAvg = typeof avgVal === 'number' ? avgVal.toFixed(1) : avgVal;
                return `
                    <div class="stat-item pos-${positions[index]}" data-index="${index}" data-key="${key}" title="${config.labels[index]} — 点击高亮">
                        <div class="stat-name">${config.labels[index]}</div>
                        <div><span class="stat-rank">#${rank}</span> <span class="stat-val-blue">${displayVal}</span></div>
                        <div class="stat-val-red">${displayAvg}</div>
                    </div>`;
            }).join('');
        }

        // ============================================================
        //  雷达图Tooltip构建
        // ============================================================
        function buildRadarTooltip(player, config, isPlayerSeries, seriesName) {
            let html = '';
            const playerName = player.player || seriesName || '未知选手';
            if (isPlayerSeries) {
                html +=
                    `<div style="font-weight:700;font-size:14px;margin-bottom:6px;color:#00d4e6;">${playerName}</div>`;
                html +=
                    `<div style="font-size:11px;color:#888;margin-bottom:8px;">KDA: ${player.kills}/${player.deaths}/${player.assists}</div>`;
            } else {
                html += `<div style="font-weight:700;font-size:14px;margin-bottom:6px;color:#ff6b6b;">均值数据</div>`;
                html += `<div style="font-size:11px;color:#888;margin-bottom:8px;">全选手平均</div>`;
            }
            html += `<div style="display:grid;grid-template-columns:1fr auto auto;gap:4px 16px;font-size:12px;">`;
            config.keys.forEach((key, index) => {
                let val = isPlayerSeries ? player[key] : avgStats[config.avgs[index]];
                val = safeVal(val);
                const displayVal = typeof val === 'number' ? val.toFixed(2) : val;
                const rank = isPlayerSeries ? (player[config.ranks[index]] !== undefined ? player[config.ranks[
                    index]] : '-') : '-';
                const colorClass = isPlayerSeries ? '#00d4e6' : '#ff6b6b';
                html += `
                    <span style="color:#aaa;">${config.labels[index]}</span>
                    <span style="color:${colorClass};font-weight:600;text-align:right;">${displayVal}</span>
                    <span style="color:#fcd34d;font-size:11px;text-align:right;">${isPlayerSeries ? '#'+rank : '—'}</span>`;
            });
            html += `</div>`;
            return html;
        }

        // ============================================================
        //  【核心】雷达图渲染 - 优化版
        //  - 动态最大值使用90分位数，避免极值扭曲
        //  - 伤害占比、分均经济、分均补刀等指标醒目展示
        //  - 更细腻的渐变填充与阴影
        //  - 均值虚线清晰可辨
        // ============================================================
        function renderRadar(player) {
            const chartDom = document.getElementById('radarChart');
            const version = ++radarRenderVersion;
            if (!myChart) {
                myChart = echarts.init(chartDom, 'dark');
                window.addEventListener('resize', () => { if (myChart) myChart.resize(); });
            }
            const config = positionConfigs[currentPosition];

            // 动态最大值：使用90分位数，更稳健
            const dynamicMaxs = config.keys.map((key, index) => {
                const values = currentFilteredPlayers.map(p => safeVal(p[key]));
                const p90 = percentile(values, 0.90);
                const fallback = config.maxs[index] * 0.25;
                const baseMax = Math.max(p90, fallback);
                return Math.ceil(baseMax * 1.15);
            });

            const indicator = config.keys.map((key, index) => ({
                name: config.labels[index],
                max: dynamicMaxs[index]
            }));

            const seriesData = [];

            // 当前选手系列
            let playerValues = config.keys.map(key => safeVal(player[key]));
            seriesData.push({
                value: playerValues,
                name: player.player,
                _seriesType: 'current',
                itemStyle: {
                    color: '#00d4e6',
                    shadowBlur: 28,
                    shadowColor: 'rgba(0,212,230,0.6)'
                },
                lineStyle: {
                    color: '#00d4e6',
                    width: 3.2,
                    shadowBlur: 20,
                    shadowColor: 'rgba(0,212,230,0.5)'
                },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgba(0,212,230,0.42)' },
                        { offset: 0.6, color: 'rgba(0,212,230,0.14)' },
                        { offset: 1, color: 'rgba(0,212,230,0.04)' }
                    ])
                },
                symbol: 'circle',
                symbolSize: 9,
                emphasis: {
                    lineStyle: { width: 4.2, color: '#00d4e6' },
                    itemStyle: { color: '#00d4e6', borderColor: '#fff', borderWidth: 3, shadowBlur: 32,
                        shadowColor: 'rgba(0,212,230,0.9)' }
                }
            });

            // 对比选手系列
            comparePlayers.forEach((idx, order) => {
                const compPlayer = currentFilteredPlayers[idx];
                if (compPlayer) {
                    let compValues = config.keys.map(key => safeVal(compPlayer[key]));
                    const color = order === 0 ? '#ff9800' : '#c084fc';
                    seriesData.push({
                        value: compValues,
                        name: compPlayer.player,
                        _seriesType: 'compare',
                        _playerIndex: idx,
                        itemStyle: {
                            color,
                            shadowBlur: 20,
                            shadowColor: color === '#ff9800' ? 'rgba(255,152,0,0.55)' :
                                'rgba(192,132,252,0.55)'
                        },
                        lineStyle: {
                            color,
                            width: 2.8,
                            shadowBlur: 14,
                            shadowColor: color === '#ff9800' ? 'rgba(255,152,0,0.45)' :
                                'rgba(192,132,252,0.45)'
                        },
                        areaStyle: {
                            color: color === '#ff9800' ? 'rgba(255,152,0,0.14)' : 'rgba(192,132,252,0.14)'
                        },
                        symbol: 'circle',
                        symbolSize: 7,
                        emphasis: {
                            lineStyle: { width: 3.8, color },
                            itemStyle: { color, borderColor: '#fff', borderWidth: 2.8 }
                        }
                    });
                }
            });

            // 均值系列（虚线，突出显示）
            let avgValues = config.avgs.map(key => safeVal(avgStats[key]));
            seriesData.push({
                value: avgValues,
                name: '均值',
                _seriesType: 'average',
                itemStyle: {
                    color: '#ff6b6b',
                    shadowBlur: 12,
                    shadowColor: 'rgba(255,107,107,0.4)'
                },
                lineStyle: {
                    color: '#ff6b6b',
                    width: 2,
                    type: 'dashed',
                    shadowBlur: 8,
                    shadowColor: 'rgba(255,107,107,0.3)'
                },
                areaStyle: { color: 'transparent' },
                symbol: 'diamond',
                symbolSize: 7,
                emphasis: {
                    lineStyle: { width: 2.8, color: '#ff6b6b' },
                    itemStyle: { color: '#ff6b6b', borderColor: '#fff', borderWidth: 1.8 }
                }
            });

            const option = {
                backgroundColor: 'transparent',
                animationDuration: 800,
                animationDurationUpdate: 600,
                animationEasing: 'cubicOut',
                animationEasingUpdate: 'cubicInOut',
                tooltip: {
                    trigger: 'item',
                    confine: true,
                    backgroundColor: 'rgba(18,20,26,0.97)',
                    borderColor: 'rgba(122,61,240,0.4)',
                    borderWidth: 1,
                    borderRadius: 14,
                    padding: [14, 18],
                    extraCssText: 'backdrop-filter: blur(22px); box-shadow: 0 8px 32px rgba(0,0,0,0.7); max-width: 360px;',
                    textStyle: { color: '#eee', fontSize: 12 },
                    formatter: function(params) {
                        if (!params || params.seriesIndex === undefined) return '';
                        const sIdx = params.seriesIndex;
                        const sData = seriesData[sIdx];
                        if (!sData) return '';
                        if (sData._seriesType === 'average') {
                            return buildRadarTooltip(player, config, false, '均值');
                        } else if (sData._seriesType === 'current') {
                            return buildRadarTooltip(player, config, true, player.player);
                        } else if (sData._seriesType === 'compare') {
                            const compP = currentFilteredPlayers[sData._playerIndex];
                            return compP ? buildRadarTooltip(compP, config, true, compP.player) : '';
                        }
                        return '';
                    }
                },
                radar: {
                    indicator: indicator,
                    center: ['50%', '48%'],
                    radius: '66%',
                    splitNumber: 4,
                    shape: 'polygon',
                    splitArea: {
                        areaStyle: {
                            color: ['rgba(122,61,240,0.03)', 'rgba(122,61,240,0.08)']
                        }
                    },
                    axisLine: { show: true, lineStyle: { color: 'rgba(255,255,255,0.15)', width: 1.2 } },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.08)', width: 1 } },
                    axisName: { show: false }
                },
                series: [{ type: 'radar', data: seriesData, symbolSize: 9 }]
            };
            myChart.setOption(option, true);
            myChart.resize();
        }

        // ============================================================
        //  导出图片
        // ============================================================
        async function exportImage() {
            const overlay = loadingOverlay;
            const loadingText = overlay.querySelector('.loading-text');
            overlay.classList.add('show');
            loadingText.textContent = '准备导出...';
            try {
                await new Promise(resolve => setTimeout(resolve, 600));
                if (myChart) myChart.resize();
                await new Promise(resolve => setTimeout(resolve, 300));
                loadingText.textContent = '生成高清图片...';
                const html2canvas = (await import(
                    'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js')).default;
                const canvas = await html2canvas(mainArea, {
                    backgroundColor: '#0b0d12',
                    scale: 3,
                    useCORS: true,
                    allowTaint: false,
                    logging: false,
                    scrollX: 0,
                    scrollY: -window.scrollY,
                    windowWidth: document.documentElement.offsetWidth,
                    windowHeight: document.documentElement.offsetHeight,
                });
                const playerName = currentFilteredPlayers.length > 0 && currentFilteredPlayers[currentPlayerIndex] ?
                    currentFilteredPlayers[currentPlayerIndex].player.replace(/[^\w\u4e00-\u9fa5]/g, '_') :
                    '未知选手';
                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
                const filename =
                    `H武道会_${currentPosition}_${playerName}_${timestamp}.png`;
                const link = document.createElement('a');
                link.download = filename;
                link.href = canvas.toDataURL('image/png');
                link.click();
                loadingText.textContent = '导出完成 ✓';
                await new Promise(resolve => setTimeout(resolve, 500));
            } catch (error) {
                console.error('导出失败:', error);
                loadingText.textContent = '导出失败，请重试';
                await new Promise(resolve => setTimeout(resolve, 1000));
            } finally {
                overlay.classList.remove('show');
                loadingText.textContent = '数据加载中...';
            }
        }

        // 启动
        loadData();
    </script>
</body>
</html>
