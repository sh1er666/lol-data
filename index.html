<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H·武道会·数据展示</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { background-color: #1a1d24; color: #eee; font-family: 'Microsoft YaHei', sans-serif; margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 1300px; background: #15181e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6); }
        .title { text-align: center; font-size: 32px; font-weight: 800; letter-spacing: 3px; color: #fff; padding: 10px 0; border-bottom: 1px solid #2f3540; }
        
        /* 位置选择器样式 */
        .position-selector { display: flex; justify-content: center; gap: 15px; margin-top: 10px; }
        .pos-btn { background: #2a2f38; border: 1px solid #333a45; color: #ccc; padding: 8px 20px; border-radius: 20px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .pos-btn:hover { background: #3a3f4a; color: #fff; }
        .pos-btn.active { background: #7a3df0; color: #fff; border-color: #7a3df0; }

        .main-area { display: flex; justify-content: space-between; gap: 20px; align-items: center; }
        .left-panel { width: 25%; display: flex; flex-direction: column; gap: 10px; }
        .hero-pool-title { background: #7a3df0; color: #fff; text-align: center; padding: 8px 0; border-radius: 20px; font-weight: bold; font-size: 15px; letter-spacing: 1px; }
        .hero-pool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .hero-item { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
        .hero-games { position: absolute; top: -5px; left: 5px; color: #fff; font-weight: 800; font-size: 14px; }
        .hero-icon { width: 70px; height: 70px; border-radius: 10px; margin-bottom: 5px; background: #2a2f38; border: 2px solid #333a45; }
        .hero-win { color: #ccc; font-size: 12px; font-weight: bold; }
        .hero-kda { color: #888; font-size: 11px; margin-top: 2px; }

        .player-info { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .player-avatar { width: 200px; height: 200px; object-fit: cover; border-radius: 8px; }
        .player-name { font-size: 42px; font-weight: 800; margin-top: 5px; }
        .player-total-kda { font-size: 20px; color: #aaa; font-weight: 600; letter-spacing: 1px; }

        .right-panel { width: 55%; position: relative; height: 560px; display: flex; justify-content: center; align-items: center; }
        #radarChart { width: 520px; height: 520px; }
        .stats-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 520px; height: 520px; pointer-events: none; }
        .stat-item { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; transform: translate(-50%, -50%); line-height: 1.5; width: 180px; white-space: nowrap; }
        .stat-rank { color: #fcd34d; font-size: 13px; font-weight: bold; }
        .stat-val-blue { color: #00bcd4; font-weight: 800; font-size: 14px; }
        .stat-name { color: #eee; font-weight: 600; font-size: 14px; }
        .stat-val-red { color: #ff5252; font-size: 13px; }
        .pos-top { top: 5%; left: 50%; } .pos-topright { top: 20%; left: 85%; } .pos-right { top: 50%; left: 96%; }
        .pos-bottomright { bottom: 5%; left: 85%; } .pos-bottom { bottom: -8%; left: 50%; } .pos-bottomleft { bottom: 5%; left: 15%; }
        .pos-left { top: 50%; left: 4%; } .pos-topleft { top: 20%; left: 15%; }
        .avg-note { position: absolute; right: 10px; top: 10px; color: #888; font-size: 13px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 6px; z-index: 10; }
    </style>
</head>
<body>
<div class="container">
    <div class="title">H·武道会·中单数据展示</div>
    
    <!-- 位置选择器 -->
    <div class="position-selector" id="positionSelector">
        <button class="pos-btn" data-pos="TOP">上单</button>
        <button class="pos-btn" data-pos="JUNGLE">打野</button>
        <button class="pos-btn active" data-pos="MIDDLE">中单</button>
        <button class="pos-btn" data-pos="BOTTOM">下路</button>
        <button class="pos-btn" data-pos="UTILITY">辅助</button>
    </div>

    <div class="main-area">
        <div class="left-panel">
            <div class="hero-pool-title">英雄池 (<span id="heroCount">0</span>只)</div>
            <div class="hero-pool-grid" id="heroPool"></div>
        </div>
        <div class="player-info">
            <img class="player-avatar" id="playerAvatar" src="https://q1.qlogo.cn/g?b=qq&nk=854265242&s=640" onerror="this.src='https://via.placeholder.com/200'">
            <div class="player-name" id="playerName">加载中...</div>
            <div class="player-total-kda" id="totalKda">0/0/0</div>
        </div>
        <div class="right-panel">
            <div id="radarChart"></div>
            <div class="stats-wrapper">
                <div class="stat-item pos-top"><div class="stat-rank" id="rank-kda">#-</div><div class="stat-val-blue" id="stat-kda">--</div><div class="stat-name">KDA</div><div class="stat-val-red" id="avg-kda">--</div></div>
                <div class="stat-item pos-topright"><div class="stat-rank" id="rank-cs">#-</div><div class="stat-val-blue" id="stat-cs">--</div><div class="stat-name">分均补刀</div><div class="stat-val-red" id="avg-cs">--</div></div>
                <div class="stat-item pos-right"><div class="stat-rank" id="rank-dmg">#-</div><div class="stat-val-blue" id="stat-dmg">--</div><div class="stat-name">分均伤害</div><div class="stat-val-red" id="avg-dmg">--</div></div>
                <div class="stat-item pos-bottomright"><div class="stat-rank" id="rank-part">#-</div><div class="stat-val-blue" id="stat-part">--</div><div class="stat-name">参与击杀</div><div class="stat-val-red" id="avg-part">--</div></div>
                <div class="stat-item pos-bottom"><div class="stat-rank" id="rank-gold">#-</div><div class="stat-val-blue" id="stat-gold">--</div><div class="stat-name">分均经济</div><div class="stat-val-red" id="avg-gold">--</div></div>
                <div class="stat-item pos-bottomleft"><div class="stat-rank" id="rank-share">#-</div><div class="stat-val-blue" id="stat-share">--</div><div class="stat-name">伤害占比</div><div class="stat-val-red" id="avg-share">--</div></div>
                <div class="stat-item pos-left"><div class="stat-rank" id="rank-conv">#-</div><div class="stat-val-blue" id="stat-conv">--</div><div class="stat-name">伤转</div><div class="stat-val-red" id="avg-conv">--</div></div>
                <div class="stat-item pos-topleft"><div class="stat-rank" id="rank-surv">#-</div><div class="stat-val-blue" id="stat-surv">--</div><div class="stat-name">生存</div><div class="stat-val-red" id="avg-surv">--</div></div>
            </div>
            <div class="avg-note"><span style="color:#ff5252;">红色</span> 为全队平均值</div>
        </div>
    </div>
</div>

<script>
    let currentData = []; // 原始数据
    let currentPosition = 'MIDDLE'; // 默认位置
    let myChart = null;

    // 1. 加载数据
    async function loadData() {
        try {
            const res = await fetch('./data.json');
            currentData = await res.json();
            
            // 初始化按钮事件
            document.querySelectorAll('.pos-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentPosition = e.target.dataset.pos;
                    updateView();
                });
            });

            // 默认渲染
            updateView();
        } catch (error) {
            console.error('加载数据失败:', error);
            document.getElementById('playerName').textContent = '数据加载失败';
        }
    }

    // 2. 更新视图
    function updateView() {
        // 计算当前比赛所有人的数据，用于求平均值和排名
        const players = currentData; 
        const player = players.find(p => p.position === currentPosition);

        if (!player) {
            document.getElementById('playerName').textContent = '该位置暂无数据';
            return;
        }

        // 渲染基本信息
        document.getElementById('playerName').textContent = player.player;
        document.getElementById('totalKda').textContent = `${player.kills}/${player.deaths}/${player.assists}`;
        
        // 渲染英雄池（动态获取该位置选手的英雄历史。目前只有一局，所以只有一个英雄）
        renderHeroPool(players, player);

        // 计算所有玩家各类指标，用于排名和平均值
        const minutes = player.timePlayed / 60;
        const allKda = players.map(p => (p.kills + p.assists) / p.deaths);
        const allCs = players.map(p => p.minionsKilled / (p.timePlayed / 60));
        const allDmg = players.map(p => p.totalDamageDealt / (p.timePlayed / 60));
        const allGold = players.map(p => p.goldEarned / (p.timePlayed / 60));
        const allConv = players.map(p => (p.totalDamageDealt / p.goldEarned) * 100);
        const totalTeamDamage = players.reduce((sum, p) => sum + p.totalDamageDealt, 0);
        const allShare = players.map(p => (p.totalDamageDealt / totalTeamDamage) * 100);
        const allSurv = players.map(p => p.longestTimeSpentLiving / 1000);

        const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
        const getRank = (arr, val) => '#' + (arr.filter(v => v > val).length + 1);

        const stats = {
            kda: (player.kills + player.assists) / player.deaths,
            cs: player.minionsKilled / minutes,
            dmg: player.totalDamageDealt / minutes,
            gold: player.goldEarned / minutes,
            share: (player.totalDamageDealt / totalTeamDamage) * 100,
            conv: (player.totalDamageDealt / player.goldEarned) * 100,
            surv: player.longestTimeSpentLiving / 1000
        };

        const avgStats = {
            kda: avg(allKda), cs: avg(allCs), dmg: avg(allDmg), gold: avg(allGold), share: avg(allShare), conv: avg(allConv), surv: avg(allSurv)
        };

        // 更新页面数值
        updateStat('kda', stats.kda, avgStats.kda, getRank(allKda, stats.kda));
        updateStat('cs', stats.cs, avgStats.cs, getRank(allCs, stats.cs));
        updateStat('dmg', stats.dmg, avgStats.dmg, getRank(allDmg, stats.dmg));
        updateStat('gold', stats.gold, avgStats.gold, getRank(allGold, stats.gold));
        updateStat('share', stats.share + '%', avgStats.share + '%', getRank(allShare, stats.share));
        updateStat('conv', stats.conv, avgStats.conv, getRank(allConv, stats.conv));
        updateStat('surv', stats.surv, avgStats.surv, getRank(allSurv, stats.surv));
        
        // 参与击杀（这一局没有全队总击杀，暂且以自己为主要指标，计算个全场最高排行）
        const allParts = players.map(p => p.kills + p.assists);
        updateStat('part', player.kills + player.assists, avg(allParts).toFixed(2), getRank(allParts, player.kills + player.assists));

        // 渲染雷达图
        renderRadar(stats, avgStats);
    }

    // 辅助函数：更新单个指标
    function updateStat(key, val, avgVal, rank) {
        document.getElementById(`stat-${key}`).textContent = val.toFixed ? val.toFixed(2) : val;
        document.getElementById(`avg-${key}`).textContent = avgVal.toFixed ? avgVal.toFixed(2) : avgVal;
        document.getElementById(`rank-${key}`).textContent = rank;
    }

    // 渲染英雄池
    function renderHeroPool(players, currentPlayer) {
        const poolEl = document.getElementById('heroPool');
        document.getElementById('heroCount').textContent = 1; // 目前只有一场
        // 展示该位置玩家本局使用的英雄，未来可以加历史
        poolEl.innerHTML = `
            <div class="hero-item">
                <div class="hero-games">1</div>
                <img class="hero-icon" src="https://ddragon.leagueoflegends.com/cdn/14.1.1/img/champion/${currentPlayer.champion}.png" onerror="this.style.background='#333'">
                <div class="hero-win">本局</div>
                <div class="hero-kda">${currentPlayer.kills}/${currentPlayer.deaths}/${currentPlayer.assists}</div>
            </div>
        `;
    }

    // 渲染雷达图
    function renderRadar(stats, avgStats) {
        const chartDom = document.getElementById('radarChart');
        if (!myChart) myChart = echarts.init(chartDom);
        
        const option = {
            backgroundColor: 'transparent',
            radar: {
                indicator: [
                    { name: '', max: 5 },   // KDA
                    { name: '', max: 10 },  // 分均补刀
                    { name: '', max: 1000 },// 分均伤害
                    { name: '', max: 15 },  // 参与击杀
                    { name: '', max: 500 }, // 分均经济
                    { name: '', max: 40 },  // 伤害占比
                    { name: '', max: 300 }, // 伤转
                    { name: '', max: 5 }    // 生存
                ],
                center: ['50%', '50%'], radius: '68%', splitNumber: 4, shape: 'polygon',
                splitArea: { areaStyle: { color: ['rgba(30,30,30,0.25)', 'rgba(30,30,30,0.08)'] } },
                axisLine: { show: false }, splitLine: { lineStyle: { color: '#fff', opacity: 0.2 } }, name: { show: false }
            },
            series: [{
                type: 'radar',
                data: [
                    { value: [stats.kda, stats.cs, stats.dmg, 0, stats.gold, stats.share, stats.conv, stats.surv], itemStyle: { color: '#00bcd4' }, areaStyle: { color: 'rgba(0,188,212,0.4)' }, lineStyle: { color: '#00bcd4', width: 3 }, symbol: 'none' },
                    { value: [avgStats.kda, avgStats.cs, avgStats.dmg, 0, avgStats.gold, avgStats.share, avgStats.conv, avgStats.surv], itemStyle: { color: '#ff5252' }, areaStyle: { color: 'transparent' }, lineStyle: { color: '#ff5252', width: 2, type: 'dashed' }, symbol: 'none' }
                ]
            }]
        };
        myChart.setOption(option);
        window.addEventListener('resize', () => myChart.resize());
    }

    loadData();
</script>
</body>
</html>
