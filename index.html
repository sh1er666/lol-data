<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H·武道会 · 数据展示</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* ===== 全局重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0d12; color: #eee;
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 24px; position: relative; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; top: -30%; left: -20%; width: 80%; height: 80%;
            background: radial-gradient(circle at 30% 40%, rgba(122, 61, 240, 0.12) 0%, transparent 70%);
            animation: aurora 12s ease-in-out infinite alternate; z-index: 0; pointer-events: none;
        }
        body::after {
            content: ''; position: fixed; bottom: -30%; right: -20%; width: 80%; height: 80%;
            background: radial-gradient(circle at 70% 60%, rgba(0, 188, 212, 0.08) 0%, transparent 70%);
            animation: aurora2 15s ease-in-out infinite alternate; z-index: 0; pointer-events: none;
        }
        @keyframes aurora {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.2); }
        }
        @keyframes aurora2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-5%, -5%) scale(1.3); }
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative; z-index: 1; width: 100%; max-width: 1360px;
            background: rgba(21, 24, 30, 0.75); backdrop-filter: blur(24px) saturate(1.2);
            border-radius: 24px; padding: 28px 32px 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(122, 61, 240, 0.08) inset;
        }

        /* ===== 标题 ===== */
        .title { text-align: center; font-size: 32px; font-weight: 700; letter-spacing: 6px; padding: 8px 0 18px; color: #f0f0f0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); position: relative; }
        .title::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 100px; height: 2px; background: linear-gradient(90deg, transparent, #7a3df0, #00bcd4, transparent); border-radius: 4px; }
        .title .sub { font-weight: 300; font-size: 14px; color: #888; letter-spacing: 2px; display: block; margin-top: 2px; }

        /* ===== 控制栏 ===== */
        .control-bar { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
        .team-select { background: rgba(42, 47, 56, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); color: #ccc; padding: 9px 22px; border-radius: 40px; font-size: 14px; font-weight: 500; cursor: pointer; outline: none; appearance: none; text-align: center; backdrop-filter: blur(4px); transition: all 0.3s; letter-spacing: 0.5px; }
        .team-select:hover { background: rgba(60, 65, 80, 0.8); color: #fff; border-color: rgba(122, 61, 240, 0.3); }
        .team-select option { background: #1a1d24; color: #eee; }
        .position-selector { display: flex; gap: 8px; flex-wrap: wrap; }
        .pos-btn { background: rgba(42, 47, 56, 0.6); border: 1px solid rgba(255, 255, 255, 0.06); color: #999; padding: 9px 22px; border-radius: 40px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); backdrop-filter: blur(4px); letter-spacing: 0.5px; }
        .pos-btn:hover { background: rgba(60, 65, 80, 0.8); color: #fff; transform: translateY(-1px); }
        .pos-btn.active { background: linear-gradient(135deg, #7a3df0, #6a2fd0); color: #fff; border-color: #7a3df0; box-shadow: 0 4px 24px rgba(122, 61, 240, 0.35); transform: translateY(-1px); }

        /* ===== 主区域 ===== */
        .main-area { display: flex; justify-content: space-between; gap: 24px; align-items: stretch; margin-top: 20px; }

        /* --- 左侧 --- */
        .left-panel { width: 26%; min-width: 210px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
        .hero-pool-title { background: linear-gradient(135deg, #7a3df0, #5a2db0); color: #fff; text-align: center; padding: 10px 0; border-radius: 40px; font-weight: 600; font-size: 15px; letter-spacing: 1px; box-shadow: 0 4px 20px rgba(122, 61, 240, 0.25); flex-shrink: 0; }
        .hero-pool-title span { font-weight: 700; background: rgba(255, 255, 255, 0.2); padding: 0 8px; border-radius: 12px; }
        .hero-pool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; flex: 1 1 auto; align-content: start; max-height: 340px; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: #7a3df0 transparent; }
        .hero-pool-grid::-webkit-scrollbar { width: 4px; }
        .hero-pool-grid::-webkit-scrollbar-track { background: transparent; }
        .hero-pool-grid::-webkit-scrollbar-thumb { background: #7a3df0; border-radius: 8px; }
        .hero-item { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; background: rgba(255, 255, 255, 0.03); border-radius: 12px; padding: 6px 4px 8px; transition: all 0.3s; border: 1px solid transparent; }
        .hero-item:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(122, 61, 240, 0.2); transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
        .hero-games { position: absolute; top: 2px; left: 6px; color: #fff; font-weight: 700; font-size: 12px; background: rgba(0, 0, 0, 0.6); padding: 0 6px; border-radius: 8px; backdrop-filter: blur(4px); }
        .hero-icon { width: 62px; height: 62px; border-radius: 12px; margin-bottom: 4px; background: #1e222a; border: 2px solid rgba(255, 255, 255, 0.06); transition: all 0.3s; object-fit: cover; }
        .hero-item:hover .hero-icon { border-color: rgba(122, 61, 240, 0.4); box-shadow: 0 0 20px rgba(122, 61, 240, 0.15); }
        .hero-win { color: #bbb; font-size: 11px; font-weight: 500; }
        .hero-kda { color: #777; font-size: 10px; margin-top: 1px; }

        /* --- 左侧底部进度条 --- */
        .left-bottom-stats { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; background: rgba(0, 0, 0, 0.15); border-radius: 16px; padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.04); }
        .stat-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .stat-row .mini-stat { flex: 1 1 0; min-width: 90px; }
        .mini-stat { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 6px 12px; position: relative; overflow: hidden; backdrop-filter: blur(4px); transition: all 0.3s; }
        .mini-stat:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(122, 61, 240, 0.15); }
        .mini-stat-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; align-items: center; }
        .mini-stat-name { color: #888; font-weight: 500; font-size: 11px; letter-spacing: 0.3px; }
        .mini-stat-val { color: #fff; font-weight: 700; font-size: 13px; }
        .mini-stat-val.blue { color: #00d4e6; }
        .mini-stat-val.red { color: #ff6b6b; }
        .mini-stat-rank { color: #fcd34d; font-size: 11px; font-weight: 700; margin-left: 4px; }
        .bar-bg { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, 0.05); border-radius: 0 0 10px 10px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7a3df0, #00bcd4); transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1); border-radius: 0 0 10px 10px; }
        .bar-fill.red { background: linear-gradient(90deg, #ff5252, #ff6b6b); }

        /* --- 中间 --- */
        .player-info { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 8px; min-width: 140px; }
        .player-avatar-wrap { position: relative; border-radius: 16px; padding: 4px; background: linear-gradient(135deg, #7a3df0, #00bcd4); box-shadow: 0 0 40px rgba(122, 61, 240, 0.15); transition: all 0.4s; }
        .player-avatar-wrap:hover { box-shadow: 0 0 60px rgba(122, 61, 240, 0.3); transform: scale(1.02); }
        .player-avatar { width: 140px; height: 140px; object-fit: cover; border-radius: 13px; display: block; background: #1a1d24; }
        .player-meta { display: flex; align-items: baseline; gap: 18px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
        .player-name { font-size: 26px; font-weight: 700; color: #f0f0f0; letter-spacing: 0.5px; }
        .player-total-kda { font-size: 20px; font-weight: 600; color: #aaa; letter-spacing: 1px; background: rgba(255, 255, 255, 0.05); padding: 2px 16px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.06); }
        .player-total-kda .k { color: #00bcd4; }
        .player-total-kda .d { color: #ff5252; }
        .player-total-kda .a { color: #fcd34d; }

        /* --- 右侧 --- */
        .right-panel { width: 55%; position: relative; height: 740px; display: flex; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.2); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.04); padding: 8px; }
        #radarChart { width: 520px; height: 520px; position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); }
        .stats-wrapper { width: 520px; height: 520px; position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        .stat-item { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; transform: translate(-50%, -50%); line-height: 1.3; min-width: 72px; padding: 4px 8px; border-radius: 8px; background: rgba(0, 0, 0, 0.30); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, 0.04); transition: all 0.3s ease; }
        .stat-item:hover { background: rgba(0, 0, 0, 0.50); border-color: rgba(122, 61, 240, 0.2); transform: translate(-50%, -50%) scale(1.06); }
        .stat-name { color: #ddd; font-weight: 500; font-size: 11px; letter-spacing: 0.5px; opacity: 0.8; }
        .stat-rank { color: #fcd34d; font-size: 11px; font-weight: 700; }
        .stat-val-blue { color: #00d4e6; font-weight: 700; font-size: 14px; }
        .stat-val-red { color: #ff6b6b; font-size: 10px; font-weight: 500; opacity: 0.7; margin-top: 1px; }

        /* 定位样式 */
        .pos-top { top: 2%; left: 50%; }
        .pos-topright { top: 13%; left: 87%; }
        .pos-right { top: 45%; left: 97.5%; }
        .pos-bottomright { bottom: 16%; left: 87%; }
        .pos-bottom { bottom: 1%; left: 50%; }
        .pos-bottomleft { bottom: 16%; left: 13%; }
        .pos-left { top: 45%; left: 2.5%; }
        .pos-topleft { top: 13%; left: 13%; }

        .avg-note { position: absolute; right: 18px; top: 18px; color: #888; font-size: 11px; background: rgba(0, 0, 0, 0.5); padding: 4px 12px; border-radius: 20px; backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.04); z-index: 10; font-weight: 500; letter-spacing: 0.3px; }
        .avg-note .red-dot { color: #ff5252; font-weight: 600; }
        .avg-note .blue-dot { color: #00bcd4; font-weight: 600; }

        /* ===== 响应式 ===== */
        @media (max-width: 1100px) {
            .container { padding: 20px; }
            .main-area { flex-direction: column; align-items: center; }
            .left-panel { width: 100%; min-width: unset; }
            .hero-pool-grid { max-height: 260px; grid-template-columns: repeat(6, 1fr); }
            .left-bottom-stats { width: 100%; }
            .player-info { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 12px; }
            .right-panel { width: 100%; height: 660px; }
            #radarChart, .stats-wrapper { width: 420px; height: 420px; }
            .stat-item { min-width: 60px; padding: 3px 6px; }
            .stat-name { font-size: 10px; }
            .stat-val-blue { font-size: 12px; }
            .stat-rank { font-size: 10px; }
            .stat-val-red { font-size: 9px; }
            .pos-topright { left: 85%; }
            .pos-bottomright { left: 85%; }
            .pos-topleft { left: 15%; }
            .pos-bottomleft { left: 15%; }
            .pos-right { left: 96.5%; }
            .pos-left { left: 3.5%; }
        }
        @media (max-width: 600px) {
            body { padding: 12px; }
            .container { padding: 14px; border-radius: 16px; }
            .title { font-size: 22px; letter-spacing: 3px; padding: 4px 0 12px; }
            .title .sub { font-size: 11px; }
            .hero-pool-grid { max-height: 200px; grid-template-columns: repeat(4, 1fr); gap: 6px; }
            .hero-icon { width: 48px; height: 48px; }
            .right-panel { height: 520px; }
            #radarChart, .stats-wrapper { width: 310px; height: 310px; }
            .stat-item { min-width: 48px; padding: 2px 4px; border-radius: 6px; }
            .stat-name { font-size: 8px; }
            .stat-val-blue { font-size: 10px; }
            .stat-rank { font-size: 8px; }
            .stat-val-red { font-size: 7px; }
            .pos-topright { top: 9%; left: 83%; }
            .pos-bottomright { bottom: 13%; left: 83%; }
            .pos-left { top: 43%; left: 4%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">
            H·武道会
            <span class="sub">SEASON DATA</span>
        </div>
        <div class="control-bar">
            <select class="team-select" id="teamSelect"></select>
            <div class="position-selector" id="positionSelector">
                <button class="pos-btn" data-pos="TOP">上单</button>
                <button class="pos-btn" data-pos="JUNGLE">打野</button>
                <button class="pos-btn active" data-pos="MIDDLE">中单</button>
                <button class="pos-btn" data-pos="BOTTOM">下路</button>
                <button class="pos-btn" data-pos="UTILITY">辅助</button>
            </div>
        </div>
        <div class="main-area">
            <!-- 左侧 -->
            <div class="left-panel">
                <div class="hero-pool-title">英雄池 (<span id="heroCount">0</span>)</div>
                <div class="hero-pool-grid" id="heroPool"></div>
                <div class="left-bottom-stats">
                    <!-- 进度条部分原样保留即可 -->
                    <div class="stat-row">
                        <div class="mini-stat">
                            <div class="mini-stat-top">
                                <span class="mini-stat-name">对位等级差</span>
                                <span><span class="mini-stat-val blue" id="stat-lane">--</span><span class="mini-stat-rank" id="rank-lane">#-</span></span>
                            </div>
                            <div class="bar-bg"><div class="bar-fill" id="bar-lane"></div></div>
                        </div>
                        <div class="mini-stat">
                            <div class="mini-stat-top">
                                <span class="mini-stat-name">对位经济差</span>
                                <span><span class="mini-stat-val blue" id="stat-gdiff">--</span><span class="mini-stat-rank" id="rank-gdiff">#-</span></span>
                            </div>
                            <div class="bar-bg"><div class="bar-fill" id="bar-gdiff"></div></div>
                        </div>
                        <div class="mini-stat">
                            <div class="mini-stat-top">
                                <span class="mini-stat-name">参团率</span>
                                <span><span class="mini-stat-val blue" id="stat-partrate">--</span><span class="mini-stat-rank" id="rank-partrate">#-</span></span>
                            </div>
                            <div class="bar-bg"><div class="bar-fill" id="bar-partrate"></div></div>
                        </div>
                    </div>
                    <div class="stat-row">
                        <div class="mini-stat">
                            <div class="mini-stat-top">
                                <span class="mini-stat-name">承伤占比</span>
                                <span><span class="mini-stat-val blue" id="stat-taken">--</span><span class="mini-stat-rank" id="rank-taken">#-</span></span>
                            </div>
                            <div class="bar-bg"><div class="bar-fill red" id="bar-taken"></div></div>
                        </div>
                        <div class="mini-stat">
                            <div class="mini-stat-top">
                                <span class="mini-stat-name">分均视野</span>
                                <span><span class="mini-stat-val blue" id="stat-vision">--</span><span class="mini-stat-rank" id="rank-vision">#-</span></span>
                            </div>
                            <div class="bar-bg"><div class="bar-fill" id="bar-vision"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 中间 -->
            <div class="player-info">
                <div class="player-avatar-wrap">
                    <img class="player-avatar" id="playerAvatar" src="" onerror="this.src='https://via.placeholder.com/160'" alt="avatar" />
                </div>
                <div class="player-meta">
                    <div class="player-name" id="playerName">加载中...</div>
                    <div class="player-total-kda" id="totalKda">
                        <span class="k">0</span>/<span class="d">0</span>/<span class="a">0</span>
                    </div>
                </div>
            </div>

            <!-- 右侧 -->
            <div class="right-panel">
                <div id="radarChart"></div>
                <!-- 动态生成的指标容器 -->
                <div class="stats-wrapper" id="statsWrapper"></div>
                <div class="avg-note">
                    <span class="red-dot">●</span> 均值 &nbsp;<span class="blue-dot">●</span> 选手
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  位置动态指标配置表
        // ============================================================
        const positionConfigs = {
            'TOP': {
                keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'damage_taken_per_death'],
                labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '每死承伤'],
                avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold', 'avg_damage_taken_per_death'],
                ranks: ['rank_kda', 'rank_kills_assists', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_dmgtoGold', 'rank_damage_taken_per_death'],
                maxs: [10, 15, 2000, 15, 800, 40, 300, 12000]
            },
            'JUNGLE': {
                keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'participation', 'damage_taken_per_death'],
                labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '参团率', '每死承伤'],
                avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_participation', 'avg_damage_taken_per_death'],
                ranks: ['rank_kda', 'rank_kills_assists', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_participation', 'rank_damage_taken_per_death'],
                maxs: [10, 15, 2000, 15, 800, 40, 100, 12000]
            },
            'MIDDLE': {
                keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'survival'],
                labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '生存能力'],
                avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold', 'avg_survival'],
                ranks: ['rank_kda', 'rank_kills_assists', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_dmgtoGold', 'rank_survival'],
                maxs: [10, 15, 2000, 15, 800, 40, 300, 5]
            },
            'BOTTOM': {
                keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'survival'],
                labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '生存能力'],
                avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold', 'avg_survival'],
                ranks: ['rank_kda', 'rank_kills_assists', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_dmgtoGold', 'rank_survival'],
                maxs: [10, 15, 2000, 15, 800, 40, 300, 5]
            },
            'UTILITY': {
                keys: ['kda', 'kills_assists', 'goldpm', 'participation', 'dmgshare', 'damage_taken_share', 'vision_per_min', 'damage_taken_per_death'],
                labels: ['KDA', '击杀助攻', '分均经济', '参团率', '伤害占比', '承伤占比', '分均视野', '每死承伤'],
                avgs: ['avg_kda', 'avg_kills_assists', 'avg_goldpm', 'avg_participation', 'avg_dmgshare', 'avg_damage_taken_share', 'avg_vision_per_min', 'avg_damage_taken_per_death'],
                ranks: ['rank_kda', 'rank_kills_assists', 'rank_goldpm', 'rank_participation', 'rank_dmgshare', 'rank_damage_taken_share', 'rank_vision_per_min', 'rank_damage_taken_per_death'],
                maxs: [10, 15, 800, 100, 40, 40, 5, 12000]
            }
        };

        let currentData = [];
        let avgStats = {};
        let currentPosition = 'MIDDLE';
        let myChart = null;

        async function loadData() {
            try {
                const res = await fetch('./data.json');
                const json = await res.json();
                const avgStatsObj = json.find(item => item.avg_kda !== undefined);
                if (avgStatsObj) {
                    avgStats = avgStatsObj;
                } else {
                    avgStats = { avg_kda: 0, avg_cspm: 0, avg_dpm: 0, avg_kpart: 0, avg_goldpm: 0, avg_dmgshare: 0, avg_dmgtoGold: 0, avg_survival: 0, avg_lane_diff: 0, avg_gold_diff: 0, avg_participation: 0, avg_damage_taken: 0, avg_vision: 0 };
                }

                currentData = json.filter(item => item.avg_kda === undefined);
                const teamSet = new Set(currentData.map(p => p.player.split(' ')[0]));
                const teamSelect = document.getElementById('teamSelect');
                let optionsHtml = `<option value="ALL">全部战队</option>`;
                teamSet.forEach(team => { optionsHtml += `<option value="${team}">${team}</option>`; });
                teamSelect.innerHTML = optionsHtml;

                teamSelect.addEventListener('change', () => updateView());
                document.querySelectorAll('.pos-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        currentPosition = e.target.dataset.pos;
                        updateView();
                    });
                });

                updateView();
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('playerName').textContent = '数据加载失败';
            }
        }

        function updateView() {
            const selectedTeam = document.getElementById('teamSelect').value;
            let filteredPlayers = currentData.filter(p => p.position === currentPosition);
            if (selectedTeam !== 'ALL') {
                filteredPlayers = filteredPlayers.filter(p => p.player.startsWith(selectedTeam));
            }

            if (filteredPlayers.length === 0) {
                document.getElementById('playerName').textContent = '暂无选手';
                document.getElementById('totalKda').innerHTML = '<span class="k">0</span>/<span class="d">0</span>/<span class="a">0</span>';
                document.getElementById('playerAvatar').src = 'https://via.placeholder.com/160';
                document.getElementById('heroPool').innerHTML = '';
                document.getElementById('heroCount').textContent = '0';
                ['lane', 'gdiff', 'partrate', 'taken', 'vision'].forEach(key => {
                    document.getElementById(`stat-${key}`).textContent = '--';
                    document.getElementById(`rank-${key}`).textContent = '#-';
                    document.getElementById(`bar-${key}`).style.width = '0%';
                });
                document.getElementById('statsWrapper').innerHTML = '';
                return;
            }

            const player = filteredPlayers[0];
            const avatarUrl = `http://q.qlogo.cn/headimg_dl?dst_uin=${player.qq}&spec=640`;
            const avatarImg = document.getElementById('playerAvatar');
            avatarImg.src = avatarUrl;
            avatarImg.onerror = function() { this.onerror = null; this.src = 'https://via.placeholder.com/160'; };

            document.getElementById('playerName').textContent = player.player;
            document.getElementById('totalKda').innerHTML =
                `<span class="k">${player.kills}</span>/<span class="d">${player.deaths}</span>/<span class="a">${player.assists}</span>`;

            renderHeroPool(player);

            // 动态渲染右侧指标
            renderStatsWrapper(player);
            // 重新绘制雷达图
            renderRadar(player);
        }

        function renderHeroPool(currentPlayer) {
            const poolEl = document.getElementById('heroPool');
            let heroesList = currentPlayer.heroes ? currentPlayer.heroes : [{ champion: currentPlayer.champion, games: 1, wins: 1 }];
            document.getElementById('heroCount').textContent = heroesList.length;
            poolEl.innerHTML = heroesList.map(h => {
                const winRate = Math.round((h.wins / h.games) * 100);
                return `
                        <div class="hero-item">
                            <div class="hero-games">${h.games}</div>
                            <img class="hero-icon" src="https://ddragon.leagueoflegends.com/cdn/14.1.1/img/champion/${h.champion}.png" onerror="this.style.background='#2a2f38'">
                            <div class="hero-win">${winRate}%</div>
                            <div class="hero-kda">${h.games}局</div>
                        </div>
                    `;
            }).join('');
        }

        // 动态生成右侧的8个指标项
        function renderStatsWrapper(player) {
            const config = positionConfigs[currentPosition];
            const wrapper = document.getElementById('statsWrapper');
            const positions = ['top', 'topright', 'right', 'bottomright', 'bottom', 'bottomleft', 'left', 'topleft'];

            wrapper.innerHTML = config.keys.map((key, index) => {
                let val = player[key];
                // 击杀助攻为 kills + assists
                if (key === 'kills_assists') {
                    val = (player.kills + player.assists).toFixed(1);
                }
                if (val === undefined || val === null) val = 0;

                let avgVal = avgStats[config.avgs[index]];
                if (avgVal === undefined || avgVal === null) avgVal = 0;

                let rank = player[config.ranks[index]];
                if (rank === undefined || rank === null) rank = 0;

                // 格式化数值（百分比无需处理，其余保留两位小数）
                let displayVal = typeof val === 'number' ? val.toFixed(2) : val;
                let displayAvg = typeof avgVal === 'number' ? avgVal.toFixed(2) : avgVal;

                return `
                    <div class="stat-item pos-${positions[index]}">
                        <div class="stat-name">${config.labels[index]}</div>
                        <div><span class="stat-rank">#${rank}</span> <span class="stat-val-blue">${displayVal}</span></div>
                        <div class="stat-val-red">${displayAvg}</div>
                    </div>
                `;
            }).join('');
        }

        function renderRadar(player) {
            const chartDom = document.getElementById('radarChart');
            if (!myChart) {
                myChart = echarts.init(chartDom, 'dark');
                window.addEventListener('resize', () => myChart && myChart.resize());
            }

            const config = positionConfigs[currentPosition];
            const indicator = config.keys.map((key, index) => ({
                name: '', // 不显示雷达图本身的文字，靠周围展示
                max: config.maxs[index]
            }));

            // 根据当前配置取值
            let playerValues = config.keys.map(key => {
                let val = player[key];
                if (key === 'kills_assists') val = (player.kills + player.assists).toFixed(1);
                return val || 0;
            });

            let avgValues = config.avgs.map(key => avgStats[key] || 0);

            const option = {
                backgroundColor: 'transparent',
                radar: {
                    indicator: indicator,
                    center: ['50%', '48%'],
                    radius: '70%',
                    splitNumber: 4,
                    shape: 'polygon',
                    splitArea: { areaStyle: { color: ['rgba(122,61,240,0.02)', 'rgba(122,61,240,0.05)'] } },
                    axisLine: { show: true, lineStyle: { color: 'rgba(255,255,255,0.07)', width: 1 } },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)', width: 1 } },
                    axisName: { show: false }
                },
                series: [{
                    type: 'radar',
                    data: [{
                        value: playerValues,
                        itemStyle: { color: '#00d4e6' },
                        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(0,212,230,0.30)' }, { offset: 1, color: 'rgba(0,212,230,0.03)' }]) },
                        lineStyle: { color: '#00d4e6', width: 2.5 },
                        symbol: 'circle', symbolSize: 5,
                        itemStyle: { color: '#00d4e6', borderColor: '#fff', borderWidth: 1 }
                    }, {
                        value: avgValues,
                        itemStyle: { color: '#ff6b6b' },
                        areaStyle: { color: 'transparent' },
                        lineStyle: { color: '#ff6b6b', width: 1.5, type: 'dashed' },
                        symbol: 'diamond', symbolSize: 4,
                        itemStyle: { color: '#ff6b6b' }
                    }]
                }]
            };

            myChart.setOption(option, true);
            myChart.resize();
        }

        loadData();
    </script>
</body>
</html>
