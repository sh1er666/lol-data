<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>H·武道会 · 数据展示</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
    /* ===== 全局重置 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --bg-deep: #0b0d12;
        --panel-bg: rgba(21, 24, 30, 0.78);
        --accent-purple: #7a3df0;
        --accent-cyan: #00bcd4;
        --accent-amber: #fcd34d;
        --accent-red: #ff5252;
        --text-primary: #f0f0f0;
        --text-secondary: #999;
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-pill: 40px;
        --shadow-glow-purple: 0 4px 24px rgba(122, 61, 240, 0.35);
        --transition-smooth: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    body {
        background: var(--bg-deep);
        color: var(--text-primary);
        font-family: 'Inter', 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        position: relative;
        overflow-x: hidden;
    }
    body::before {
        content: '';
        position: fixed;
        top: -30%; left: -20%;
        width: 80%; height: 80%;
        background: radial-gradient(circle at 30% 40%, rgba(122, 61, 240, 0.12) 0%, transparent 70%);
        animation: aurora 12s ease-in-out infinite alternate;
        z-index: 0; pointer-events: none;
    }
    body::after {
        content: '';
        position: fixed;
        bottom: -30%; right: -20%;
        width: 80%; height: 80%;
        background: radial-gradient(circle at 70% 60%, rgba(0, 188, 212, 0.08) 0%, transparent 70%);
        animation: aurora2 15s ease-in-out infinite alternate;
        z-index: 0; pointer-events: none;
    }
    @keyframes aurora { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(5%,5%) scale(1.2); } }
    @keyframes aurora2 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-5%,-5%) scale(1.3); } }

    .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1380px;
        background: var(--panel-bg);
        backdrop-filter: blur(24px) saturate(1.2);
        border-radius: var(--radius-lg);
        padding: 28px 32px 32px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(122, 61, 240, 0.08) inset;
    }

    .title {
        text-align: center;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 6px;
        padding: 8px 0 18px;
        color: var(--text-primary);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        position: relative;
    }
    .title::after {
        content: '';
        position: absolute;
        bottom: -1px; left: 50%;
        transform: translateX(-50%);
        width: 100px; height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-cyan), transparent);
        border-radius: 4px;
    }
    .title .sub {
        font-weight: 300; font-size: 14px; color: #888;
        letter-spacing: 2px; display: block; margin-top: 2px;
    }

    .control-bar {
        display: flex; justify-content: center; align-items: center;
        gap: 16px; margin-top: 16px; flex-wrap: wrap;
    }
    .team-select, .sort-select {
        background: rgba(42, 47, 56, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #ccc; padding: 9px 22px;
        border-radius: var(--radius-pill);
        font-size: 14px; font-weight: 500;
        cursor: pointer; outline: none; appearance: none;
        text-align: center; backdrop-filter: blur(4px);
        transition: var(--transition-smooth); letter-spacing: 0.5px;
    }
    .team-select:hover, .sort-select:hover {
        background: rgba(60, 65, 80, 0.8); color: #fff;
        border-color: rgba(122, 61, 240, 0.3);
    }
    .team-select option, .sort-select option { background: #1a1d24; color: #eee; }

    .position-selector { display: flex; gap: 8px; flex-wrap: wrap; }
    .pos-btn {
        background: rgba(42, 47, 56, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #999; padding: 9px 22px;
        border-radius: var(--radius-pill);
        font-size: 13px; font-weight: 600;
        cursor: pointer; transition: var(--transition-smooth);
        backdrop-filter: blur(4px); letter-spacing: 0.5px;
    }
    .pos-btn:hover { background: rgba(60, 65, 80, 0.8); color: #fff; transform: translateY(-1px); }
    .pos-btn.active {
        background: linear-gradient(135deg, #7a3df0, #6a2fd0);
        color: #fff; border-color: #7a3df0;
        box-shadow: var(--shadow-glow-purple); transform: translateY(-1px);
    }

    .search-bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .search-input {
        flex: 1 1 180px;
        background: rgba(42, 47, 56, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #eee; padding: 9px 18px;
        border-radius: var(--radius-pill);
        font-size: 14px; outline: none;
        transition: var(--transition-smooth); letter-spacing: 0.5px;
    }
    .search-input:focus {
        border-color: rgba(122, 61, 240, 0.5);
        box-shadow: 0 0 20px rgba(122, 61, 240, 0.15);
        background: rgba(50, 55, 65, 0.8);
    }
    .search-input::placeholder { color: #666; }

    .view-switch { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; align-items: center; }
    .view-btn, .export-btn {
        background: rgba(42, 47, 56, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #999; padding: 8px 16px;
        border-radius: var(--radius-pill);
        font-size: 13px; font-weight: 600;
        cursor: pointer; transition: var(--transition-smooth);
        backdrop-filter: blur(4px); letter-spacing: 0.5px;
    }
    .view-btn:hover, .export-btn:hover {
        background: rgba(60, 65, 80, 0.8); color: #fff; transform: translateY(-1px);
    }
    .view-btn.active {
        background: linear-gradient(135deg, #7a3df0, #6a2fd0);
        color: #fff; border-color: #7a3df0;
        box-shadow: var(--shadow-glow-purple);
    }
    .export-btn {
        background: linear-gradient(135deg, rgba(0, 188, 212, 0.15), rgba(122, 61, 240, 0.15));
        border-color: rgba(0, 188, 212, 0.25); color: #ccc;
    }
    .export-btn:hover {
        background: linear-gradient(135deg, rgba(0, 188, 212, 0.3), rgba(122, 61, 240, 0.3));
        border-color: rgba(0, 188, 212, 0.5); color: #fff;
        box-shadow: 0 4px 20px rgba(0, 188, 212, 0.2);
    }

    /* ============================================================
       选手选择器（改造：换行 + 纵向滚动 + 展开收起 + 对比信息）
       ============================================================ */
    .player-selector {
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 8px 10px;
        margin-top: 14px;
        padding: 8px 14px 12px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: var(--radius-md);
        border: 1px solid rgba(255, 255, 255, 0.04);
        max-height: 138px;                            /* 约两行 chip */
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: rgba(122, 61, 240, 0.6) transparent;
        transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                    border-color 0.3s ease;
    }
    .player-selector.expanded { max-height: 460px; }
    .player-selector::-webkit-scrollbar { width: 5px; }
    .player-selector::-webkit-scrollbar-track { background: transparent; }
    .player-selector::-webkit-scrollbar-thumb {
        background: rgba(122, 61, 240, 0.5); border-radius: 8px;
    }
    .player-selector::-webkit-scrollbar-thumb:hover {
        background: rgba(122, 61, 240, 0.85);
    }

    /* 顶部信息条：粘性固定，滚动时始终可见 */
    .player-selector .label {
        flex: 0 0 100%;
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #888;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.5px;
        line-height: 1.4;
        padding: 4px 2px 6px;
        margin: -8px -14px 0;
        padding-left: 14px;
        padding-right: 14px;
        background: linear-gradient(180deg,
            rgba(15, 17, 23, 0.98) 0%,
            rgba(15, 17, 23, 0.92) 70%,
            rgba(15, 17, 23, 0) 100%);
        pointer-events: none;
    }
    .player-selector .label > * { pointer-events: auto; }
    .player-selector .label .label-title {
        display: inline-flex; align-items: center; gap: 6px;
        flex-shrink: 0;
    }
    .player-selector .label .count {
        color: #b9a0ff;
        font-weight: 700;
        background: rgba(122, 61, 240, 0.18);
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 11px;
    }
    .player-selector .label .hint {
        color: #555;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.3px;
        margin-left: auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .player-selector .label .compare-info {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        font-size: 11px;
        color: #ffb74d;
        font-weight: 500;
        overflow: hidden;
    }
    .player-selector .label .compare-info .vs {
        color: #666;
        font-size: 10px;
    }
    .player-selector .label .compare-info .tag {
        color: #fff;
        background: rgba(255, 152, 0, 0.22);
        border: 1px solid rgba(255, 152, 0, 0.4);
        padding: 1px 8px;
        border-radius: 8px;
        font-size: 10px;
        font-weight: 500;
        white-space: nowrap;
        max-width: 110px;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .player-selector .label .expand-btn {
        flex-shrink: 0;
        background: rgba(122, 61, 240, 0.15);
        border: 1px solid rgba(122, 61, 240, 0.3);
        color: #b9a0ff;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 12px;
        border-radius: 12px;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: var(--transition-smooth);
        font-family: inherit;
    }
    .player-selector .label .expand-btn:hover {
        background: rgba(122, 61, 240, 0.3);
        color: #fff;
        border-color: rgba(122, 61, 240, 0.6);
        transform: translateY(-1px);
    }

    .player-chip {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 12px 5px 6px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid transparent;
        cursor: pointer;
        transition: var(--transition-smooth);
        flex-shrink: 0;
        white-space: nowrap;
        position: relative;
        user-select: none;
    }
    .player-chip:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); }
    .player-chip.active {
        background: rgba(122, 61, 240, 0.25);
        border-color: rgba(122, 61, 240, 0.4);
        box-shadow: 0 0 20px rgba(122, 61, 240, 0.1);
    }
    .player-chip.compare {
        background: rgba(0, 188, 212, 0.2);
        border-color: rgba(0, 188, 212, 0.5);
        box-shadow: 0 0 15px rgba(0, 188, 212, 0.15);
    }
    /* 当前选手 + 对比 同时存在时的双色提示 */
    .player-chip.active.compare {
        border-color: rgba(0, 229, 255, 0.75);
        box-shadow: 0 0 22px rgba(0, 229, 255, 0.3), 0 0 12px rgba(122, 61, 240, 0.4);
    }
    .player-chip img {
        width: 32px; height: 32px; border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.08);
        object-fit: cover; background: #1a1d24;
    }
    .player-chip .chip-name { color: #eee; font-size: 13px; font-weight: 500; }
    .player-chip .chip-kda { color: #888; font-size: 11px; font-weight: 400; }
    .player-chip .chip-kda .k { color: var(--accent-cyan); }
    .player-chip .chip-kda .d { color: var(--accent-red); }
    .player-chip .chip-kda .a { color: var(--accent-amber); }

    /* ===== 主区域 ===== */
    .main-area {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: stretch;
        margin-top: 16px;
    }

    /* 左侧：英雄池 */
    .left-panel {
        width: 24%;
        min-width: 200px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
    }
    .hero-pool-title {
        background: linear-gradient(135deg, #7a3df0, #5a2db0);
        color: #fff; text-align: center;
        padding: 10px 0;
        border-radius: var(--radius-pill);
        font-weight: 600; font-size: 15px;
        letter-spacing: 1px;
        box-shadow: 0 4px 20px rgba(122, 61, 240, 0.25);
        flex-shrink: 0;
    }
    .hero-pool-title span {
        font-weight: 700;
        background: rgba(255, 255, 255, 0.2);
        padding: 0 8px; border-radius: 12px;
    }
    .hero-pool-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        flex: 1 1 auto;
        align-content: start;
        max-height: 520px;
        overflow-y: auto;
        padding-right: 4px;
        scrollbar-width: thin;
        scrollbar-color: #7a3df0 transparent;
    }
    .hero-pool-grid::-webkit-scrollbar { width: 4px; }
    .hero-pool-grid::-webkit-scrollbar-track { background: transparent; }
    .hero-pool-grid::-webkit-scrollbar-thumb { background: #7a3df0; border-radius: 8px; }
    .hero-item {
        display: flex; flex-direction: column;
        align-items: center; text-align: center;
        position: relative;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        padding: 8px 4px 8px;
        transition: var(--transition-smooth);
        border: 1px solid transparent;
    }
    .hero-item:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(122, 61, 240, 0.2);
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .hero-games {
        position: absolute; top: 2px; left: 6px;
        color: #fff; font-weight: 700; font-size: 12px;
        background: rgba(0, 0, 0, 0.6);
        padding: 0 6px; border-radius: 8px;
        backdrop-filter: blur(4px);
    }
    .hero-icon {
        width: 58px; height: 58px;
        border-radius: 12px; margin-bottom: 4px;
        background: #1e222a;
        border: 2px solid rgba(255, 255, 255, 0.06);
        transition: var(--transition-smooth);
        object-fit: cover;
    }
    .hero-item:hover .hero-icon {
        border-color: rgba(122, 61, 240, 0.4);
        box-shadow: 0 0 20px rgba(122, 61, 240, 0.15);
    }
    .hero-win { color: #ccc; font-size: 11px; font-weight: 600; }
    .hero-kda { color: #777; font-size: 10px; margin-top: 2px; }

    /* 中间：选手信息 */
    .player-info {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 0 8px;
        min-width: 150px;
    }
    .player-avatar-wrap {
        position: relative;
        border-radius: 16px;
        padding: 4px;
        background: linear-gradient(135deg, #7a3df0, #00bcd4);
        box-shadow: 0 0 40px rgba(122, 61, 240, 0.15);
        transition: var(--transition-smooth);
    }
    .player-avatar-wrap:hover {
        box-shadow: 0 0 60px rgba(122, 61, 240, 0.3);
        transform: scale(1.02);
    }
    .player-avatar {
        width: 150px; height: 150px;
        object-fit: cover;
        border-radius: 13px;
        display: block;
        background: #1a1d24;
    }
    .player-name {
        font-size: 26px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: 0.5px;
        text-align: center;
        line-height: 1.2;
    }
    .player-total-kda {
        font-size: 20px;
        font-weight: 600;
        color: #aaa;
        letter-spacing: 1px;
        background: rgba(255, 255, 255, 0.05);
        padding: 3px 18px;
        border-radius: var(--radius-pill);
        border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .player-total-kda .k { color: var(--accent-cyan); }
    .player-total-kda .d { color: var(--accent-red); }
    .player-total-kda .a { color: var(--accent-amber); }

    /* 右侧：图表 */
    .right-panel {
        width: 56%;
        position: relative;
        height: 640px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        padding: 8px;
        overflow: hidden;
    }
    .right-panel.radar-glow::before {
        content: '';
        position: absolute;
        left: 50%; top: 50%;
        width: min(82%, 540px);
        aspect-ratio: 1 / 1;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle,
            rgba(122, 61, 240, 0.13) 0%,
            rgba(0, 188, 212, 0.06) 42%,
            transparent 72%);
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        animation: radarBreath 6s ease-in-out infinite;
    }
    @keyframes radarBreath {
        0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
        50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.05); }
    }

    #radarChart {
        width: 520px; height: 520px;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        transition: opacity 0.3s;
        z-index: 1;
    }
    .stats-wrapper {
        width: 520px; height: 520px;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 5;
    }

    .stat-item {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        transform: translate(-50%, -50%);
        line-height: 1.2;
        white-space: nowrap;
        padding: 5px 10px;
        border-radius: 10px;
        background: rgba(8, 9, 13, 0.82);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
        transition: var(--transition-smooth);
        pointer-events: auto;
        cursor: pointer;
    }
    .stat-item::before {
        content: '';
        position: absolute;
        left: 0; top: 20%;
        width: 2px; height: 60%;
        border-radius: 2px;
        background: transparent;
        transition: var(--transition-smooth);
    }
    .stat-item.above::before { background: linear-gradient(180deg, transparent, #4ade80, transparent); }
    .stat-item.below::before { background: linear-gradient(180deg, transparent, #ff5252, transparent); }

    .stat-item:hover {
        background: rgba(8, 9, 13, 0.96);
        border-color: rgba(122, 61, 240, 0.4);
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 0 0 24px rgba(122, 61, 240, 0.25);
        z-index: 10;
    }
    .stat-rank {
        color: #fcd34d;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }
    .stat-main {
        display: flex;
        align-items: baseline;
        gap: 5px;
    }
    .stat-val {
        color: #00d4e6;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2px;
        text-shadow: 0 0 12px rgba(0, 212, 230, 0.35);
    }
    .stat-name {
        color: #ddd;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.5px;
        opacity: 0.9;
    }
    .stat-avg {
        color: #ff6b6b;
        font-size: 10px;
        font-weight: 600;
        opacity: 0.85;
        letter-spacing: 0.2px;
        display: flex;
        align-items: center;
        gap: 3px;
    }
    .stat-avg .arrow { font-size: 8px; line-height: 1; }
    .stat-avg.above .arrow { color: #4ade80; }
    .stat-avg.below .arrow { color: #ff7b7b; }
    .stat-avg.same  .arrow { color: #666; }

    .pos-top        { top: 8%;  left: 50%; }
    .pos-topright   { top: 20%; left: 77%; }
    .pos-right      { top: 50%; left: 96%; }
    .pos-bottomright{ top: 82%; left: 88%; }
    .pos-bottom     { top: 91%; left: 50%; }
    .pos-bottomleft { top: 80%; left: 20%; }
    .pos-left       { top: 50%; left: 6%; }
    .pos-topleft    { top: 20%; left: 23%; }

    .avg-note {
        position: absolute;
        right: 18px; top: 18px;
        color: #888; font-size: 11px;
        background: rgba(0, 0, 0, 0.5);
        padding: 4px 12px;
        border-radius: 20px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.04);
        z-index: 10; font-weight: 500;
        letter-spacing: 0.3px; pointer-events: none;
    }
    .avg-note .red-dot { color: #ff5252; font-weight: 600; }
    .avg-note .blue-dot { color: #00bcd4; font-weight: 600; }

    .radar-legend {
        position: absolute;
        left: 16px; bottom: 14px;
        z-index: 12;
        display: flex; flex-direction: column; gap: 4px;
        font-size: 10px; color: #aaa;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.55);
        padding: 8px 14px;
        border-radius: 12px;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.06);

    .loading-overlay {

    /* ===== 响应式 ===== */
    @media (max-width: 1180px) {

<body>
<div class="container">
    <div class="title">H·武道会<span class="sub">SEASON DATA</span></div>

    <div class="control-bar">
        <select class="team-select" id="teamSelect"></select>

    <div class="main-area" id="mainArea">

        <!-- 中：选手信息 -->

        <!-- 右：图表 -->
        <div class="right-panel" id="rightPanel">

                <div class="loading-spinner"></div>

                    <div class="progress-fill" id="exportProgressFill"></div>

            <div class="stats-wrapper" id="statsWrapper"></div>

            <div class="radar-legend" id="radarLegend">

                    <span>当前选手</span>
                </div>
                <div class="legend-row">
                    <span class="legend-dot" style="background:#ff9800;border-color:#ff9800;"></span>
                    <span>对比选手1</span>

                <div class="legend-row">
                    <span class="legend-dot" style="background:#c084fc;border-color:#c084fc;"></span>
                    <span>对比选手2</span>
                </div>
                <div class="legend-row">
                    <span class="legend-line" style="background:#ff6b6b;border-top:1.5px dashed #ff6b6b;"></span>
                    <span>全选手均值</span>

            </div>

            <div class="avg-note">
                <span class="red-dot">●</span> 均值 &nbsp;<span class="blue-dot">●</span> 选手
            </div>

            <div id="scatterChart"></div>
            <div id="barChart"></div>
            <div id="heatmapChart"></div>

            <div class="scatter-legend-overlay" id="scatterLegend">
                <span><span class="legend-dot small"></span>气泡大小=分均伤害</span><br>
                <span><span class="legend-dot" style="background:#e74c3c;"></span>低KDA → <span class="legend-dot" style="background:#ffd700;"></span>高KDA</span><br>
                <span><span class="legend-dot white"></span>当前选手</span>
                <span style="margin-left:10px;"><span class="legend-dot orange"></span>对比选手</span>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
//  位置动态指标配置表
// ============================================================
const positionConfigs = {
    'TOP': {
        keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'damage_taken_per_death'],
        labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '每死承伤'],
        avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold', 'avg_damage_taken_per_death'],
        ranks: ['rank_kda', 'rank_kills_assists', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_dmgtoGold', 'rank_damage_taken_per_death'],
        maxs: [10, 15, 2000, 15, 800, 40, 300, 12000]
    },
    'JUNGLE': {
        keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'participation', 'damage_taken_per_death'],
        labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '参团率', '每死承伤'],
        avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_participation', 'avg_damage_taken_per_death'],
        ranks: ['rank_kda', 'rank_kills_assists', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_participation', 'rank_damage_taken_per_death'],
        maxs: [10, 15, 2000, 15, 800, 40, 100, 12000]
    },
    'MIDDLE': {
        keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'survival'],
        labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '生存能力'],
        avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold', 'avg_survival'],
        ranks: ['rank_kda', 'rank_kills_assists', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_dmgtoGold', 'rank_survival'],
        maxs: [10, 15, 2000, 15, 800, 40, 300, 5]
    },
    'BOTTOM': {
        keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'survival'],
        labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '生存能力'],
        avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold', 'avg_survival'],
        ranks: ['rank_kda', 'rank_kills_assists', 'rank_dpm', 'rank_cspm', 'rank_goldpm', 'rank_dmgshare', 'rank_dmgtoGold', 'rank_survival'],
        maxs: [10, 15, 2000, 15, 800, 40, 300, 5]
    },
    'UTILITY': {
        keys: ['kda', 'kills_assists', 'goldpm', 'participation', 'dmgshare', 'damage_taken_share', 'vision_per_min', 'damage_taken_per_death'],
        labels: ['KDA', '击杀助攻', '分均经济', '参团率', '伤害占比', '承伤占比', '分均视野', '每死承伤'],
        avgs: ['avg_kda', 'avg_kills_assists', 'avg_goldpm', 'avg_participation', 'avg_dmgshare', 'avg_damage_taken_share', 'avg_vision_per_min', 'avg_damage_taken_per_death'],
        ranks: ['rank_kda', 'rank_kills_assists', 'rank_goldpm', 'rank_participation', 'rank_dmgshare', 'rank_damage_taken_share', 'rank_vision_per_min', 'rank_damage_taken_per_death'],
        maxs: [10, 15, 800, 100, 40, 40, 5, 12000]
    }
};

// ============================================================
//  状态
// ============================================================
let allPlayers = [];
let avgStats = {};
let currentPosition = 'MIDDLE';
let currentTeam = 'ALL';
let currentPlayerIndex = 0;
let myChart = null;
let scatterChartInstance = null;
let barChartInstance = null;
let heatmapChartInstance = null;
let isDataLoaded = false;
let currentFilteredPlayers = [];
let searchTerm = '';
let currentView = 'radar';
let comparePlayers = [];
let currentSortKey = 'kda';

const teamSelect = document.getElementById('teamSelect');
const sortSelect = document.getElementById('sortSelect');
const posBtns = document.querySelectorAll('.pos-btn');
const playerSelector = document.getElementById('playerSelector');
const loadingOverlay = document.getElementById('loadingOverlay');
const playerSearch = document.getElementById('playerSearch');
const viewBtns = document.querySelectorAll('.view-btn');
const scatterChartDiv = document.getElementById('scatterChart');
const exportBtn = document.getElementById('exportBtn');
const rightPanel = document.getElementById('rightPanel');
const scatterLegend = document.getElementById('scatterLegend');
const radarLegend = document.getElementById('radarLegend');
const mainArea = document.getElementById('mainArea');
const exportProgress = document.getElementById('exportProgress');
const exportProgressFill = document.getElementById('exportProgressFill');

// 工具函数
function safeVal(v, fallback = 0) { const n = parseFloat(v); return isNaN(n) ? fallback : n; }

function percentile(values, pct) {
    if (!values.length) return 0;
    const sorted = [...values].sort((a, b) => a - b);
    const idx = Math.min(sorted.length - 1, Math.floor(pct * sorted.length));
    return sorted[idx] || 0;
}

function proxyImageUrl(originalUrl) {
    return `https://images.weserv.nl/?url=${encodeURIComponent(originalUrl)}`;
}

function fmtVal(key, v) {
    const n = safeVal(v);
    if (key === 'kills_assists') return String(Math.round(n));
    if (Math.abs(n) >= 1000) return n.toFixed(0);
    return n.toFixed(2);
}

function getDimValue(player, key) {
    if (key === 'kills_assists') return safeVal(player.kills) + safeVal(player.assists);
    return safeVal(player[key]);
}

// ============================================================
//  加载数据
// ============================================================
async function loadData() {
    loadingOverlay.classList.add('show');
    loadingOverlay.querySelector('.loading-text').textContent = '数据加载中...';
    exportProgress.style.display = 'none';
    try {
        const res = await fetch('./data.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const avgObj = json.find(item => item.avg_kda !== undefined);
        if (avgObj) avgStats = avgObj;
        else { console.warn('未找到均值数据'); avgStats = {}; }
        allPlayers = json.filter(item => item.avg_kda === undefined);
        isDataLoaded = true;

        const teamSet = new Set(allPlayers.map(p => p.player.split(' ')[0]));
        let optionsHtml = `<option value="ALL">全部战队</option>`;
        teamSet.forEach(team => { optionsHtml += `<option value="${team}">${team}</option>`; });
        teamSelect.innerHTML = optionsHtml;

        teamSelect.addEventListener('change', () => {
            currentTeam = teamSelect.value;
            currentPlayerIndex = 0;
            comparePlayers = [];
            updateView();
        });
        sortSelect.addEventListener('change', () => {
            currentSortKey = sortSelect.value;
            currentPlayerIndex = 0;
            comparePlayers = [];
            updateView();
        });
        posBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                posBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentPosition = e.target.dataset.pos;
                currentPlayerIndex = 0;
                comparePlayers = [];
                updateView();
            });
        });
        playerSearch.addEventListener('input', (e) => {
            searchTerm = e.target.value.toLowerCase().trim();
            currentPlayerIndex = 0;
            comparePlayers = [];
            updateView();
        });
        viewBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                viewBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentView = e.target.dataset.view;
                updateViewVisibility();
            });
        });
        exportBtn.addEventListener('click', exportImage);

        // 键盘导航
        document.addEventListener('keydown', (e) => {
            const tag = (e.target.tagName || '').toLowerCase();
            if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
            if (!currentFilteredPlayers.length) return;
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                currentPlayerIndex = (currentPlayerIndex + 1) % currentFilteredPlayers.length;
                comparePlayers = comparePlayers.filter(i => i !== currentPlayerIndex);
                updateView();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                currentPlayerIndex = (currentPlayerIndex - 1 + currentFilteredPlayers.length) % currentFilteredPlayers.length;
                comparePlayers = comparePlayers.filter(i => i !== currentPlayerIndex);
                updateView();
            } else if (e.key === 'Escape' && comparePlayers.length) {
                comparePlayers = [];
                updateView();
            }
        });

        updateView();
    } catch (error) {
        console.error('加载数据失败:', error);
        document.getElementById('playerName').textContent = '⚠️ 数据加载失败';
        document.getElementById('statsWrapper').innerHTML =
            '<div style="color:#ff6b6b;text-align:center;padding:40px;font-size:14px;">数据加载失败</div>';
    } finally {
        loadingOverlay.classList.remove('show');
    }
}

function getFilteredPlayers() {
    let filtered = allPlayers.filter(p => p.position === currentPosition);
    if (currentTeam !== 'ALL') filtered = filtered.filter(p => p.player.startsWith(currentTeam));
    if (searchTerm) filtered = filtered.filter(p => p.player.toLowerCase().includes(searchTerm));
    filtered.sort((a, b) => getDimValue(b, currentSortKey) - getDimValue(a, currentSortKey));
    return filtered;
}

// ============================================================
//  选手选择器渲染（改造版）
// ============================================================
function renderPlayerChips(players) {
    const container = playerSelector;
    const isExpanded = container.classList.contains('expanded');
    const needExpand = players.length > 10;

    // 对比选手名称
    const compareNames = comparePlayers
        .map(i => players[i]?.player)
        .filter(Boolean);

    // 顶部信息条右侧内容
    let rightContent;
    if (compareNames.length) {
        rightContent = `<span class="compare-info">
            <span>对比</span>
            ${compareNames.map(n => `<span class="tag">${n}</span>`).join('<span class="vs">vs</span>')}
        </span>`;
    } else {
        rightContent = `<span class="hint">← → 切换选手 · Ctrl/⌘+点击对比</span>`;
    }

    let html = `
        <span class="label">
            <span class="label-title">👥 选手 <span class="count">${players.length}</span></span>
            ${rightContent}
            ${needExpand ? `<button class="expand-btn" id="expandPlayersBtn" type="button">${isExpanded ? '收起 ▲' : '展开全部 ▼'}</button>` : ''}
        </span>`;

    if (players.length === 0) {
        html += `<span style="color:#666;font-size:13px;padding:6px 0;">暂无选手</span>`;
        container.innerHTML = html;
        return;
    }

    players.forEach((p, idx) => {
        const active = idx === currentPlayerIndex ? 'active' : '';
        const compare = comparePlayers.includes(idx) ? 'compare' : '';
        const avatar = proxyImageUrl(`https://q.qlogo.cn/headimg_dl?dst_uin=${p.qq}&spec=640`);
        html += `
            <div class="player-chip ${active} ${compare}" data-index="${idx}"
                 title="${p.player} · ${p.kills}/${p.deaths}/${p.assists}">
                <img src="${avatar}" crossorigin="anonymous" onerror="this.src='https://via.placeholder.com/32'" loading="lazy" />
                <span class="chip-name">${p.player}</span>
                <span class="chip-kda"><span class="k">${p.kills}</span>/<span class="d">${p.deaths}</span>/<span class="a">${p.assists}</span></span>
            </div>`;
    });
    container.innerHTML = html;

    // chip 交互
    container.querySelectorAll('.player-chip').forEach(el => {
        el.addEventListener('click', (e) => {
            const idx = parseInt(el.dataset.index, 10);
            if (e.ctrlKey || e.metaKey) {
                if (comparePlayers.includes(idx)) {
                    comparePlayers = comparePlayers.filter(i => i !== idx);
                } else {
                    if (comparePlayers.length >= 2) comparePlayers.shift();
                    comparePlayers.push(idx);
                }
                updateView();
            } else {
                if (!isNaN(idx) && idx !== currentPlayerIndex) {
                    currentPlayerIndex = idx;
                    comparePlayers = [];
                    updateView();
                }
            }
        });
    });

    // 展开/收起按钮
    const expandBtn = document.getElementById('expandPlayersBtn');
    if (expandBtn) {
        expandBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            container.classList.toggle('expanded');
            expandBtn.textContent = container.classList.contains('expanded') ? '收起 ▲' : '展开全部 ▼';
        });
    }

    // 自动把当前选手滚动到可视区（键盘导航、切换排序后尤其有用）
    requestAnimationFrame(() => {
        const activeChip = container.querySelector('.player-chip.active');
        if (!activeChip) return;
        const cRect = container.getBoundingClientRect();
        const aRect = activeChip.getBoundingClientRect();
        // 顶部留出 34px 给粘性信息条
        const topEdge = cRect.top + 34;
        if (aRect.top < topEdge || aRect.bottom > cRect.bottom - 4) {
            const delta = aRect.top - topEdge;
            container.scrollTo({
                top: Math.max(0, container.scrollTop + delta - 6),
                behavior: 'smooth'
            });
        }
    });
}

// ============================================================
//  主视图更新
// ============================================================
function updateView() {
    if (!isDataLoaded) return;
    const players = getFilteredPlayers();
    currentFilteredPlayers = players;

    if (players.length === 0) {
        document.getElementById('playerName').textContent = '暂无选手';
        document.getElementById('totalKda').innerHTML =
            '<span class="k">0</span>/<span class="d">0</span>/<span class="a">0</span>';
        document.getElementById('playerAvatar').src = 'https://via.placeholder.com/160';
        document.getElementById('heroPool').innerHTML = '';
        document.getElementById('heroCount').textContent = '0';
        document.getElementById('statsWrapper').innerHTML = '';
        renderPlayerChips([]);
        if (myChart) myChart.clear();
        if (scatterChartInstance) scatterChartInstance.clear();
        if (barChartInstance) barChartInstance.clear();
        if (heatmapChartInstance) heatmapChartInstance.clear();
        updateViewVisibility();
        return;
    }

    if (currentPlayerIndex >= players.length) currentPlayerIndex = 0;
    comparePlayers = comparePlayers.filter(i => i < players.length && i !== currentPlayerIndex);

    const player = players[currentPlayerIndex];
    renderPlayerChips(players);

    const avatarUrl = proxyImageUrl(`https://q.qlogo.cn/headimg_dl?dst_uin=${player.qq}&spec=640`);
    const avatarImg = document.getElementById('playerAvatar');
    avatarImg.src = avatarUrl;
    avatarImg.crossOrigin = "anonymous";
    avatarImg.onerror = function () { this.onerror = null; this.src = 'https://via.placeholder.com/160'; };

    document.getElementById('playerName').textContent = player.player;
    document.getElementById('totalKda').innerHTML =
        `<span class="k">${player.kills}</span>/<span class="d">${player.deaths}</span>/<span class="a">${player.assists}</span>`;

    renderHeroPool(player);
    updateViewVisibility();

    if (currentView === 'radar') { renderStatsWrapper(player); renderRadar(player); }
    else if (currentView === 'scatter') renderScatterChart(players);
    else if (currentView === 'bar') renderBarChart(player);
    else if (currentView === 'heatmap') renderHeatmap(players);
}

function updateViewVisibility() {
    const radarChart = document.getElementById('radarChart');
    const statsWrapper = document.getElementById('statsWrapper');
    const avgNote = document.querySelector('.avg-note');

    radarChart.style.display = currentView === 'radar' ? 'block' : 'none';
    statsWrapper.style.display = currentView === 'radar' ? 'block' : 'none';
    avgNote.style.display = currentView === 'radar' ? 'block' : 'none';
    radarLegend.style.display = currentView === 'radar' ? 'flex' : 'none';
    rightPanel.classList.toggle('radar-glow', currentView === 'radar');

    document.getElementById('scatterChart').classList.toggle('active', currentView === 'scatter');
    document.getElementById('barChart').classList.toggle('active', currentView === 'bar');
    document.getElementById('heatmapChart').classList.toggle('active', currentView === 'heatmap');
    scatterLegend.classList.toggle('show', currentView === 'scatter');

    requestAnimationFrame(() => {
        if (currentView === 'radar' && myChart) myChart.resize();
        else if (currentView === 'scatter' && currentFilteredPlayers.length) renderScatterChart(currentFilteredPlayers);
        else if (currentView === 'bar' && currentFilteredPlayers.length) renderBarChart(currentFilteredPlayers[currentPlayerIndex]);
        else if (currentView === 'heatmap' && currentFilteredPlayers.length) renderHeatmap(currentFilteredPlayers);
    });
}

// 英雄池渲染
function renderHeroPool(player) {
    const poolEl = document.getElementById('heroPool');
    const heroes = player.heroes || [{ champion: player.champion || 'Unknown', games: 1, wins: 1 }];
    document.getElementById('heroCount').textContent = heroes.length;
    poolEl.innerHTML = heroes.map(h => {
        const winRate = Math.round((h.wins / h.games) * 100);
        const champName = h.champion || 'Unknown';
        const champIconUrl = proxyImageUrl(
            `https://ddragon.leagueoflegends.com/cdn/14.1.1/img/champion/${champName}.png`);
        const kdaLine = (h.kills !== undefined)
            ? `${h.kills}/${h.deaths}/${h.assists}`
            : `${h.games}局`;
        return `
            <div class="hero-item">
                <div class="hero-games">${h.games}</div>
                <img class="hero-icon" src="${champIconUrl}" crossorigin="anonymous"
                     onerror="this.style.background='#2a2f38';this.alt='${champName}'"
                     loading="lazy" alt="${champName}">
                <div class="hero-win">胜率 ${winRate}%</div>
                <div class="hero-kda">${kdaLine}</div>
            </div>`;
    }).join('');
}

// ============================================================
//  雷达图外部数据标签
// ============================================================
function renderStatsWrapper(player) {
    const config = positionConfigs[currentPosition];
    const wrapper = document.getElementById('statsWrapper');
    const positions = ['top', 'topright', 'right', 'bottomright', 'bottom', 'bottomleft', 'left', 'topleft'];

    wrapper.innerHTML = config.keys.map((key, index) => {
        const val = getDimValue(player, key);
        const avgVal = safeVal(avgStats[config.avgs[index]]);
        const rank = player[config.ranks[index]] !== undefined ? player[config.ranks[index]] : '-';
        const delta = val - avgVal;
        const cls = delta > 0.0001 ? 'above' : (delta < -0.0001 ? 'below' : 'same');
        const arrow = cls === 'above' ? '▲' : (cls === 'below' ? '▼' : '—');

        return `
            <div class="stat-item pos-${positions[index]} ${cls}" data-index="${index}" data-key="${key}"
                 title="${config.labels[index]}｜选手 ${fmtVal(key, val)} · 均值 ${fmtVal(key, avgVal)}">
                <div class="stat-rank">#${rank}</div>
                <div class="stat-main">
                    <span class="stat-val">${fmtVal(key, val)}</span>
                    <span class="stat-name">${config.labels[index]}</span>
                </div>
                <div class="stat-avg ${cls}">${fmtVal(key, avgVal)}<span class="arrow">${arrow}</span></div>
            </div>`;
    }).join('');
}

function buildRadarTooltip(player, config, isPlayerSeries) {
    let html = '';
    const playerName = player.player || '未知选手';
    if (isPlayerSeries) {
        html += `<div style="font-weight:700;font-size:14px;margin-bottom:6px;color:#00e5ff;">${playerName}</div>`;
        html += `<div style="font-size:11px;color:#888;margin-bottom:8px;">KDA: ${player.kills}/${player.deaths}/${player.assists}</div>`;
    } else {
        html += `<div style="font-weight:700;font-size:14px;margin-bottom:6px;color:#ff6b6b;">均值数据</div>`;
        html += `<div style="font-size:11px;color:#888;margin-bottom:8px;">全选手平均</div>`;
    }
    html += `<div style="display:grid;grid-template-columns:1fr auto auto;gap:4px 16px;font-size:12px;">`;
    config.keys.forEach((key, index) => {
        const val = isPlayerSeries ? getDimValue(player, key) : safeVal(avgStats[config.avgs[index]]);
        const displayVal = fmtVal(key, val);
        const rank = isPlayerSeries
            ? (player[config.ranks[index]] !== undefined ? player[config.ranks[index]] : '-')
            : '-';
        const colorClass = isPlayerSeries ? '#00e5ff' : '#ff6b6b';
        html += `
            <span style="color:#aaa;">${config.labels[index]}</span>
            <span style="color:${colorClass};font-weight:600;text-align:right;">${displayVal}</span>
            <span style="color:#fcd34d;font-size:11px;text-align:right;">${isPlayerSeries ? '#' + rank : '—'}</span>`;
    });
    html += `</div>`;
    return html;
}

// ============================================================
//  雷达图渲染（美化版）
// ============================================================
function renderRadar(player) {
    const chartDom = document.getElementById('radarChart');
    if (!myChart) {
        myChart = echarts.init(chartDom, 'dark');
        window.addEventListener('resize', () => { if (myChart) myChart.resize(); });
    }
    const config = positionConfigs[currentPosition];

    const dynamicMaxs = config.keys.map((key, index) => {
        const values = currentFilteredPlayers.map(p => getDimValue(p, key));
        const p95 = percentile(values, 0.95);
        const fallback = config.maxs[index] * 0.3;
        const baseMax = Math.max(p95, fallback);
        return Math.ceil(baseMax * 1.12);
    });

    const indicator = config.keys.map((key, index) => ({
        name: config.labels[index],
        max: dynamicMaxs[index]
    }));

    const playerValues = config.keys.map(key => getDimValue(player, key));

    const seriesData = [];
    const metaMap = [];

    // 当前选手主体
    seriesData.push({
        value: playerValues,
        name: player.player,
        itemStyle: {
            color: '#00e5ff',
            borderColor: '#ffffff',
            borderWidth: 1.6,
            shadowBlur: 16,
            shadowColor: 'rgba(0,229,255,0.95)'

        lineStyle: {

            width: 3,
            shadowBlur: 16,
            shadowColor: 'rgba(0,229,255,0.7)'

        areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [

        symbol: 'circle',

        z: 6,

    // 当前选手顶点光晕
    seriesData.push({

        lineStyle: { width: 0, opacity: 0 },
        areaStyle: { opacity: 0 },
        symbol: 'circle',
        symbolSize: 22,
        itemStyle: {
            color: 'rgba(0,229,255,0.16)',
            borderColor: 'rgba(0,229,255,0.45)',
            borderWidth: 1.2,
            shadowBlur: 28,
            shadowColor: 'rgba(0,229,255,1)'
        },
        z: 5
    });
    metaMap.push({ type: 'glow' });

    // 对比选手
    comparePlayers.forEach((idx, order) => {

        seriesData.push({

            name: compPlayer.player,
            itemStyle: {
                color,
                borderColor: '#fff',
                borderWidth: 1.2,
                shadowBlur: 12,
                shadowColor: color
            },
            lineStyle: {
                color,
                width: 2.4,
                shadowBlur: 10,
                shadowColor: color
            },
            areaStyle: {
                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                    { offset: 0, color: order === 0 ? 'rgba(255,152,0,0.22)' : 'rgba(192,132,252,0.22)' },
                    { offset: 1, color: 'rgba(0,0,0,0)' }
                ])
            },
            symbol: 'circle',
            symbolSize: 7,
            z: 4,
            emphasis: {
                lineStyle: { width: 3.5 },
                itemStyle: { borderColor: '#fff', borderWidth: 2.5 }
            }
        });
        metaMap.push({ type: 'compare', player: compPlayer });
    });

    // 均值
    const avgValues = config.avgs.map(key => safeVal(avgStats[key]));
    seriesData.push({
        value: avgValues,
        name: '均值',
        itemStyle: {
            color: '#ff6b6b',
            borderColor: 'rgba(255,107,107,0.6)',
            borderWidth: 1
        },
        lineStyle: { color: '#ff6b6b', width: 1.8, type: 'dashed', opacity: 0.95 },

    const option = {
        backgroundColor: 'transparent',
        animationDuration: 900,
        animationDurationUpdate: 700,
        animationEasing: 'cubicOut',
        animationEasingUpdate: 'cubicInOut',
        tooltip: {
            trigger: 'item',
            confine: true,
            backgroundColor: 'rgba(20,23,30,0.96)',
            borderColor: 'rgba(122,61,240,0.35)',
            borderWidth: 1,
            borderRadius: 14,
            padding: [14, 18],
            extraCssText: 'backdrop-filter: blur(20px); box-shadow: 0 8px 32px rgba(0,0,0,0.6); max-width: 340px;',
            textStyle: { color: '#eee', fontSize: 12 },
            formatter: function (params) {
                const meta = metaMap[params.dataIndex];
                if (!meta || meta.type === 'glow') return '';
                if (meta.type === 'average') return buildRadarTooltip(player, config, false);
                if (meta.type === 'current') return buildRadarTooltip(player, config, true);

                    color: [
                        'rgba(122,61,240,0.020)',
                        'rgba(122,61,240,0.055)',
                        'rgba(0,188,212,0.045)',
                        'rgba(122,61,240,0.055)',

                }

            axisLine: { lineStyle: { color: 'rgba(160,120,255,0.22)', width: 1.2 } },

            symbolSize: 8,

// ============================================================
//  气泡图 / 条形图 / 热力图
// ============================================================
function renderScatterChart(players) {
    if (!scatterChartInstance) {
        scatterChartInstance = echarts.init(scatterChartDiv, 'dark');
        window.addEventListener('resize', () => { if (scatterChartInstance) scatterChartInstance.resize(); });
        scatterChartInstance.on('click', function (params) {
            if (params.data && params.data.playerIndex !== undefined) {
                const idx = params.data.playerIndex;
                if (idx === currentPlayerIndex) return;
                currentPlayerIndex = idx;
                comparePlayers = [];
                updateView();
            }
        });
    }
    const xKey = 'goldpm', yKey = 'dmgshare', sizeKey = 'dpm';
    const xLabel = '分均经济', yLabel = '伤害占比 (%)';

    const allDpm = players.map(p => safeVal(p[sizeKey]));
    const minDpm = Math.min(...allDpm, 0), maxDpm = Math.max(...allDpm, 1);
    const allKda = players.map(p => safeVal(p.kda));
    const minKda = Math.min(...allKda, 0), maxKda = Math.max(...allKda, 1);
    const avgX = players.reduce((s, p) => s + safeVal(p[xKey]), 0) / players.length;
    const avgY = players.reduce((s, p) => s + safeVal(p[yKey]), 0) / players.length;
    const allX = players.map(p => safeVal(p[xKey])), allY = players.map(p => safeVal(p[yKey]));
    const xMin = Math.min(...allX), xMax = Math.max(...allX);
    const yMin = Math.min(...allY), yMax = Math.max(...allY);
    const xPad = (xMax - xMin) * 0.12 || 50, yPad = (yMax - yMin) * 0.15 || 5;

    const data = players.map((p, idx) => {
        const kda = safeVal(p.kda), dpm = safeVal(p[sizeKey]);
        const isCurrent = idx === currentPlayerIndex, isCompare = comparePlayers.includes(idx);
        const sizeRatio = maxDpm > minDpm ? (dpm - minDpm) / (maxDpm - minDpm) : 0.5;
        let symbolSize = 8 + sizeRatio * 20;
        if (isCurrent) symbolSize += 7;
        if (isCompare) symbolSize += 3;
        return {
            value: [safeVal(p[xKey]), safeVal(p[yKey]), kda, dpm],
            name: p.player,
            player: p,
            playerIndex: idx,
            symbolSize: symbolSize,
            itemStyle: {
                opacity: isCurrent ? 1 : (isCompare ? 0.9 : 0.72),
                borderColor: isCurrent ? '#ffffff' : (isCompare ? '#ff9800' : 'transparent'),
                borderWidth: isCurrent ? 3 : (isCompare ? 2.5 : 0),
                shadowBlur: isCurrent ? 30 : (isCompare ? 18 : 6),
                shadowColor: isCurrent ? 'rgba(255,255,255,0.7)' : (isCompare ? 'rgba(255,152,0,0.6)' : 'rgba(0,0,0,0.35)')
            },
            label: {
                show: isCurrent || isCompare,
                formatter: '{b}',
                position: 'top',
                distance: 6,
                color: isCurrent ? '#ffffff' : '#ff9800',
                fontSize: 12,
                fontWeight: 'bold',
                textShadowColor: 'rgba(0,0,0,0.85)',
                textShadowBlur: 5
            },
            emphasis: {
                label: { show: true, fontSize: 13 },
                itemStyle: {
                    shadowBlur: 35,
                    shadowColor: 'rgba(255,255,255,0.65)',
                    borderWidth: isCurrent ? 3 : 2,
                    borderColor: isCurrent ? '#fff' : '#ff9800',
                    opacity: 1
                }
            }
        };
    });

    const option = {
        backgroundColor: 'transparent',
        animation: true,
        animationDuration: 700,
        animationEasing: 'elasticOut',
        animationDelay: (idx) => Math.min(idx * 40, 600),
        tooltip: {
            trigger: 'item',
            confine: true,
            backgroundColor: 'rgba(18,20,26,0.95)',
            borderColor: 'rgba(0,188,212,0.35)',
            borderWidth: 1,
            borderRadius: 14,
            padding: [14, 18],
            extraCssText: 'backdrop-filter: blur(18px); box-shadow: 0 10px 40px rgba(0,0,0,0.65); max-width: 280px;',
            textStyle: { color: '#eee', fontSize: 12 },
            formatter: function (params) {
                if (!params || !params.data) return '';
                const p = params.data.player;
                const isCur = params.data.playerIndex === currentPlayerIndex;
                const isComp = comparePlayers.includes(params.data.playerIndex);
                const badge = isCur ? '⭐ 当前选手' : (isComp ? '🔶 对比选手' : '');
                return `
                    <div style="font-weight:700;font-size:14px;margin-bottom:4px;color:${isCur ? '#fff' : (isComp ? '#ff9800' : '#00d4e6')};">${p.player} ${badge ? '<span style="font-size:10px;color:#fcd34d;">' + badge + '</span>' : ''}</div>
                    <div style="font-size:11px;color:#888;margin-bottom:10px;">KDA: ${p.kills}/${p.deaths}/${p.assists}</div>
                    <div style="display:grid;grid-template-columns:1fr auto;gap:3px 18px;font-size:12px;">
                        <span style="color:#aaa;">分均经济</span><span style="color:#00d4e6;font-weight:600;">${safeVal(p[xKey]).toFixed(1)}</span>
                        <span style="color:#aaa;">伤害占比</span><span style="color:#00d4e6;font-weight:600;">${safeVal(p[yKey]).toFixed(1)}%</span>
                        <span style="color:#aaa;">分均伤害</span><span style="color:#00d4e6;font-weight:600;">${safeVal(p[sizeKey]).toFixed(0)}</span>
                        <span style="color:#aaa;">KDA值</span><span style="color:#fcd34d;font-weight:700;">${safeVal(p.kda).toFixed(2)}</span>
                    </div>
                    <div style="margin-top:8px;font-size:10px;color:#666;">💡 点击切换选手 | Ctrl+点击对比</div>`;
            }
        },
        visualMap: {
            dimension: 2,
            min: minKda, max: maxKda,
            calculable: false,
            orient: 'vertical',
            right: 4, top: 'center',
            itemWidth: 12, itemHeight: 80,
            text: ['高KDA', '低KDA'],
            textStyle: { color: '#888', fontSize: 10 },
            inRange: { color: ['#e74c3c', '#f39c12', '#3a9bd5', '#00bcd4', '#ffd700'] },
            show: players.length > 3
        },
        grid: { left: '8%', right: '16%', top: '12%', bottom: '15%', containLabel: true },
        xAxis: {
            name: xLabel,
            nameTextStyle: { color: '#999', fontSize: 12, fontWeight: 500 },
            nameLocation: 'middle', nameGap: 28,
            min: Math.max(0, xMin - xPad), max: xMax + xPad,
            axisLine: { lineStyle: { color: 'rgba(255,255,255,0.15)', width: 1 } },
            axisLabel: { color: '#888', fontSize: 10 },
            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.04)', type: 'dashed' } }
        },
        yAxis: {
            name: yLabel,
            nameTextStyle: { color: '#999', fontSize: 12, fontWeight: 500 },
            nameLocation: 'middle', nameGap: 40,
            min: Math.max(0, yMin - yPad), max: yMax + yPad,
            axisLine: { lineStyle: { color: 'rgba(255,255,255,0.15)', width: 1 } },
            axisLabel: { color: '#888', fontSize: 10 },
            splitLine: { lineStyle: { color: 'rgba(255,255,255,0.04)', type: 'dashed' } }
        },
        series: [{
            type: 'scatter',
            data: data,
            cursor: 'pointer',
            markLine: {
                silent: true,
                symbol: 'none',
                label: {
                    show: true,
                    formatter: (p) => p.data.xAxis !== undefined ? '均值X' : (p.data.yAxis !== undefined ? '均值Y' : ''),
                    color: '#888', fontSize: 9, position: 'insideEndTop'
                },
                lineStyle: { color: 'rgba(255,255,255,0.18)', type: 'dashed', width: 1 },
                data: [{ xAxis: avgX }, { yAxis: avgY }],
                animation: false
            }
        }]
    };
    scatterChartInstance.setOption(option, true);
    scatterChartInstance.resize();
}

function renderBarChart(player) {
    if (!barChartInstance) {
        barChartInstance = echarts.init(document.getElementById('barChart'), 'dark');
        window.addEventListener('resize', () => { if (barChartInstance) barChartInstance.resize(); });
    }
    const config = positionConfigs[currentPosition];
    const categories = config.labels;
    const playerValues = config.keys.map(key => getDimValue(player, key));
    const avgValues = config.avgs.map(key => safeVal(avgStats[key]));
    const series = [
        { name: player.player, type: 'bar', data: playerValues, itemStyle: { color: '#00d4e6', borderRadius: [4, 4, 0, 0] }, barGap: '10%', barCategoryGap: '30%' },
        { name: '均值', type: 'bar', data: avgValues, itemStyle: { color: '#ff6b6b', borderRadius: [4, 4, 0, 0] } }
    ];
    comparePlayers.forEach((idx, order) => {
        const compPlayer = currentFilteredPlayers[idx];
        if (compPlayer) {
            const compValues = config.keys.map(key => getDimValue(compPlayer, key));
            series.push({
                name: compPlayer.player,
                type: 'bar',
                data: compValues,
                itemStyle: { color: order === 0 ? '#ff9800' : '#c084fc', borderRadius: [4, 4, 0, 0] }
            });
        }
    });
    const option = {
        backgroundColor: 'transparent',
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        legend: { data: series.map(s => s.name), textStyle: { color: '#ccc' }, top: 0 },
        grid: { left: '10%', right: '5%', top: '15%', bottom: '10%', containLabel: true },
        xAxis: { type: 'value', axisLabel: { color: '#888' }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } } },
        yAxis: {
            type: 'category', data: categories,
            axisLabel: { color: '#ddd', fontSize: 11 },
            axisLine: { lineStyle: { color: '#666' } }
        },
        series: series
    };
    barChartInstance.setOption(option, true);
    barChartInstance.resize();
}

function renderHeatmap(players) {
    if (!heatmapChartInstance) {
        heatmapChartInstance = echarts.init(document.getElementById('heatmapChart'), 'dark');
        window.addEventListener('resize', () => { if (heatmapChartInstance) heatmapChartInstance.resize(); });
    }
    const config = positionConfigs[currentPosition];
    const topN = Math.min(players.length, 30);
    const selectedPlayers = players.slice(0, topN);
    const data = [];
    selectedPlayers.forEach((p, idx) => {
        config.keys.forEach((key, keyIdx) => {
            data.push([keyIdx, idx, getDimValue(p, key)]);
        });
    });
    const maxVals = {};
    config.keys.forEach((key, keyIdx) => {
        let maxVal = 0;
        selectedPlayers.forEach(p => {
            const val = getDimValue(p, key);
            if (val > maxVal) maxVal = val;
        });
        maxVals[keyIdx] = maxVal || 1;
    });
    const normalizedData = data.map(item => [item[0], item[1], item[2] / maxVals[item[0]]]);
    const option = {
        backgroundColor: 'transparent',
        tooltip: {
            position: 'top',
            formatter: function (params) {
                const xIdx = params.value[0], yIdx = params.value[1];
                const rawVal = data.find(d => d[0] === xIdx && d[1] === yIdx)[2];
                return `${selectedPlayers[yIdx].player}<br>${config.labels[xIdx]}: ${rawVal.toFixed(2)}`;
            }
        },
        grid: { left: '15%', right: '5%', top: '10%', bottom: '15%', containLabel: true },
        xAxis: {
            type: 'category', data: config.labels,
            splitArea: { show: true },
            axisLabel: { color: '#ddd', fontSize: 10, interval: 0, rotate: 30 }
        },
        yAxis: {
            type: 'category', data: selectedPlayers.map(p => p.player),
            splitArea: { show: true },
            axisLabel: { color: '#ddd', fontSize: 10, width: 100, overflow: 'truncate' }
        },
        visualMap: {
            min: 0, max: 1, calculable: true,
            orient: 'vertical', right: 0, top: 'center',
            itemWidth: 12, itemHeight: 100,
            text: ['高', '低'], textStyle: { color: '#888' },
            inRange: { color: ['#1a1d24', '#00bcd4'] }
        },
        series: [{
            type: 'heatmap', data: normalizedData,
            label: { show: false },
            emphasis: { itemStyle: { borderColor: '#fff', borderWidth: 1 } }
        }]
    };
    heatmapChartInstance.setOption(option, true);
    heatmapChartInstance.resize();
}

// ============================================================
//  保存图片
// ============================================================
function updateExportProgress(pct, text) {
    exportProgress.style.display = 'block';
    exportProgressFill.style.width = pct + '%';
    if (text) loadingOverlay.querySelector('.loading-text').textContent = text;
}

async function exportImage() {
    const overlay = loadingOverlay;
    const loadingText = overlay.querySelector('.loading-text');
    overlay.classList.add('show');
    exportProgress.style.display = 'block';
    exportProgressFill.style.width = '0%';
    loadingText.textContent = '准备导出...';

    try {
        updateExportProgress(10, '预加载图片资源...');
        const images = mainArea.querySelectorAll('img');
        const imagePromises = Array.from(images).map(img => {
            if (img.complete && img.naturalWidth > 0) return Promise.resolve();
            return new Promise(resolve => {
                const timeout = setTimeout(() => { resolve(); }, 5000);
                img.addEventListener('load', () => { clearTimeout(timeout); resolve(); }, { once: true });
                img.addEventListener('error', () => { clearTimeout(timeout); resolve(); }, { once: true });
                if (img.complete && img.naturalWidth === 0) {
                    const src = img.src;
                    img.src = '';
                    img.src = src;
                }
            });
        });
        await Promise.all(imagePromises);

        updateExportProgress(35, '等待图表渲染...');
        await new Promise(resolve => setTimeout(resolve, 500));
        if (myChart) myChart.resize();
        if (scatterChartInstance) scatterChartInstance.resize();
        if (barChartInstance) barChartInstance.resize();
        if (heatmapChartInstance) heatmapChartInstance.resize();
        await new Promise(resolve => setTimeout(resolve, 300));

        updateExportProgress(55, '生成高清图片...');
        const canvas = await html2canvas(mainArea, {
            backgroundColor: '#0b0d12',
            scale: 3,
            useCORS: true,
            allowTaint: false,
            logging: false,
            scrollX: 0,
            scrollY: -window.scrollY,
            windowWidth: document.documentElement.offsetWidth,
            windowHeight: document.documentElement.offsetHeight,
            onclone: function (clonedDoc) {
                const clonedImages = clonedDoc.querySelectorAll('img');
                clonedImages.forEach(img => {
                    if (img.complete && img.naturalWidth === 0) img.style.visibility = 'hidden';
                });
            }
        });

        updateExportProgress(85, '保存文件...');
        const playerName = currentFilteredPlayers.length > 0 && currentFilteredPlayers[currentPlayerIndex]
            ? currentFilteredPlayers[currentPlayerIndex].player.replace(/[^\w\u4e00-\u9fa5]/g, '_')
            : '未知选手';
        const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
        const filename = `H武道会_${currentPosition}_${playerName}_${timestamp}.png`;
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();

        updateExportProgress(100, '导出完成 ✓');
        await new Promise(resolve => setTimeout(resolve, 600));
    } catch (error) {
        console.error('导出失败:', error);
        loadingText.textContent = '导出失败，请重试';
        await new Promise(resolve => setTimeout(resolve, 1200));
    } finally {
        overlay.classList.remove('show');
        exportProgress.style.display = 'none';
        exportProgressFill.style.width = '0%';
        loadingText.textContent = '数据加载中...';
    }
}

// 启动
loadData();
</script>
