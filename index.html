<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>H·武道会 · 数据展示</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        /* ===== 全局重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #0b0d12; --panel-bg: rgba(21, 24, 30, 0.78);
            --accent-purple: #7a3df0; --accent-cyan: #00bcd4;
            --accent-amber: #fcd34d; --accent-red: #ff5252;
            --text-primary: #f0f0f0; --text-secondary: #999;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --radius-lg: 24px; --radius-md: 16px; --radius-pill: 40px;
            --shadow-glow-purple: 0 4px 24px rgba(122, 61, 240, 0.35);
            --transition-smooth: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        body {
            background: var(--bg-deep); color: var(--text-primary);
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 24px; position: relative; overflow-x: hidden;
        }
        body::before, body::after { content: ''; position: fixed; width: 80%; height: 80%; z-index: 0; pointer-events: none; }
        body::before { top: -30%; left: -20%; background: radial-gradient(circle at 30% 40%, rgba(122, 61, 240, 0.12) 0%, transparent 70%); animation: aurora 12s ease-in-out infinite alternate; }
        body::after { bottom: -30%; right: -20%; background: radial-gradient(circle at 70% 60%, rgba(0, 188, 212, 0.08) 0%, transparent 70%); animation: aurora2 15s ease-in-out infinite alternate; }
        @keyframes aurora { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(5%, 5%) scale(1.2); } }
        @keyframes aurora2 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5%, -5%) scale(1.3); } }

        .container {
            position: relative; z-index: 1; width: 100%; max-width: 1380px;
            background: var(--panel-bg); backdrop-filter: blur(24px) saturate(1.2);
            border-radius: var(--radius-lg); padding: 28px 32px 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(122, 61, 240, 0.08) inset;
        }

        .title {
            text-align: center; font-size: 32px; font-weight: 700; letter-spacing: 6px;
            padding: 8px 0 18px; color: var(--text-primary); border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .title::after { content: ''; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 100px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-purple), var(--accent-cyan), transparent); border-radius: 4px; }
        .title .sub { font-weight: 300; font-size: 14px; color: #888; letter-spacing: 2px; display: block; margin-top: 2px; }

        .control-bar { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
        .team-select, .pos-btn, .view-btn, .export-btn, .search-input { background: rgba(42, 47, 56, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); color: #ccc; padding: 9px 22px; border-radius: var(--radius-pill); font-size: 14px; font-weight: 500; cursor: pointer; outline: none; appearance: none; text-align: center; transition: var(--transition-smooth); letter-spacing: 0.5px; }
        .team-select:hover, .pos-btn:hover, .view-btn:hover, .export-btn:hover { background: rgba(60, 65, 80, 0.8); color: #fff; transform: translateY(-1px); }
        .pos-btn.active, .view-btn.active { background: linear-gradient(135deg, #7a3df0, #6a2fd0); color: #fff; border-color: #7a3df0; box-shadow: var(--shadow-glow-purple); }
        .team-select option { background: #1a1d24; color: #eee; }

        .search-bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .search-input { flex: 1 1 200px; background: rgba(42, 47, 56, 0.6); }
        .search-input:focus { border-color: rgba(122, 61, 240, 0.5); box-shadow: 0 0 20px rgba(122, 61, 240, 0.15); background: rgba(50, 55, 65, 0.8); }
        .view-switch { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
        .export-btn { background: linear-gradient(135deg, rgba(0, 188, 212, 0.15), rgba(122, 61, 240, 0.15)); border-color: rgba(0, 188, 212, 0.25); color: #ccc; }
        .export-btn:hover { background: linear-gradient(135deg, rgba(0, 188, 212, 0.3), rgba(122, 61, 240, 0.3)); border-color: rgba(0, 188, 212, 0.5); color: #fff; }

        .player-selector { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 16px; background: rgba(0, 0, 0, 0.25); border-radius: var(--radius-md); border: 1px solid rgba(255, 255, 255, 0.04); overflow-x: auto; flex-wrap: nowrap; min-height: 62px; transition: var(--transition-smooth); }
        .player-selector::-webkit-scrollbar { height: 4px; } .player-selector::-webkit-scrollbar-track { background: transparent; } .player-selector::-webkit-scrollbar-thumb { background: #7a3df0; border-radius: 8px; }
        .player-chip { display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 8px; border-radius: 30px; background: rgba(255, 255, 255, 0.04); border: 1px solid transparent; cursor: pointer; transition: var(--transition-smooth); flex-shrink: 0; white-space: nowrap; user-select: none; }
        .player-chip:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); }
        .player-chip.active { background: rgba(122, 61, 240, 0.25); border-color: rgba(122, 61, 240, 0.4); box-shadow: 0 0 20px rgba(122, 61, 240, 0.1); }
        .player-chip.compare { background: rgba(0, 188, 212, 0.2); border-color: rgba(0, 188, 212, 0.5); }
        .player-chip img { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.08); object-fit: cover; }

        /* ===== 核心区域布局 ===== */
        .main-area { display: flex; justify-content: space-between; gap: 24px; align-items: stretch; margin-top: 16px; }
        .left-panel { width: 26%; min-width: 210px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
        .hero-pool-title { background: linear-gradient(135deg, #7a3df0, #5a2db0); color: #fff; text-align: center; padding: 10px 0; border-radius: var(--radius-pill); font-weight: 600; font-size: 15px; flex-shrink: 0; }
        .hero-pool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; flex: 1 1 auto; align-content: start; max-height: 340px; overflow-y: auto; padding-right: 4px; }
        .hero-item { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; background: rgba(255, 255, 255, 0.03); border-radius: 12px; padding: 6px 4px 8px; transition: var(--transition-smooth); border: 1px solid transparent; }
        .hero-item:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(122, 61, 240, 0.2); transform: translateY(-3px) scale(1.02); }
        .hero-icon { width: 62px; height: 62px; border-radius: 12px; margin-bottom: 4px; background: #1e222a; border: 2px solid rgba(255, 255, 255, 0.06); object-fit: cover; }

        .left-bottom-stats { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; background: rgba(0, 0, 0, 0.15); border-radius: var(--radius-md); padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.04); }
        .mini-stat { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 6px 12px; position: relative; overflow: hidden; backdrop-filter: blur(4px); transition: var(--transition-smooth); }
        .mini-stat-val.blue { color: #00d4e6; } .mini-stat-val.red { color: #ff6b6b; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7a3df0, #00bcd4); transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1); border-radius: 0 0 10px 10px; } .bar-fill.red { background: linear-gradient(90deg, #ff5252, #ff6b6b); }

        .player-info { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 8px; min-width: 140px; }
        .player-avatar-wrap { position: relative; border-radius: 16px; padding: 4px; background: linear-gradient(135deg, #7a3df0, #00bcd4); box-shadow: 0 0 40px rgba(122, 61, 240, 0.15); }
        .player-avatar { width: 140px; height: 140px; object-fit: cover; border-radius: 13px; display: block; background: #1a1d24; }

        .right-panel { width: 55%; position: relative; height: 740px; display: flex; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.2); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.04); padding: 8px; overflow: hidden; }
        #radarChart { width: 520px; height: 520px; position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); transition: opacity 0.3s; }
        .stats-wrapper { width: 520px; height: 520px; position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; transition: opacity 0.3s; z-index: 5; }

        /* 优化：8个点位标签外扩，防止遮挡中心 */
        .stat-item {
            position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center;
            transform: translate(-50%, -50%); line-height: 1.4; min-width: 76px; padding: 6px 12px;
            border-radius: 10px; background: rgba(10, 12, 18, 0.95);
            backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); transition: all 0.3s ease; pointer-events: auto; cursor: pointer;
        }
        .stat-item:hover { background: rgba(20, 25, 35, 0.98); border-color: rgba(122, 61, 240, 0.4); transform: translate(-50%, -50%) scale(1.08); z-index: 10; }
        .stat-name { color: #ccc; font-weight: 600; font-size: 11px; opacity: 0.85; }
        .stat-rank { color: var(--accent-amber); font-size: 11px; font-weight: 700; }
        .stat-val-blue { color: #00d4e6; font-weight: 700; font-size: 15px; }
        .stat-val-red { color: #aaa; font-size: 10px; font-weight: 500; margin-top: 1px; }

        /* 精确位置：在原有基础上向外扩散 */
        .pos-top { top: 7%; left: 50%; }
        .pos-topright { top: 17%; left: 80%; }
        .pos-right { top: 48%; left: 90%; }
        .pos-bottomright { bottom: 20%; left: 80%; top: auto; }
        .pos-bottom { bottom: 9%; left: 50%; top: auto; }
        .pos-bottomleft { bottom: 20%; left: 20%; top: auto; }
        .pos-left { top: 48%; left: 10%; }
        .pos-topleft { top: 17%; left: 20%; }

        /* 新增图表及遮罩样式 */
        .loading-overlay { display: none; position: absolute; inset: 0; background: rgba(11, 13, 18, 0.7); backdrop-filter: blur(8px); border-radius: 20px; z-index: 30; justify-content: center; align-items: center; flex-direction: column; gap: 16px; }
        .loading-overlay.show { display: flex; }
        .loading-spinner { width: 48px; height: 48px; border: 4px solid rgba(122, 61, 240, 0.15); border-top-color: #7a3df0; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .export-progress { width: 200px; height: 4px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .export-progress .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7a3df0, #00bcd4); border-radius: 4px; transition: width 0.3s ease; }
        .radar-legend { position: absolute; left: 16px; bottom: 14px; z-index: 12; display: flex; flex-direction: column; gap: 4px; font-size: 10px; color: #aaa; pointer-events: none; background: rgba(0, 0, 0, 0.55); padding: 8px 14px; border-radius: 12px; }
        .scatter-legend-overlay { position: absolute; left: 14px; bottom: 12px; z-index: 15; display: none; font-size: 10px; color: #888; background: rgba(0, 0, 0, 0.55); padding: 6px 12px; border-radius: 16px; }
        .scatter-legend-overlay.show { display: block; }

        /* 其他视图自适应 */
        #scatterChart, #barChart, #heatmapChart, #parallelChart { position: absolute; inset: 0; display: none; width: 100%; height: 100%; cursor: pointer; }
        #scatterChart.active, #barChart.active, #heatmapChart.active, #parallelChart.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">H·武道会<span class="sub">SEASON DATA</span></div>
        <div class="control-bar">
            <select class="team-select" id="teamSelect"></select>
            <div class="position-selector" id="positionSelector">
                <button class="pos-btn" data-pos="TOP">上单</button>
                <button class="pos-btn" data-pos="JUNGLE">打野</button>
                <button class="pos-btn active" data-pos="MIDDLE">中单</button>
                <button class="pos-btn" data-pos="BOTTOM">下路</button>
                <button class="pos-btn" data-pos="UTILITY">辅助</button>
            </div>
        </div>
        <div class="search-bar">
            <input type="text" class="search-input" id="playerSearch" placeholder="🔍 搜索选手...">
            <div class="view-switch">
                <button class="view-btn active" data-view="radar">雷达图</button>
                <button class="view-btn" data-view="scatter">气泡图</button>
                <button class="view-btn" data-view="bar">条形图</button>
                <button class="view-btn" data-view="heatmap">热力图</button>
                <button class="view-btn" data-view="parallel">平行坐标</button>
                <button class="export-btn" id="exportBtn">📷 导出图片</button>
            </div>
        </div>
        <div class="player-selector" id="playerSelector"><span class="label">👥 选手</span></div>

        <div class="main-area" id="mainArea">
            <div class="left-panel">
                <div class="hero-pool-title">英雄池 (<span id="heroCount">0</span>)</div>
                <div class="hero-pool-grid" id="heroPool"></div>
                <div class="left-bottom-stats">
                    <div class="stat-row">
                        <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">对位等级差</span><span><span class="mini-stat-val blue" id="stat-lane">--</span><span class="mini-stat-rank" id="rank-lane">#-</span></span></div><div class="bar-bg"><div class="bar-fill" id="bar-lane"></div></div></div>
                        <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">对位经济差</span><span><span class="mini-stat-val blue" id="stat-gdiff">--</span><span class="mini-stat-rank" id="rank-gdiff">#-</span></span></div><div class="bar-bg"><div class="bar-fill" id="bar-gdiff"></div></div></div>
                    </div>
                    <div class="stat-row">
                        <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">参团率</span><span><span class="mini-stat-val blue" id="stat-partrate">--</span><span class="mini-stat-rank" id="rank-partrate">#-</span></span></div><div class="bar-bg"><div class="bar-fill" id="bar-partrate"></div></div></div>
                        <div class="mini-stat"><div class="mini-stat-top"><span class="mini-stat-name">承伤占比</span><span><span class="mini-stat-val blue" id="stat-taken">--</span><span class="mini-stat-rank" id="rank-taken">#-</span></span></div><div class="bar-bg"><div class="bar-fill red" id="bar-taken"></div></div></div>
                    </div>
                </div>
            </div>

            <div class="player-info">
                <div class="player-avatar-wrap"><img class="player-avatar" id="playerAvatar" src="" crossorigin="anonymous" /></div>
                <div class="player-meta"><div class="player-name" id="playerName">加载中...</div><div class="player-total-kda" id="totalKda"><span class="k">0</span>/<span class="d">0</span>/<span class="a">0</span></div></div>
            </div>

            <div class="right-panel" id="rightPanel">
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">数据加载中...</div>
                    <div class="export-progress" id="exportProgress" style="display:none;"><div class="progress-fill" id="exportProgressFill"></div></div>
                </div>
                <div id="radarChart"></div>
                <div class="stats-wrapper" id="statsWrapper"></div>
                <div class="radar-legend" id="radarLegend">
                    <div class="legend-row"><span class="legend-dot" style="background:#00d4e6;border-color:#00d4e6;"></span><span>当前选手</span></div>
                    <div class="legend-row"><span class="legend-dot" style="background:#ff9800;border-color:#ff9800;"></span><span>对比选手1</span></div>
                    <div class="legend-row"><span class="legend-dot" style="background:#c084fc;border-color:#c084fc;"></span><span>对比选手2</span></div>
                    <div class="legend-row"><span class="legend-line" style="background:#ff6b6b;border-top:1.5px dashed #ff6b6b;"></span><span>全选手均值</span></div>
                </div>
                <div id="scatterChart"></div>
                <div id="barChart"></div>
                <div id="heatmapChart"></div>
                <div id="parallelChart"></div>
                <div class="scatter-legend-overlay" id="scatterLegend"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  位置动态指标配置表
        // ============================================================
        const positionConfigs = {
            'TOP': { keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'damage_taken_per_death'], labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '每死承伤'], avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold', 'avg_damage_taken_per_death'], maxs: [10, 15, 2000, 15, 800, 40, 300, 12000] },
            'JUNGLE': { keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'participation', 'damage_taken_per_death'], labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '参团率', '每死承伤'], avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_participation', 'avg_damage_taken_per_death'], maxs: [10, 15, 2000, 15, 800, 40, 100, 12000] },
            'MIDDLE': { keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'survival'], labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '生存能力'], avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold', 'avg_survival'], maxs: [10, 15, 2000, 15, 800, 40, 300, 5] },
            'BOTTOM': { keys: ['kda', 'kills_assists', 'dpm', 'cspm', 'goldpm', 'dmgshare', 'dmgtoGold', 'survival'], labels: ['KDA', '击杀助攻', '分均伤害', '分均补刀', '分均经济', '伤害占比', '伤转', '生存能力'], avgs: ['avg_kda', 'avg_kills_assists', 'avg_dpm', 'avg_cspm', 'avg_goldpm', 'avg_dmgshare', 'avg_dmgtoGold', 'avg_survival'], maxs: [10, 15, 2000, 15, 800, 40, 300, 5] },
            'UTILITY': { keys: ['kda', 'kills_assists', 'goldpm', 'participation', 'dmgshare', 'damage_taken_share', 'vision_per_min', 'damage_taken_per_death'], labels: ['KDA', '击杀助攻', '分均经济', '参团率', '伤害占比', '承伤占比', '分均视野', '每死承伤'], avgs: ['avg_kda', 'avg_kills_assists', 'avg_goldpm', 'avg_participation', 'avg_dmgshare', 'avg_damage_taken_share', 'avg_vision_per_min', 'avg_damage_taken_per_death'], maxs: [10, 15, 800, 100, 40, 40, 5, 12000] }
        };

        let allPlayers = [], avgStats = {}, currentPosition = 'MIDDLE', currentTeam = 'ALL', currentPlayerIndex = 0;
        let myChart = null, scatterChartInstance = null, barChartInstance = null, heatmapChartInstance = null, parallelChartInstance = null;
        let isDataLoaded = false, currentFilteredPlayers = [], searchTerm = '', currentView = 'radar', comparePlayers = [];

        // DOM 引用
        const teamSelect = document.getElementById('teamSelect');
        const posBtns = document.querySelectorAll('.pos-btn');
        const playerSelector = document.getElementById('playerSelector');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const playerSearch = document.getElementById('playerSearch');
        const viewBtns = document.querySelectorAll('.view-btn');
        const exportBtn = document.getElementById('exportBtn');
        const mainArea = document.getElementById('mainArea');
        const exportProgress = document.getElementById('exportProgress');
        const exportProgressFill = document.getElementById('exportProgressFill');

        function safeVal(v, fallback = 0) { const n = parseFloat(v); return isNaN(n) ? fallback : n; }
        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
        function percentile(values, pct) { if (!values.length) return 0; const sorted = [...values].sort((a, b) => a - b); const idx = Math.min(sorted.length - 1, Math.floor(pct * sorted.length)); return sorted[idx] || 0; }
        function proxyImageUrl(originalUrl) { return `https://images.weserv.nl/?url=${encodeURIComponent(originalUrl)}`; }

        async function loadData() {
            loadingOverlay.classList.add('show');
            try {
                const res = await fetch('./data.json');
                const json = await res.json();
                const avgObj = json.find(item => item.avg_kda !== undefined);
                avgStats = avgObj || {};
                allPlayers = json.filter(item => item.avg_kda === undefined);
                isDataLoaded = true;

                const teamSet = new Set(allPlayers.map(p => p.player.split(' ')[0]));
                let optionsHtml = `<option value="ALL">全部战队</option>`;
                teamSet.forEach(team => { optionsHtml += `<option value="${team}">${team}</option>`; });
                teamSelect.innerHTML = optionsHtml;

                teamSelect.addEventListener('change', () => { currentTeam = teamSelect.value; currentPlayerIndex = 0; comparePlayers = []; updateView(); });
                posBtns.forEach(btn => { btn.addEventListener('click', (e) => { posBtns.forEach(b => b.classList.remove('active')); e.target.classList.add('active'); currentPosition = e.target.dataset.pos; currentPlayerIndex = 0; comparePlayers = []; updateView(); }); });
                playerSearch.addEventListener('input', (e) => { searchTerm = e.target.value.toLowerCase().trim(); currentPlayerIndex = 0; comparePlayers = []; updateView(); });
                viewBtns.forEach(btn => { btn.addEventListener('click', (e) => { viewBtns.forEach(b => b.classList.remove('active')); e.target.classList.add('active'); currentView = e.target.dataset.view; updateViewVisibility(); }); });
                exportBtn.addEventListener('click', exportImage);

                updateView();
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('playerName').textContent = '⚠️ 数据加载失败';
            } finally {
                loadingOverlay.classList.remove('show');
            }
        }

        function getFilteredPlayers() {
            let filtered = allPlayers.filter(p => p.position === currentPosition);
            if (currentTeam !== 'ALL') filtered = filtered.filter(p => p.player.startsWith(currentTeam));
            if (searchTerm) filtered = filtered.filter(p => p.player.toLowerCase().includes(searchTerm));
            filtered.sort((a, b) => (b.kda || 0) - (a.kda || 0));
            return filtered;
        }

        function renderPlayerChips(players) {
            const container = playerSelector;
            let html = `<span class="label">👥 选手</span>`;
            if (players.length === 0) {
                html += `<span style="color:#666;font-size:13px;padding:6px 0;">暂无选手</span>`;
                container.innerHTML = html;
                return;
            }
            players.forEach((p, idx) => {
                const active = idx === currentPlayerIndex ? 'active' : '';
                const compare = comparePlayers.includes(idx) ? 'compare' : '';
                const avatar = proxyImageUrl(`https://q.qlogo.cn/headimg_dl?dst_uin=${p.qq}&spec=640`);
                html += `<div class="player-chip ${active} ${compare}" data-index="${idx}" title="点击选择，Ctrl+点击加入对比">
                        <img src="${avatar}" crossorigin="anonymous" onerror="this.src='https://via.placeholder.com/32'" loading="lazy" />
                        <span class="chip-name">${p.player}</span>
                        <span class="chip-kda"><span class="k">${p.kills}</span>/<span class="d">${p.deaths}</span>/<span class="a">${p.assists}</span></span>
                    </div>`;
            });
            container.innerHTML = html;
            container.querySelectorAll('.player-chip').forEach(el => {
                el.addEventListener('click', (e) => {
                    const idx = parseInt(el.dataset.index, 10);
                    if (e.ctrlKey || e.metaKey) {
                        if (comparePlayers.includes(idx)) { comparePlayers = comparePlayers.filter(i => i !== idx); }
                        else { if (comparePlayers.length >= 2) comparePlayers.shift(); comparePlayers.push(idx); }
                        updateView();
                    } else {
                        if (!isNaN(idx) && idx !== currentPlayerIndex) { currentPlayerIndex = idx; comparePlayers = []; updateView(); }
                    }
                });
            });
        }

        function updateLeftStats(player) {
            const mappings = [
                { stat: 'lane', rank: 'rank-lane', bar: 'bar-lane', key: 'lane_diff', rankKey: 'rank_lane_diff', max: 3, isRed: false },
                { stat: 'gdiff', rank: 'rank-gdiff', bar: 'bar-gdiff', key: 'gold_diff', rankKey: 'rank_gold_diff', max: 3000, isRed: false },
                { stat: 'partrate', rank: 'rank-partrate', bar: 'bar-partrate', key: 'participation', rankKey: 'rank_participation', max: 100, isRed: false },
                { stat: 'taken', rank: 'rank-taken', bar: 'bar-taken', key: 'damage_taken_share', rankKey: 'rank_damage_taken', max: 40, isRed: true },
                { stat: 'vision', rank: 'rank-vision', bar: 'bar-vision', key: 'vision_per_min', rankKey: 'rank_vision', max: 3, isRed: false },
            ];
            mappings.forEach(({ stat, rank, bar, key, rankKey, max, isRed }) => {
                const val = safeVal(player[key]);
                const r = player[rankKey] || '-';
                document.getElementById(`stat-${stat}`).textContent = key === 'gold_diff' ? (val >= 0 ? '+' : '') + val.toFixed(0) : val.toFixed(1);
                document.getElementById(`rank-${stat}`).textContent = `#${r}`;
                const pct = clamp((val / max) * 100, 0, 100);
                const barEl = document.getElementById(bar);
                barEl.style.width = pct + '%';
                barEl.className = isRed ? 'bar-fill red' : 'bar-fill';
            });
        }

        function updateView() {
            if (!isDataLoaded) return;
            const players = getFilteredPlayers();
            currentFilteredPlayers = players;
            if (players.length === 0) {
                document.getElementById('playerName').textContent = '暂无选手';
                document.getElementById('totalKda').innerHTML = '<span class="k">0</span>/<span class="d">0</span>/<span class="a">0</span>';
                document.getElementById('playerAvatar').src = 'https://via.placeholder.com/160';
                document.getElementById('heroPool').innerHTML = '';
                document.getElementById('heroCount').textContent = '0';
                ['lane', 'gdiff', 'partrate', 'taken', 'vision'].forEach(key => {
                    document.getElementById(`stat-${key}`).textContent = '--';
                    document.getElementById(`rank-${key}`).textContent = '#-';
                    document.getElementById(`bar-${key}`).style.width = '0%';
                });
                document.getElementById('statsWrapper').innerHTML = '';
                renderPlayerChips([]);
                if (myChart) myChart.clear();
                if (scatterChartInstance) scatterChartInstance.clear();
                if (barChartInstance) barChartInstance.clear();
                if (heatmapChartInstance) heatmapChartInstance.clear();
                if (parallelChartInstance) parallelChartInstance.clear();
                updateViewVisibility();
                return;
            }
            if (currentPlayerIndex >= players.length) currentPlayerIndex = 0;
            const player = players[currentPlayerIndex];
            renderPlayerChips(players);

            const avatarUrl = proxyImageUrl(`https://q.qlogo.cn/headimg_dl?dst_uin=${player.qq}&spec=640`);
            const avatarImg = document.getElementById('playerAvatar');
            avatarImg.src = avatarUrl;
            avatarImg.crossOrigin = "anonymous";
            avatarImg.onerror = function() { this.onerror = null; this.src = 'https://via.placeholder.com/160'; };

            document.getElementById('playerName').textContent = player.player;
            document.getElementById('totalKda').innerHTML = `<span class="k">${player.kills}</span>/<span class="d">${player.deaths}</span>/<span class="a">${player.assists}</span>`;

            renderHeroPool(player);
            updateLeftStats(player);

            updateViewVisibility();
            if (currentView === 'radar') { renderStatsWrapper(player); renderRadar(player); }
            else if (currentView === 'scatter') renderScatterChart(players);
            else if (currentView === 'bar') renderBarChart(player);
            else if (currentView === 'heatmap') renderHeatmap(players);
            else if (currentView === 'parallel') renderParallel(player);
        }

        function updateViewVisibility() {
            const radarChart = document.getElementById('radarChart');
            const statsWrapper = document.getElementById('statsWrapper');
            const avgNote = document.querySelector('.avg-note');
            radarChart.style.display = currentView === 'radar' ? 'block' : 'none';
            statsWrapper.style.display = currentView === 'radar' ? 'block' : 'none';
            avgNote.style.display = currentView === 'radar' ? 'block' : 'none';
            radarLegend.style.display = currentView === 'radar' ? 'flex' : 'none';
            document.getElementById('scatterChart').classList.toggle('active', currentView === 'scatter');
            document.getElementById('barChart').classList.toggle('active', currentView === 'bar');
            document.getElementById('heatmapChart').classList.toggle('active', currentView === 'heatmap');
            document.getElementById('parallelChart').classList.toggle('active', currentView === 'parallel');
            scatterLegend.classList.toggle('show', currentView === 'scatter');

            if (currentView === 'radar' && myChart) myChart.resize();
            else if (currentView === 'scatter' && currentFilteredPlayers.length) renderScatterChart(currentFilteredPlayers);
            else if (currentView === 'bar' && currentFilteredPlayers.length) renderBarChart(currentFilteredPlayers[currentPlayerIndex]);
            else if (currentView === 'heatmap' && currentFilteredPlayers.length) renderHeatmap(currentFilteredPlayers);
            else if (currentView === 'parallel' && currentFilteredPlayers.length) renderParallel(currentFilteredPlayers[currentPlayerIndex]);
        }

        function renderHeroPool(player) {
            const poolEl = document.getElementById('heroPool');
            const heroes = player.heroes || [{ champion: player.champion || 'Unknown', games: 1, wins: 1 }];
            document.getElementById('heroCount').textContent = heroes.length;
            poolEl.innerHTML = heroes.map(h => {
                const winRate = Math.round((h.wins / h.games) * 100);
                const champName = h.champion || 'Unknown';
                const champIconUrl = proxyImageUrl(`https://ddragon.leagueoflegends.com/cdn/14.1.1/img/champion/${champName}.png`);
                return `<div class="hero-item">
                        <div class="hero-games">${h.games}</div>
                        <img class="hero-icon" src="${champIconUrl}" crossorigin="anonymous" onerror="this.style.background='#2a2f38';this.alt='${champName}'" loading="lazy" alt="${champName}">
                        <div class="hero-win">${winRate}%</div>
                        <div class="hero-kda">${h.games}局</div>
                    </div>`;
            }).join('');
        }

        // 雷达图外部标签渲染
        function renderStatsWrapper(player) {
            const config = positionConfigs[currentPosition];
            const wrapper = document.getElementById('statsWrapper');
            const positions = ['top', 'topright', 'right', 'bottomright', 'bottom', 'bottomleft', 'left', 'topleft'];
            wrapper.innerHTML = config.keys.map((key, index) => {
                let val = player[key];
                if (key === 'kills_assists') val = (player.kills + player.assists);
                val = safeVal(val);
                let avgVal = safeVal(avgStats[config.avgs[index]]);
                let rank = player[config.ranks[index]] !== undefined ? player[config.ranks[index]] : '-';
                const displayVal = typeof val === 'number' ? val.toFixed(1) : val;
                const displayAvg = typeof avgVal === 'number' ? avgVal.toFixed(1) : avgVal;
                return `<div class="stat-item pos-${positions[index]}" data-index="${index}" data-key="${key}" title="${config.labels[index]}">
                        <div class="stat-name">${config.labels[index]}</div>
                        <div><span class="stat-rank">#${rank}</span> <span class="stat-val-blue">${displayVal}</span></div>
                        <div class="stat-val-red">均 ${displayAvg}</div>
                    </div>`;
            }).join('');
        }

        function buildRadarTooltip(player, config, isPlayerSeries, seriesName) {
            let html = '';
            const playerName = player.player || seriesName || '未知选手';
            if (isPlayerSeries) {
                html += `<div style="font-weight:700;font-size:14px;margin-bottom:6px;color:#00d4e6;">${playerName}</div>`;
                html += `<div style="font-size:11px;color:#888;margin-bottom:8px;">KDA: ${player.kills}/${player.deaths}/${player.assists}</div>`;
            } else {
                html += `<div style="font-weight:700;font-size:14px;margin-bottom:6px;color:#ff6b6b;">均值数据</div>`;
                html += `<div style="font-size:11px;color:#888;margin-bottom:8px;">全选手平均</div>`;
            }
            html += `<div style="display:grid;grid-template-columns:1fr auto auto;gap:4px 16px;font-size:12px;">`;
            config.keys.forEach((key, index) => {
                let val = isPlayerSeries ? player[key] : avgStats[config.avgs[index]];
                if (key === 'kills_assists') val = isPlayerSeries ? (player.kills + player.assists) : avgStats[config.avgs[index]];
                val = safeVal(val);
                const displayVal = typeof val === 'number' ? val.toFixed(2) : val;
                const rank = isPlayerSeries ? (player[config.ranks[index]] !== undefined ? player[config.ranks[index]] : '-') : '-';
                const colorClass = isPlayerSeries ? '#00d4e6' : '#ff6b6b';
                html += `<span style="color:#aaa;">${config.labels[index]}</span>
                    <span style="color:${colorClass};font-weight:600;text-align:right;">${displayVal}</span>
                    <span style="color:#fcd34d;font-size:11px;text-align:right;">${isPlayerSeries ? '#'+rank : '—'}</span>`;
            });
            html += `</div>`;
            return html;
        }

        // 雷达图渲染（优化版：居中、动态最大值、关闭自带标签）
        function renderRadar(player) {
            const chartDom = document.getElementById('radarChart');
            if (!myChart) {
                myChart = echarts.init(chartDom, 'dark');
                window.addEventListener('resize', () => { if (myChart) myChart.resize(); });
            }
            const config = positionConfigs[currentPosition];
            const dynamicMaxs = config.keys.map((key, index) => {
                const values = currentFilteredPlayers.map(p => { let v = p[key]; if (key === 'kills_assists') v = (p.kills + p.assists); return safeVal(v); });
                const p95 = percentile(values, 0.95);
                const fallback = config.maxs[index] * 0.3;
                return Math.ceil(Math.max(p95, fallback) * 1.12);
            });
            const indicator = config.keys.map((key, index) => ({ name: config.labels[index], max: dynamicMaxs[index] }));

            const seriesData = [];
            let playerValues = config.keys.map(key => { let val = player[key]; if (key === 'kills_assists') val = (player.kills + player.assists); return safeVal(val); });
            seriesData.push({ value: playerValues, name: player.player, _seriesType: 'current', itemStyle: { color: '#00d4e6', shadowBlur: 25, shadowColor: 'rgba(0,212,230,0.55)' }, lineStyle: { color: '#00d4e6', width: 3, shadowBlur: 18, shadowColor: 'rgba(0,212,230,0.45)' }, areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(0,212,230,0.38)' }, { offset: 0.6, color: 'rgba(0,212,230,0.12)' }, { offset: 1, color: 'rgba(0,212,230,0.03)' }]) }, symbol: 'circle', symbolSize: 8, emphasis: { lineStyle: { width: 4, color: '#00d4e6' }, itemStyle: { color: '#00d4e6', borderColor: '#fff', borderWidth: 3, shadowBlur: 30, shadowColor: 'rgba(0,212,230,0.85)' } } });

            comparePlayers.forEach((idx, order) => {
                const compPlayer = currentFilteredPlayers[idx];
                if (compPlayer) {
                    let compValues = config.keys.map(key => { let val = compPlayer[key]; if (key === 'kills_assists') val = (compPlayer.kills + compPlayer.assists); return safeVal(val); });
                    const color = order === 0 ? '#ff9800' : '#c084fc';
                    seriesData.push({ value: compValues, name: compPlayer.player, _seriesType: 'compare', _playerIndex: idx, itemStyle: { color, shadowBlur: 18 }, lineStyle: { color, width: 2.5, shadowBlur: 12 }, areaStyle: { color: color === '#ff9800' ? 'rgba(255,152,0,0.12)' : 'rgba(192,132,252,0.12)' }, symbol: 'circle', symbolSize: 6 });
                }
            });

            let avgValues = config.avgs.map(key => safeVal(avgStats[key]));
            seriesData.push({ value: avgValues, name: '均值', _seriesType: 'average', itemStyle: { color: '#ff6b6b', shadowBlur: 10 }, lineStyle: { color: '#ff6b6b', width: 1.8, type: 'dashed', shadowBlur: 6 }, areaStyle: { color: 'transparent' }, symbol: 'diamond', symbolSize: 6 });

            const option = {
                backgroundColor: 'transparent',
                animationDuration: 900,
                tooltip: { trigger: 'item', confine: true, backgroundColor: 'rgba(20,23,30,0.96)', borderColor: 'rgba(122,61,240,0.35)', borderWidth: 1, borderRadius: 14,
                    formatter: function(params) {
                        if (!params || params.seriesIndex === undefined) return '';
                        const sIdx = params.seriesIndex;
                        const sData = seriesData[sIdx];
                        if (!sData) return '';
                        if (sData._seriesType === 'average') { return buildRadarTooltip(player, config, false, '均值'); }
                        else if (sData._seriesType === 'current') { return buildRadarTooltip(player, config, true, player.player); }
                        else if (sData._seriesType === 'compare') { const compP = currentFilteredPlayers[sData._playerIndex]; return compP ? buildRadarTooltip(compP, config, true, compP.player) : ''; }
                        return '';
                    }
                },
                radar: {
                    indicator: indicator,
                    center: ['50%', '50%'], // 优化：完全居中
                    radius: '72%',          // 优化：缩小半径，防止标签重叠
                    splitNumber: 4,
                    shape: 'polygon',
                    splitArea: { areaStyle: { color: ['rgba(122,61,240,0.02)', 'rgba(0,188,212,0.05)', 'rgba(122,61,240,0.06)'] } },
                    axisLine: { show: true, lineStyle: { color: 'rgba(255,255,255,0.2)', width: 1.2 } },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.1)', width: 1 } },
                    axisName: { show: false } // 优化：关闭自带文字，防止与外部标签重叠
                },
                series: [{ type: 'radar', data: seriesData, symbolSize: 8 }]
            };
            myChart.setOption(option, true);
            myChart.resize();
        }

        // ============================================================
        //  气泡图 / 条形图 / 热力图 / 平行坐标 (完整版)
        // ============================================================
        function renderScatterChart(players) {
            if (!scatterChartInstance) {
                scatterChartInstance = echarts.init(scatterChartDiv, 'dark');
                window.addEventListener('resize', () => { if (scatterChartInstance) scatterChartInstance.resize(); });
                scatterChartInstance.on('click', function(params) {
                    if (params.data && params.data.playerIndex !== undefined) {
                        const idx = params.data.playerIndex;
                        if (idx === currentPlayerIndex) return;
                        currentPlayerIndex = idx;
                        comparePlayers = [];
                        updateView();
                    }
                });
            }
            const config = positionConfigs[currentPosition];
            const xKey = 'goldpm', yKey = 'dmgshare', sizeKey = 'dpm';
            const xLabel = '分均经济', yLabel = '伤害占比 (%)';

            const allDpm = players.map(p => safeVal(p[sizeKey]));
            const minDpm = Math.min(...allDpm, 0), maxDpm = Math.max(...allDpm, 1);
            const allKda = players.map(p => safeVal(p.kda));
            const minKda = Math.min(...allKda, 0), maxKda = Math.max(...allKda, 1);
            const avgX = players.reduce((s, p) => s + safeVal(p[xKey]), 0) / players.length;
            const avgY = players.reduce((s, p) => s + safeVal(p[yKey]), 0) / players.length;
            const allX = players.map(p => safeVal(p[xKey])), allY = players.map(p => safeVal(p[yKey]));
            const xMin = Math.min(...allX), xMax = Math.max(...allX);
            const yMin = Math.min(...allY), yMax = Math.max(...allY);
            const xPad = (xMax - xMin) * 0.12 || 50, yPad = (yMax - yMin) * 0.15 || 5;

            const data = players.map((p, idx) => {
                const kda = safeVal(p.kda), dpm = safeVal(p[sizeKey]);
                const isCurrent = idx === currentPlayerIndex, isCompare = comparePlayers.includes(idx);
                const sizeRatio = maxDpm > minDpm ? (dpm - minDpm) / (maxDpm - minDpm) : 0.5;
                let symbolSize = 8 + sizeRatio * 20;
                if (isCurrent) symbolSize += 7;
                if (isCompare) symbolSize += 3;
                return {
                    value: [safeVal(p[xKey]), safeVal(p[yKey]), kda, dpm],
                    name: p.player, player: p, playerIndex: idx, symbolSize: symbolSize,
                    itemStyle: {
                        opacity: isCurrent ? 1 : (isCompare ? 0.9 : 0.72),
                        borderColor: isCurrent ? '#ffffff' : (isCompare ? '#ff9800' : 'transparent'),
                        borderWidth: isCurrent ? 3 : (isCompare ? 2.5 : 0),
                        shadowBlur: isCurrent ? 30 : (isCompare ? 18 : 6),
                        shadowColor: isCurrent ? 'rgba(255,255,255,0.7)' : (isCompare ? 'rgba(255,152,0,0.6)' : 'rgba(0,0,0,0.35)')
                    },
                    label: { show: isCurrent || isCompare, formatter: '{b}', position: 'top', distance: 6, color: isCurrent ? '#ffffff' : '#ff9800', fontSize: 12, fontWeight: 'bold', textShadowColor: 'rgba(0,0,0,0.85)', textShadowBlur: 5 },
                    emphasis: { label: { show: true, fontSize: 13 }, itemStyle: { shadowBlur: 35, shadowColor: 'rgba(255,255,255,0.65)', borderWidth: isCurrent ? 3 : 2, borderColor: isCurrent ? '#fff' : '#ff9800', opacity: 1 } }
                };
            });

            const option = {
                backgroundColor: 'transparent',
                animation: true, animationDuration: 700, animationEasing: 'elasticOut', animationDelay: (idx) => Math.min(idx * 40, 600),
                tooltip: {
                    trigger: 'item', confine: true, backgroundColor: 'rgba(18,20,26,0.95)', borderColor: 'rgba(0,188,212,0.35)', borderWidth: 1, borderRadius: 14,
                    textStyle: { color: '#eee', fontSize: 12 },
                    formatter: function(params) {
                        if (!params || !params.data) return '';
                        const p = params.data.player;
                        const isCur = params.data.playerIndex === currentPlayerIndex;
                        const isComp = comparePlayers.includes(params.data.playerIndex);
                        const badge = isCur ? '⭐ 当前选手' : (isComp ? '🔶 对比选手' : '');
                        return `<div style="font-weight:700;font-size:14px;margin-bottom:4px;color:${isCur?'#fff':(isComp?'#ff9800':'#00d4e6')};">${p.player} ${badge?'<span style="font-size:10px;color:#fcd34d;">'+badge+'</span>':''}</div>
                            <div style="font-size:11px;color:#888;margin-bottom:10px;">KDA: ${p.kills}/${p.deaths}/${p.assists}</div>
                            <div style="display:grid;grid-template-columns:1fr auto;gap:3px 18px;font-size:12px;">
                                <span style="color:#aaa;">分均经济</span><span style="color:#00d4e6;font-weight:600;">${safeVal(p[xKey]).toFixed(1)}</span>
                                <span style="color:#aaa;">伤害占比</span><span style="color:#00d4e6;font-weight:600;">${safeVal(p[yKey]).toFixed(1)}%</span>
                                <span style="color:#aaa;">分均伤害</span><span style="color:#00d4e6;font-weight:600;">${safeVal(p[sizeKey]).toFixed(0)}</span>
                                <span style="color:#aaa;">KDA值</span><span style="color:#fcd34d;font-weight:700;">${safeVal(p.kda).toFixed(2)}</span>
                            </div>
                            <div style="margin-top:8px;font-size:10px;color:#666;">💡 点击切换选手 | Ctrl+点击对比</div>`;
                    }
                },
                visualMap: { dimension: 2, min: minKda, max: maxKda, calculable: false, orient: 'vertical', right: 4, top: 'center', itemWidth: 12, itemHeight: 80, text: ['高KDA', '低KDA'], textStyle: { color: '#888', fontSize: 10 }, inRange: { color: ['#e74c3c', '#f39c12', '#3a9bd5', '#00bcd4', '#ffd700'] }, show: players.length > 3 },
                grid: { left: '8%', right: '16%', top: '12%', bottom: '15%', containLabel: true },
                xAxis: { name: xLabel, nameTextStyle: { color: '#999', fontSize: 12 }, nameLocation: 'middle', nameGap: 28, min: Math.max(0, xMin - xPad), max: xMax + xPad, axisLine: { lineStyle: { color: 'rgba(255,255,255,0.15)' } }, axisLabel: { color: '#888', fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.04)', type: 'dashed' } } },
                yAxis: { name: yLabel, nameTextStyle: { color: '#999', fontSize: 12 }, nameLocation: 'middle', nameGap: 40, min: Math.max(0, yMin - yPad), max: yMax + yPad, axisLine: { lineStyle: { color: 'rgba(255,255,255,0.15)' } }, axisLabel: { color: '#888', fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.04)', type: 'dashed' } } },
                series: [{ type: 'scatter', data: data, cursor: 'pointer', markLine: { silent: true, symbol: 'none', label: { show: true, formatter: (p) => p.data.xAxis !== undefined ? '均值X' : (p.data.yAxis !== undefined ? '均值Y' : ''), color: '#888', fontSize: 9, position: 'insideEndTop' }, lineStyle: { color: 'rgba(255,255,255,0.18)', type: 'dashed', width: 1 }, data: [{ xAxis: avgX }, { yAxis: avgY }], animation: false } }]
            };
            scatterChartInstance.setOption(option, true);
            scatterChartInstance.resize();
        }

        function renderBarChart(player) {
            if (!barChartInstance) {
                barChartInstance = echarts.init(document.getElementById('barChart'), 'dark');
                window.addEventListener('resize', () => { if (barChartInstance) barChartInstance.resize(); });
            }
            const config = positionConfigs[currentPosition];
            const categories = config.labels;
            const playerValues = config.keys.map(key => { let val = player[key]; if (key === 'kills_assists') val = (player.kills + player.assists); return safeVal(val); });
            const avgValues = config.avgs.map(key => safeVal(avgStats[key]));
            const series = [
                { name: player.player, type: 'bar', data: playerValues, itemStyle: { color: '#00d4e6', borderRadius: [4, 4, 0, 0] }, barGap: '10%', barCategoryGap: '30%' },
                { name: '均值', type: 'bar', data: avgValues, itemStyle: { color: '#ff6b6b', borderRadius: [4, 4, 0, 0] } }
            ];
            comparePlayers.forEach((idx, order) => {
                const compPlayer = currentFilteredPlayers[idx];
                if (compPlayer) {
                    let compValues = config.keys.map(key => { let val = compPlayer[key]; if (key === 'kills_assists') val = (compPlayer.kills + compPlayer.assists); return safeVal(val); });
                    series.push({ name: compPlayer.player, type: 'bar', data: compValues, itemStyle: { color: order === 0 ? '#ff9800' : '#c084fc', borderRadius: [4, 4, 0, 0] } });
                }
            });
            const option = {
                backgroundColor: 'transparent',
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                legend: { data: series.map(s => s.name), textStyle: { color: '#ccc' }, top: 0 },
                grid: { left: '10%', right: '5%', top: '15%', bottom: '10%', containLabel: true },
                xAxis: { type: 'value', axisLabel: { color: '#888' }, splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } } },
                yAxis: { type: 'category', data: categories, axisLabel: { color: '#ddd', fontSize: 11 }, axisLine: { lineStyle: { color: '#666' } } },
                series: series
            };
            barChartInstance.setOption(option, true);
            barChartInstance.resize();
        }

        function renderHeatmap(players) {
            if (!heatmapChartInstance) {
                heatmapChartInstance = echarts.init(document.getElementById('heatmapChart'), 'dark');
                window.addEventListener('resize', () => { if (heatmapChartInstance) heatmapChartInstance.resize(); });
            }
            const config = positionConfigs[currentPosition];
            const indicators = config.labels;
            const topN = Math.min(players.length, 30);
            const selectedPlayers = players.slice(0, topN);
            const data = [];
            selectedPlayers.forEach((p, idx) => {
                config.keys.forEach((key, keyIdx) => {
                    let val = p[key];
                    if (key === 'kills_assists') val = (p.kills + p.assists);
                    val = safeVal(val);
                    data.push([keyIdx, idx, val]);
                });
            });
            const maxVals = {};
            config.keys.forEach((key, keyIdx) => {
                let maxVal = 0;
                selectedPlayers.forEach(p => {
                    let val = p[key];
                    if (key === 'kills_assists') val = (p.kills + p.assists);
                    val = safeVal(val);
                    if (val > maxVal) maxVal = val;
                });
                maxVals[keyIdx] = maxVal || 1;
            });
            const normalizedData = data.map(item => [item[0], item[1], item[2] / maxVals[item[0]]]);
            const option = {
                backgroundColor: 'transparent',
                tooltip: { position: 'top', formatter: function(params) {
                    const xIdx = params.value[0], yIdx = params.value[1];
                    const rawVal = data.find(d => d[0] === xIdx && d[1] === yIdx)[2];
                    return `${selectedPlayers[yIdx].player}<br>${config.labels[xIdx]}: ${rawVal.toFixed(2)}`;
                } },
                grid: { left: '15%', right: '5%', top: '10%', bottom: '15%', containLabel: true },
                xAxis: { type: 'category', data: config.labels, splitArea: { show: true }, axisLabel: { color: '#ddd', fontSize: 10, interval: 0, rotate: 30 } },
                yAxis: { type: 'category', data: selectedPlayers.map(p => p.player), splitArea: { show: true }, axisLabel: { color: '#ddd', fontSize: 10, width: 100, overflow: 'truncate' } },
                visualMap: { min: 0, max: 1, calculable: true, orient: 'vertical', right: 0, top: 'center', itemWidth: 12, itemHeight: 100, text: ['高', '低'], textStyle: { color: '#888' }, inRange: { color: ['#1a1d24', '#00bcd4'] } },
                series: [{ type: 'heatmap', data: normalizedData, label: { show: false }, emphasis: { itemStyle: { borderColor: '#fff', borderWidth: 1 } } }]
            };
            heatmapChartInstance.setOption(option, true);
            heatmapChartInstance.resize();
        }

        function renderParallel(player) {
            if (!parallelChartInstance) {
                parallelChartInstance = echarts.init(document.getElementById('parallelChart'), 'dark');
                window.addEventListener('resize', () => { if (parallelChartInstance) parallelChartInstance.resize(); });
            }
            const config = positionConfigs[currentPosition];
            const parallelAxis = config.keys.map((key, idx) => ({ dim: idx, name: config.labels[idx], max: config.maxs[idx], axisLabel: { color: '#888' }, nameTextStyle: { color: '#ddd' } }));
            const data = [];
            let playerValues = config.keys.map(key => { let val = player[key]; if (key === 'kills_assists') val = (player.kills + player.assists); return safeVal(val); });
            data.push({ value: playerValues, name: player.player, lineStyle: { color: '#00d4e6', width: 3 }, itemStyle: { color: '#00d4e6' } });
            comparePlayers.forEach((idx, order) => {
                const compPlayer = currentFilteredPlayers[idx];
                if (compPlayer) {
                    let compValues = config.keys.map(key => { let val = compPlayer[key]; if (key === 'kills_assists') val = (compPlayer.kills + compPlayer.assists); return safeVal(val); });
                    data.push({ value: compValues, name: compPlayer.player, lineStyle: { color: order === 0 ? '#ff9800' : '#c084fc', width: 2.5 }, itemStyle: { color: order === 0 ? '#ff9800' : '#c084fc' } });
                }
            });
            let avgValues = config.avgs.map(key => safeVal(avgStats[key]));
            data.push({ value: avgValues, name: '均值', lineStyle: { color: '#ff6b6b', width: 2, type: 'dashed' }, itemStyle: { color: '#ff6b6b' } });
            const option = {
                backgroundColor: 'transparent',
                tooltip: { trigger: 'item', confine: true },
                parallelAxis: parallelAxis,
                parallel: { left: '5%', right: '5%', top: '15%', bottom: '10%', parallelAxisDefault: { axisLine: { lineStyle: { color: '#666' } }, axisLabel: { color: '#888' } } },
                series: [{ type: 'parallel', data: data, lineStyle: { width: 3 }, animationDuration: 800 }]
            };
            parallelChartInstance.setOption(option, true);
            parallelChartInstance.resize();
        }

        // ============================================================
        //  【保存图片模块 - 专业优化版】
        // ============================================================
        function updateExportProgress(pct, text) {
            exportProgress.style.display = 'block';
            exportProgressFill.style.width = pct + '%';
            if (text) loadingOverlay.querySelector('.loading-text').textContent = text;
        }

        async function exportImage() {
            const overlay = loadingOverlay;
            const loadingText = overlay.querySelector('.loading-text');
            overlay.classList.add('show');
            exportProgress.style.display = 'block';
            exportProgressFill.style.width = '0%';
            loadingText.textContent = '准备导出...';

            try {
                // 步骤1：收集所有需要预加载的图片
                updateExportProgress(10, '预加载图片资源...');
                const images = mainArea.querySelectorAll('img');
                const imagePromises = Array.from(images).map(img => {
                    if (img.complete && img.naturalWidth > 0) return Promise.resolve();
                    return new Promise(resolve => {
                        const timeout = setTimeout(() => { resolve(); }, 5000);
                        img.addEventListener('load', () => { clearTimeout(timeout); resolve(); }, { once: true });
                        img.addEventListener('error', () => { clearTimeout(timeout); resolve(); }, { once: true });
                    });
                });
                await Promise.all(imagePromises);

                // 步骤2：确保ECharts图表已完成渲染
                updateExportProgress(35, '等待图表渲染...');
                await new Promise(resolve => setTimeout(resolve, 500));
                if (myChart) myChart.resize();
                if (scatterChartInstance) scatterChartInstance.resize();
                if (barChartInstance) barChartInstance.resize();
                if (heatmapChartInstance) heatmapChartInstance.resize();
                if (parallelChartInstance) parallelChartInstance.resize();
                await new Promise(resolve => setTimeout(resolve, 300));

                // 步骤3：截图
                updateExportProgress(55, '生成高清图片...');
                const canvas = await html2canvas(mainArea, {
                    backgroundColor: '#0b0d12',
                    scale: 3,
                    useCORS: true,
                    allowTaint: false,
                    logging: false,
                    scrollX: 0,
                    scrollY: -window.scrollY,
                    windowWidth: document.documentElement.offsetWidth,
                    windowHeight: document.documentElement.offsetHeight,
                    // ===== 核心修复：在克隆文档中隐藏加载层，确保导出图片纯净 =====
                    onclone: function(clonedDoc) {
                        const clonedLoading = clonedDoc.getElementById('loadingOverlay');
                        if (clonedLoading) clonedLoading.style.display = 'none';
                        
                        const clonedProgress = clonedDoc.getElementById('exportProgress');
                        if (clonedProgress) clonedProgress.style.display = 'none';

                        const clonedImages = clonedDoc.querySelectorAll('img');
                        clonedImages.forEach(img => { if (img.complete && img.naturalWidth === 0) img.style.visibility = 'hidden'; });
                    }
                });

                // 步骤4：下载
                updateExportProgress(85, '保存文件...');
                const playerName = currentFilteredPlayers.length > 0 && currentFilteredPlayers[currentPlayerIndex] ? currentFilteredPlayers[currentPlayerIndex].player.replace(/[^\w\u4e00-\u9fa5]/g, '_') : '未知选手';
                const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
                const filename = `H武道会_${currentPosition}_${playerName}_${timestamp}.png`;
                const link = document.createElement('a');
                link.download = filename;
                link.href = canvas.toDataURL('image/png');
                link.click();

                updateExportProgress(100, '导出完成 ✓');
                await new Promise(resolve => setTimeout(resolve, 600));
            } catch (error) {
                console.error('导出失败:', error);
                loadingText.textContent = '导出失败，请重试';
                await new Promise(resolve => setTimeout(resolve, 1200));
            } finally {
                overlay.classList.remove('show');
                exportProgress.style.display = 'none';
                exportProgressFill.style.width = '0%';
                loadingText.textContent = '数据加载中...';
            }
        }

        // 启动
        loadData();
    </script>
</body>
